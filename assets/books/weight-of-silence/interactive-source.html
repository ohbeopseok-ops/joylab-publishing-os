          <p class="mb-6">하루를 마치고 세면대 거울 앞에 설 때 느껴지는 언어의 과식. 빙산의 거대한 밑동처럼 문장을 떠받쳐야 할 침묵이 증발한 채, 설익은 감정의 파편들이 타인을 찌르고 돌아와 내 가슴을 벤다. 피아니스트가 이전 화음의 찌꺼기를 끊어내는 페달링의 호흡처럼 우리의 말에도 정교한 절제가 필요하다.</p>
          <p class="mb-6">고함이 난무하던 회의실을 단 2분의 침묵으로 정돈하던 선배의 권위, 산사 범종 소리가 사라진 뒤 골짜기에 맴도는 생각의 잔향. 말을 거두자 비로소 타인의 고통이 보이고 나 자신과의 진짜 대화가 시작되었다. 침묵은 감정의 쓰레기를 태우는 가장 거룩한 소각로다.</p>
        `
      },
      {
        id: "ch8",
        title: "8장. 일상의 쉼표를 감내하는 태도와 용기",
        category: "3부: 침묵의 밀도",
        author: "오법석",
        content: `
          <div class="mb-8">
            <span class="text-xs font-sans text-amberClassic-600 font-semibold tracking-wider uppercase">3부 · 침묵의 밀도</span>
            <h2 class="text-2xl font-bold font-serif text-stone-900 dark:text-white mt-1">8장. 일상의 쉼표를 감내하는 태도와 용기</h2>
          </div>
          <p class="mb-6">토요일 아침 눈을 떴을 때 가슴을 짓누르는 죄책감. 하지만 멈춤은 저절로 주어지는 선물이 아니라 관성의 기차에서 비상 브레이크를 당기는 치열한 투쟁이다. 박자의 독재를 멈추는 늘임표 페르마타(Fermata)처럼, 남들이 네 박자로 지나간 자리를 열여섯 박자로 머무는 용기가 필요하다.</p>
          <p class="mb-6">피아노 초보자가 가장 힘들어하는 '손목의 탈력(Relaxation)'처럼 힘을 주는 것보다 힘을 빼는 것이 훨씬 더 숭고한 기술이다. 겨울나무가 잎을 떨구고 침묵 속에서 겨울눈을 벼려내듯, 다이어리에 '아무것도 하지 않음'이라는 정식 약속을 기입하고 타인의 부당한 요구에 단호히 거절의 울타리를 치는 담력을 회복하라.</p>
        `

      {
        id: "ch9",
        title: "9장. 멈추었기에 다시 흐르는 가장 완전한 선율",

        author: "오법석",
        content: `
          <div class="mb-8">
            <span class="text-xs font-sans text-amberClassic-600 font-semibold tracking-wider uppercase">3부 · 침묵의 밀도</span>
            <h2 class="text-2xl font-bold font-serif text-stone-900 dark:text-white mt-1">9장. 멈추었기에 다시 흐르는 가장 완전한 선율</h2>
          </div>
          <p class="mb-6">새벽 여명 속에서 죄책감 없이 눈을 뜬다. 음악에는 첫 강박 대신 직전의 여린 박에서 숨을 들이마시며 시작하는 '아우프탁트(여린내기)'가 있다. 우리는 멈추기 위해 사는 것이 아니라 다시 아름답게 흐르기 위해 멈추는 법을 배운다.</p>
          <p class="mb-6">지하철 2호선 승강장으로 다시 내려선다. 레일의 굉음은 퍼커션 베이스이고 타인의 웅성거림은 거대한 다성음악(Polyphony)의 불협화음 조각으로 수용된다. 시련의 발전부를 건너와 다시 울려 퍼지는 소나타 재현부와 골드베르크의 『아리아 다 카포』처럼, 일상의 행위는 같아도 내면의 깊이는 완전히 달라졌다. 멈추었기에 나는 이제 가장 완전한 내 삶의 선율을 향해 다시 흐른다.</p>
        `
      },
      {
        id: "epilogue",
        title: "에필로그: 침묵이 음악이 되는 찰나의 순간에 머물며",
        category: "에필로그",
        author: "오법석",
        content: `
          <h2 class="text-xl font-bold font-serif text-stone-900 dark:text-white mb-2">에필로그</h2>
          <h3 class="text-sm font-serif text-amberClassic-600 dark:text-amberClassic-400 mb-8 pb-4 border-b">침묵이 음악이 되는 찰나의 순간에 머물며</h3>
          
          <p class="mb-6">음악회가 끝나면 언제나 가장 먼저 무대를 밝히던 조명이 꺼지고, 천장을 가득 메웠던 관객들의 우레와 같은 갈채 역시 하나둘씩 어둠 속으로 잦아든다. 연주자들은 악기를 케이스에 조심스럽게 갈무리하고, 객석을 채웠던 사람들은 외투 깃을 여미며 일상 속으로 발걸음을 돌린다.</p>
          <p class="mb-6">그러나 모두가 썰물처럼 빠져나간 텅 빈 콘서트홀의 붉은 벨벳 의자 위에 홀로 남아 있을 때, 나는 비로소 알게 된다. 공연은 사람들이 떠난 자리에서 침묵이라는 보이지 않는 두 번째 악장을 비로소 시작한다는 사실을. 수백억 개의 음향 입자들은 소멸한 것이 아니라 홀의 목재 벽면 결마다 투명한 지문처럼 스며들어 미세한 체온으로 허공을 덥히고 있었다.</p>
          <p class="mb-6">악보의 맨 마지막 장을 넘기면 만나는 두 개의 기호, 페르마타와 겹세로줄(End bar line). 위대한 피아니스트들은 마지막 음을 누른 뒤 곧바로 성급하게 몸을 일으키지 않는다. 5초, 10초, 15초……. 소리가 귀로는 더 이상 들리지 않는 절대적 무음의 수면 아래로 가라앉을 때까지, 연주자는 온 존재를 모아 소리의 마지막 숨결을 끝까지 배웅한다. 그 찰나의 지체야말로 소리와 침묵이 완벽하게 입을 맞추는 가장 신성한 순간이다.</p>
          <p class="mb-6">이제 이 책을 쥐고 있는 당신의 손을 가만히 내려다본다. 어디였든 상관없습니다. 당신이 이 책의 문장과 문장 사이, 행과 행 사이에 고여 있던 그 서늘하고 묵직한 쉼표들을 통과하는 동안, 세상이 당신 등 뒤에서 밟아대던 가속 페달의 굉음이 아주 조금이라도 잦아들었기를 바랍니다.</p>
          <p class="mb-6">침묵은 결핍이 아닙니다. 비어 있음은 패배가 아닙니다. 그것은 세상 그 어떤 화려한 소리보다도 더 순도 높은 에너지를 품고 있는, 새로운 삶의 선율을 탄생시키기 위한 가장 거룩하고 단단한 자궁입니다.</p>
          <p class="mb-6">소음의 시대를 함께 건너온 나의 가련하고도 아름다운 동료 연주자여. 당신의 오선지 위에 영원히 머물 그 거룩하고 평화로운 쉼표를 축복하며, 이제 나의 지휘봉을 허공 속으로 조용히 내려놓습니다.</p>
        `
      }
    ];

    // State Management
    let currentChapterIndex = 0;
    let currentFontSize = 16;
    let currentLineHeight = 2.1;
    let currentTheme = 'paper';
    let isSerif = true;
    let isAmbientPlaying = false;
    let audioCtx = null;
    let ambientGainNode = null;
    let noiseNode = null;

    // DOM Elements
    const chapterContentEl = document.getElementById('chapterContent');
    const runningHeadChapterEl = document.getElementById('runningHeadChapter');
    const currentChapterBadgeEl = document.getElementById('currentChapterBadge');
    const currentPageNumberEl = document.getElementById('currentPageNumber');
    const totalPageNumberEl = document.getElementById('totalPageNumber');
    const readingProgressBarEl = document.getElementById('readingProgressBar');
    const tocNavContainerEl = document.getElementById('tocNavContainer');
    const tocSidebarEl = document.getElementById('tocSidebar');
    const btnToggleTocEl = document.getElementById('btnToggleToc');
    const btnCloseTocEl = document.getElementById('btnCloseToc');
    const btnPrevChapterEl = document.getElementById('btnPrevChapter');
    const btnNextChapterEl = document.getElementById('btnNextChapter');
    const btnSettingsEl = document.getElementById('btnSettings');
    const settingsPanelEl = document.getElementById('settingsPanel');
    const readerScrollAreaEl = document.getElementById('readerScrollArea');
    const btnPrintEl = document.getElementById('btnPrint');
    const btnAmbientSoundEl = document.getElementById('btnAmbientSound');
    const ambientIconEl = document.getElementById('ambientIcon');

    // Initialize Reader
    function initReader() {
      buildTOC();
      renderChapter(0);
      setupEventListeners();
      setupTypographyControls();
      setupThemes();
      calculateTotalPages();
    }

    // Build TOC in sidebar
    function buildTOC() {
      tocNavContainerEl.innerHTML = '';
      BOOK_DATA.forEach((chap, idx) => {
        const itemBtn = document.createElement('button');
        itemBtn.className = `w-full text-left p-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition flex items-start gap-2.5 ${idx === 0 ? 'text-amberClassic-600 font-semibold bg-amberClassic-500/10' : 'text-stone-600 dark:text-stone-400'}`;
        itemBtn.innerHTML = `
          <span class="text-[10px] font-mono text-stone-400 mt-0.5">${String(idx + 1).padStart(2, '0')}</span>
          <div class="flex-1 truncate">
            <span class="text-[10px] block text-stone-400 uppercase tracking-wider">${chap.category}</span>
            <span class="truncate block text-xs">${chap.title}</span>
          </div>
        `;
        itemBtn.addEventListener('click', () => {
          renderChapter(idx);
          if (window.innerWidth < 1024) {
            tocSidebarEl.classList.add('hidden');
          }
        });
        tocNavContainerEl.appendChild(itemBtn);
      });
    }

    // Render active chapter
    function renderChapter(index) {
      if (index < 0 || index >= BOOK_DATA.length) return;
      currentChapterIndex = index;
      const chapter = BOOK_DATA[index];

      // Fade out/in
      chapterContentEl.style.opacity = '0';
      chapterContentEl.style.transform = 'translateY(6px)';

      setTimeout(() => {
        chapterContentEl.innerHTML = chapter.content;
        runningHeadChapterEl.textContent = chapter.title.split('.')[0];
        currentChapterBadgeEl.textContent = chapter.title;
        currentPageNumberEl.textContent = calculatePageOffset(index);
        
        chapterContentEl.style.opacity = '1';
        chapterContentEl.style.transform = 'translateY(0)';
        readerScrollAreaEl.scrollTo({ top: 0, behavior: 'smooth' });

        updateProgressBar();
        updateTOCActiveState();
        updateNavButtons();
      }, 120);
    }

    function calculatePageOffset(index) {
      const pageCounts = [1, 2, 4, 16, 16, 16, 20, 20, 20, 18, 18, 20, 6];
      let sum = 0;
      for (let i = 0; i < index; i++) {
        sum += pageCounts[i] || 4;
      }
      return sum + 1;
    }

    function calculateTotalPages() {
      totalPageNumberEl.textContent = '174';
    }

    function updateProgressBar() {
      const progress = ((currentChapterIndex + 1) / BOOK_DATA.length) * 100;
      readingProgressBarEl.style.width = `${progress}%`;
    }

    function updateTOCActiveState() {
      const tocButtons = tocNavContainerEl.querySelectorAll('button');
      tocButtons.forEach((btn, idx) => {
        if (idx === currentChapterIndex) {
          btn.classList.add('text-amberClassic-600', 'font-semibold', 'bg-amberClassic-500/10');
          btn.classList.remove('text-stone-600', 'dark:text-stone-400');
        } else {
          btn.classList.remove('text-amberClassic-600', 'font-semibold', 'bg-amberClassic-500/10');
          btn.classList.add('text-stone-600', 'dark:text-stone-400');
        }
      });
    }

    function updateNavButtons() {
      btnPrevChapterEl.disabled = currentChapterIndex === 0;
      btnNextChapterEl.disabled = currentChapterIndex === BOOK_DATA.length - 1;
    }

    // Event Listeners
    function setupEventListeners() {
      btnToggleTocEl.addEventListener('click', () => {
        tocSidebarEl.classList.toggle('hidden');
      });
      btnCloseTocEl.addEventListener('click', () => {
        tocSidebarEl.classList.add('hidden');
      });
      btnPrevChapterEl.addEventListener('click', () => {
        if (currentChapterIndex > 0) renderChapter(currentChapterIndex - 1);
      });
      btnNextChapterEl.addEventListener('click', () => {
        if (currentChapterIndex < BOOK_DATA.length - 1) renderChapter(currentChapterIndex + 1);
      });

      // Settings dropdown toggle
      btnSettingsEl.addEventListener('click', (e) => {
        e.stopPropagation();
        settingsPanelEl.classList.toggle('hidden');
      });
      document.addEventListener('click', (e) => {
        if (!settingsPanelEl.contains(e.target) && e.target !== btnSettingsEl) {
          settingsPanelEl.classList.add('hidden');
        }
      });

      // Keyboard arrow navigation
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && currentChapterIndex > 0) {
          renderChapter(currentChapterIndex - 1);
        } else if (e.key === 'ArrowRight' && currentChapterIndex < BOOK_DATA.length - 1) {
          renderChapter(currentChapterIndex + 1);
        }
      });

      // Print PDF handler
      btnPrintEl.addEventListener('click', () => {
        window.print();
      });

      // Sound ambiance toggle
      btnAmbientSoundEl.addEventListener('click', toggleAmbientSound);
    }

    // Typography & View Controls
    function setupTypographyControls() {
      const btnFontInc = document.getElementById('btnFontInc');
      const btnFontDec = document.getElementById('btnFontDec');
      const fontSizeDisplay = document.getElementById('fontSizeDisplay');
      const btnLineHeightInc = document.getElementById('btnLineHeightInc');
      const btnLineHeightDec = document.getElementById('btnLineHeightDec');
      const lineHeightDisplay = document.getElementById('lineHeightDisplay');
      const btnFontSerif = document.getElementById('btnFontSerif');
      const btnFontSans = document.getElementById('btnFontSans');

      btnFontInc.addEventListener('click', () => {
        if (currentFontSize < 24) {
          currentFontSize += 1;
          applyTypography();
        }
      });
      btnFontDec.addEventListener('click', () => {
        if (currentFontSize > 13) {
          currentFontSize -= 1;
          applyTypography();
        }
      });
      btnLineHeightInc.addEventListener('click', () => {
        if (currentLineHeight < 2.8) {
          currentLineHeight = +(currentLineHeight + 0.1).toFixed(1);
          applyTypography();
        }
      });
      btnLineHeightDec.addEventListener('click', () => {
        if (currentLineHeight > 1.6) {
          currentLineHeight = +(currentLineHeight - 0.1).toFixed(1);
          applyTypography();
        }
      });

      btnFontSerif.addEventListener('click', () => {
        isSerif = true;
        btnFontSerif.className = 'py-1 px-2 rounded border border-amberClassic-500 text-amberClassic-600 font-serif text-xs font-semibold';
        btnFontSans.className = 'py-1 px-2 rounded border border-stone-200 dark:border-noir-700 text-stone-500 font-sans text-xs';
        applyTypography();
      });

      btnFontSans.addEventListener('click', () => {
        isSerif = false;
        btnFontSans.className = 'py-1 px-2 rounded border border-amberClassic-500 text-amberClassic-600 font-sans text-xs font-semibold';
        btnFontSerif.className = 'py-1 px-2 rounded border border-stone-200 dark:border-noir-700 text-stone-500 font-serif text-xs';
        applyTypography();
      });
    }

    function applyTypography() {
      chapterContentEl.style.fontSize = `${currentFontSize}px`;
      chapterContentEl.style.lineHeight = `${currentLineHeight}`;
      chapterContentEl.style.fontFamily = isSerif ? '"Noto Serif KR", Georgia, serif' : 'Pretendard, -apple-system, sans-serif';
      document.getElementById('fontSizeDisplay').textContent = `${currentFontSize}px`;
      document.getElementById('lineHeightDisplay').textContent = `${currentLineHeight}`;
    }

    // Theme selector
    function setupThemes() {
      const themeButtons = document.querySelectorAll('.btn-theme');
      themeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const selectedTheme = btn.dataset.theme;
          document.body.className = `theme-${selectedTheme} font-serif transition-colors duration-300 min-h-screen flex flex-col antialiased`;
          if (selectedTheme === 'dark' || selectedTheme === 'oled') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        });
      });
    }

    // Web Audio Ambient Generator (Rain/Vinyl crackle subtle white-noise simulation)
    function toggleAmbientSound() {
      if (!isAmbientPlaying) {
        startAmbientSound();
      } else {
        stopAmbientSound();
      }
    }

    function startAmbientSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        
        // Pink noise generator buffer
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
          output[i] *= 0.04; // Gentle volume
          b6 = white * 0.115926;
        }

        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = noiseBuffer;
        noiseNode.loop = true;

        // Gentle lowpass filter for deep rain/hall vibe
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, audioCtx.currentTime);

        ambientGainNode = audioCtx.createGain();
        ambientGainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
        ambientGainNode.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 1.5);

        noiseNode.connect(filter);
        filter.connect(ambientGainNode);
        ambientGainNode.connect(audioCtx.destination);

        noiseNode.start();
        isAmbientPlaying = true;
        ambientIconEl.className = 'fa-solid fa-volume-high text-amberClassic-500 animate-pulse text-sm';
        btnAmbientSoundEl.title = '사색 앰비언스 끄기';
      } catch (err) {
        console.error('Audio initialization error:', err);
      }
    }

    function stopAmbientSound() {
      if (ambientGainNode && audioCtx) {
        ambientGainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        setTimeout(() => {
          if (noiseNode) noiseNode.stop();
          if (audioCtx) audioCtx.close();
          isAmbientPlaying = false;
          ambientIconEl.className = 'fa-solid fa-volume-xmark text-sm';
          btnAmbientSoundEl.title = '사색 앰비언스 사운드 켜기';
        }, 700);
      }
    }

    // Run on ready
    window.addEventListener('DOMContentLoaded', initReader);
  </script>
