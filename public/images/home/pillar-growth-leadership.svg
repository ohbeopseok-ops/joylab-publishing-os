<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">성장·리더십 Pillar Visual</title><desc id="d">성과, 피드백, 인정, 공정성의 선순환을 표현한 JoyLab 성장·리더십 비주얼</desc><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071938"/><stop offset=".58" stop-color="#102C5D"/><stop offset="1" stop-color="#6C5630"/></linearGradient></defs><rect width="1200" height="700" fill="url(#g)"/><g opacity=".3" fill="none" stroke="#FFD86A" stroke-width="4"><circle cx="910" cy="340" r="180"/><path d="M910 160v360M730 340h360"/></g><g font-family="Arial,sans-serif"><text x="70" y="95" fill="#EBC96F" font-size="24" font-weight="700" letter-spacing="4">GROWTH &amp; LEADERSHIP</text><text x="70" y="180" fill="#fff" font-size="64" font-weight="800">성과 → 피드백 → 성장</text><text x="70" y="235" fill="#D9E1EC" font-size="26">공정한 기준과 인정이 팀의 실행력을 만듭니다</text><g transform="translate(70 500)"><rect width="230" height="96" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/><text x="28" y="40" fill="#FFD83D" font-size="18" font-weight="700">PERFORMANCE</text><text x="28" y="72" fill="#fff" font-size="23">성과 기준</text><path d="M248 48h58" stroke="#D6B855" stroke-width="4"/><rect x="320" width="230" height="96" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/><text x="348" y="40" fill="#FFD83D" font-size="18" font-weight="700">FEEDBACK</text><text x="348" y="72" fill="#fff" font-size="23">행동 피드백</text><path d="M568 48h58" stroke="#D6B855" stroke-width="4"/><rect x="640" width="230" height="96" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".15"/><text x="668" y="40" fill="#FFD83D" font-size="18" font-weight="700">RECOGNITION</text><text x="668" y="72" fill="#fff" font-size="23">인정과 강화</text></g></g></svg>