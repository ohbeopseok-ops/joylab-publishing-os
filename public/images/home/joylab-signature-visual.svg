<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">JoyLab Research System Signature Visual</title><desc id="desc">Fact Interpretation Scenario Action 흐름과 투자·경제, AI·생산성, 성장·리더십 세 축을 연결한 시그니처 비주얼</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#061632"/><stop offset=".58" stop-color="#0B1F4D"/><stop offset="1" stop-color="#123F85"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#1677FF" stop-opacity=".78"/><stop offset="1" stop-color="#1677FF" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1230" cy="380" r="310" fill="url(#glow)"/><g fill="none" stroke="#6AA8FF" stroke-opacity=".34"><circle cx="1220" cy="390" r="230"/><circle cx="1220" cy="390" r="150"/><path d="M950 390h540M1220 120v540"/></g><g font-family="Arial, sans-serif"><text x="120" y="150" fill="#6AA8FF" font-size="26" font-weight="700" letter-spacing="5">JOYLAB RESEARCH SYSTEM</text><text x="120" y="255" fill="#FFFFFF" font-size="68" font-weight="800">복잡한 정보를</text><text x="120" y="335" fill="#FFFFFF" font-size="68" font-weight="800">판단 가능한 구조로</text><g transform="translate(120 470)"><rect x="0" y="0" width="260" height="90" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".14"/><text x="28" y="38" fill="#FFD83D" font-size="18" font-weight="700">01 FACT</text><text x="28" y="67" fill="#E6EEF8" font-size="20">무엇이 사실인가</text><path d="M276 45h72" stroke="#6AA8FF" stroke-width="3"/><rect x="365" y="0" width="260" height="90" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".14"/><text x="393" y="38" fill="#64A4FF" font-size="18" font-weight="700">02 INTERPRETATION</text><text x="393" y="67" fill="#E6EEF8" font-size="20">무엇을 의미하나</text><path d="M641 45h72" stroke="#6AA8FF" stroke-width="3"/><rect x="730" y="0" width="260" height="90" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".14"/><text x="758" y="38" fill="#64A4FF" font-size="18" font-weight="700">03 SCENARIO</text><text x="758" y="67" fill="#E6EEF8" font-size="20">어떤 가능성이 있나</text><path d="M1006 45h72" stroke="#6AA8FF" stroke-width="3"/><rect x="1095" y="0" width="260" height="90" rx="18" fill="#FFD83D"/><text x="1123" y="38" fill="#0B1F4D" font-size="18" font-weight="800">04 ACTION</text><text x="1123" y="67" fill="#0B1F4D" font-size="20" font-weight="700">무엇을 실행할까</text></g><g transform="translate(120 690)"><text x="0" y="0" fill="#9EB5D4" font-size="19">INVESTMENT &amp; ECONOMY</text><text x="0" y="42" fill="#FFFFFF" font-size="30" font-weight="700">투자·경제</text><text x="430" y="0" fill="#9EB5D4" font-size="19">AI &amp; PRODUCTIVITY</text><text x="430" y="42" fill="#FFFFFF" font-size="30" font-weight="700">AI·생산성</text><text x="820" y="0" fill="#9EB5D4" font-size="19">GROWTH &amp; LEADERSHIP</text><text x="820" y="42" fill="#FFFFFF" font-size="30" font-weight="700">성장·리더십</text></g></g></svg>