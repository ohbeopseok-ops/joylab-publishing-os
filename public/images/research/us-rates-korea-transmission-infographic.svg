<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">미국 금리에서 한국 반도체까지 7단계 전염경로</title>
  <desc id="desc">미국 10년물, 30년물, 국채 입찰, 원달러, KOSPI 외국인, 삼성전자와 SK하이닉스 외국인, EPS Revision으로 이어지는 7단계 흐름</desc>
  <rect width="1600" height="1000" fill="#08172F"/>
  <text x="110" y="105" fill="#68AFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">JOYLAB · TRANSMISSION MAP</text>
  <text x="110" y="180" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="54" font-weight="800">미국 금리 충격은 어디를 거쳐 한국 반도체에 도착하나</text>
  <text x="110" y="235" fill="#A9BCD7" font-family="Arial, sans-serif" font-size="28">매일 확인할 7단계 순서</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(110 330)"><circle cx="55" cy="55" r="55" fill="#1677FF"/><text x="55" y="66" text-anchor="middle" fill="#FFF" font-size="34" font-weight="800">1</text><text x="135" y="48" fill="#FFF" font-size="34" font-weight="800">US 10Y</text><text x="135" y="86" fill="#9CB5D4" font-size="25">글로벌 할인율</text></g>
    <path d="M410 385H500" stroke="#3A85E8" stroke-width="6"/><path d="M487 370L510 385L487 400" fill="none" stroke="#3A85E8" stroke-width="6"/>
    <g transform="translate(530 330)"><circle cx="55" cy="55" r="55" fill="#1677FF"/><text x="55" y="66" text-anchor="middle" fill="#FFF" font-size="34" font-weight="800">2</text><text x="135" y="48" fill="#FFF" font-size="34" font-weight="800">US 30Y</text><text x="135" y="86" fill="#9CB5D4" font-size="25">재정·기간 프리미엄</text></g>
    <path d="M830 385H920" stroke="#3A85E8" stroke-width="6"/><path d="M907 370L930 385L907 400" fill="none" stroke="#3A85E8" stroke-width="6"/>
    <g transform="translate(950 330)"><circle cx="55" cy="55" r="55" fill="#1677FF"/><text x="55" y="66" text-anchor="middle" fill="#FFF" font-size="34" font-weight="800">3</text><text x="135" y="48" fill="#FFF" font-size="34" font-weight="800">Auction</text><text x="135" y="86" fill="#9CB5D4" font-size="25">수요의 질</text></g>

    <path d="M1235 450V535" stroke="#3A85E8" stroke-width="6"/><path d="M1220 522L1235 545L1250 522" fill="none" stroke="#3A85E8" stroke-width="6"/>

    <g transform="translate(950 570)"><circle cx="55" cy="55" r="55" fill="#4C8FEA"/><text x="55" y="66" text-anchor="middle" fill="#FFF" font-size="34" font-weight="800">4</text><text x="135" y="48" fill="#FFF" font-size="34" font-weight="800">USD/KRW</text><text x="135" y="86" fill="#9CB5D4" font-size="25">환율 증폭기</text></g>
    <path d="M930 625H840" stroke="#3A85E8" stroke-width="6"/><path d="M853 610L830 625L853 640" fill="none" stroke="#3A85E8" stroke-width="6"/>
    <g transform="translate(530 570)"><circle cx="55" cy="55" r="55" fill="#4C8FEA"/><text x="55" y="66" text-anchor="middle" fill="#FFF" font-size="34" font-weight="800">5</text><text x="135" y="48" fill="#FFF" font-size="34" font-weight="800">KOSPI 외국인</text><text x="135" y="86" fill="#9CB5D4" font-size="25">시장 익스포저</text></g>
    <path d="M510 625H420" stroke="#3A85E8" stroke-width="6"/><path d="M433 610L410 625L433 640" fill="none" stroke="#3A85E8" stroke-width="6"/>
    <g transform="translate(110 570)"><circle cx="55" cy="55" r="55" fill="#4C8FEA"/><text x="55" y="66" text-anchor="middle" fill="#FFF" font-size="34" font-weight="800">6</text><text x="135" y="48" fill="#FFF" font-size="34" font-weight="800">삼성·하이닉스</text><text x="135" y="86" fill="#9CB5D4" font-size="25">종목별 외국인 수급</text></g>

    <path d="M165 695V785" stroke="#3A85E8" stroke-width="6"/><path d="M150 772L165 795L180 772" fill="none" stroke="#3A85E8" stroke-width="6"/>
    <g transform="translate(110 820)"><circle cx="55" cy="55" r="55" fill="#0C397E" stroke="#68AFFF" stroke-width="3"/><text x="55" y="66" text-anchor="middle" fill="#FFF" font-size="34" font-weight="800">7</text><text x="135" y="48" fill="#FFF" font-size="34" font-weight="800">EPS Revision</text><text x="135" y="86" fill="#9CB5D4" font-size="25">펀더멘털이 다시 주가를 지배하는지 확인</text></g>
  </g>
  <rect x="900" y="815" width="590" height="105" rx="20" fill="#0E2A59" stroke="#2F6EB8"/>
  <text x="940" y="858" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="29" font-weight="800">JoyLab 판단 원칙</text>
  <text x="940" y="897" fill="#A9C5E7" font-family="Arial, sans-serif" font-size="25">금리·환율·수급·이익을 분리해서 본다.</text>
</svg>