<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F7FAFF"/><text x="90" y="105" fill="#0B1F4D" font-family="Arial,sans-serif" font-size="54" font-weight="800">10년물과 30년물은 같은 5%가 아니다</text><g transform="translate(100 220)" font-family="Arial,sans-serif"><rect width="650" height="500" rx="28" fill="#fff" stroke="#D9E5F5"/><text x="55" y="80" fill="#1677FF" font-size="44" font-weight="800">US 10Y</text><text x="55" y="145" fill="#0B1F4D" font-size="32" font-weight="700">글로벌 할인율</text><text x="55" y="215" fill="#5B6F8D" font-size="26">연준 · 성장 · 물가 기대</text><text x="55" y="285" fill="#5B6F8D" font-size="26">PER · 성장주 밸류에이션</text><text x="55" y="410" fill="#0B1F4D" font-size="68" font-weight="800">4.93%</text><g transform="translate(750 0)"><rect width="650" height="500" rx="28" fill="#0B1F4D"/><text x="55" y="80" fill="#78B5FF" font-size="44" font-weight="800">US 30Y</text><text x="55" y="145" fill="#fff" font-size="32" font-weight="700">초장기 자본가격</text><text x="55" y="215" fill="#B8CCE8" font-size="26">재정 · 공급 · 기간프리미엄</text><text x="55" y="285" fill="#B8CCE8" font-size="26">CAPEX · 모기지 · 인프라 비용</text><text x="55" y="410" fill="#FFD76A" font-size="68" font-weight="800">5.38%</text></g></g><text x="100" y="805" fill="#0B1F4D" font-family="Arial,sans-serif" font-size="30" font-weight="700">30년물이 높다는 것은 장기 자본의 가격 자체가 비싸졌다는 의미다.</text></svg>