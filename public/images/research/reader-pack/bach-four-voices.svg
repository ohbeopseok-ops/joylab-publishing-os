<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0d1522"/><text x="80" y="85" fill="#d7b77a" font-family="sans-serif" font-size="24">COUNTERPOINT MAP</text><text x="80" y="155" fill="#fff" font-family="sans-serif" font-size="40" font-weight="700">복잡함과 혼란은 같은 것이 아니다</text><g fill="none" stroke-width="7"><path d="M90 290 C260 180 430 390 600 280 S930 390 1110 265" stroke="#d7b77a"/><path d="M90 360 C260 470 430 240 600 360 S930 230 1110 375" stroke="#8aa4c8"/><path d="M90 430 C260 340 430 520 600 420 S930 510 1110 410" stroke="#b9c6d8"/><path d="M90 500 C260 560 430 400 600 500 S930 420 1110 505" stroke="#8e7b61"/></g><text x="80" y="600" fill="#cbd5e1" font-family="sans-serif" font-size="25">서로 다른 선율이 독립성을 유지하면서도 관계를 맺을 때, 복잡함은 질서가 된다.</text></svg>