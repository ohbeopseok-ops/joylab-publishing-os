<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#111722"/><text x="80" y="85" fill="#d7b77a" font-family="sans-serif" font-size="24">STOP LIST</text><text x="80" y="155" fill="#fff" font-family="sans-serif" font-size="40" font-weight="700">새 루틴보다 먼저 정할 것: 하지 않을 것 3개</text><g font-family="sans-serif" font-size="28"><rect x="90" y="255" width="1020" height="80" rx="18" fill="#172033"/><text x="130" y="307" fill="#fff">01  퇴근 후 업무 메신저를 반복 확인하지 않는다</text><rect x="90" y="365" width="1020" height="80" rx="18" fill="#172033"/><text x="130" y="417" fill="#fff">02  중요하지 않은 약속 하나를 줄인다</text><rect x="90" y="475" width="1020" height="80" rx="18" fill="#172033"/><text x="130" y="527" fill="#fff">03  이동 시간을 전부 콘텐츠로 채우지 않는다</text></g><text x="80" y="620" fill="#94a3b8" font-family="serif" font-size="22">회복기에는 추가보다 제거가 먼저일 수 있다.</text></svg>