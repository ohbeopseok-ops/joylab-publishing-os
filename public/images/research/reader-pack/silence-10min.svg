<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#101827"/><text x="80" y="85" fill="#d7b77a" font-family="sans-serif" font-size="24">10-MINUTE NO-INPUT PRACTICE</text><text x="80" y="155" fill="#fff" font-family="sans-serif" font-size="40" font-weight="700">하루 한 번, 10분의 무입력 구간</text><circle cx="310" cy="355" r="150" fill="none" stroke="#d7b77a" stroke-width="12"/><text x="310" y="375" fill="#fff" font-family="sans-serif" font-size="76" text-anchor="middle">10</text><text x="310" y="420" fill="#cbd5e1" font-family="sans-serif" font-size="22" text-anchor="middle">minutes</text><g font-family="sans-serif" font-size="28" fill="#e5e7eb"><text x="560" y="285">• 화면을 보지 않는다</text><text x="560" y="345">• 음악을 켜지 않는다</text><text x="560" y="405">• 할 일을 정리하지 않는다</text><text x="560" y="465">• 떠오르는 생각을 억지로 정리하지 않는다</text></g><text x="80" y="590" fill="#94a3b8" font-family="serif" font-size="22">목표는 잘 쉬는 것이 아니라, 비어 있는 상태를 견디는 감각을 회복하는 것.</text></svg>