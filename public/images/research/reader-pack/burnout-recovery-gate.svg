<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0d1624"/><text x="80" y="85" fill="#d7b77a" font-family="sans-serif" font-size="24">RECOVERY GATE</text><text x="80" y="155" fill="#fff" font-family="sans-serif" font-size="40" font-weight="700">회복을 3단계로 나누면 무엇이 달라질까</text><g font-family="sans-serif" text-anchor="middle"><rect x="95" y="270" width="275" height="150" rx="24" fill="#172033" stroke="#d7b77a" stroke-width="5"/><text x="232" y="330" fill="#fff" font-size="34">1. REDUCE</text><text x="232" y="375" fill="#cbd5e1" font-size="22">줄이기</text><rect x="462" y="270" width="275" height="150" rx="24" fill="#172033" stroke="#8aa4c8" stroke-width="5"/><text x="599" y="330" fill="#fff" font-size="34">2. RECOVER</text><text x="599" y="375" fill="#cbd5e1" font-size="22">회복하기</text><rect x="829" y="270" width="275" height="150" rx="24" fill="#172033" stroke="#b9c6d8" stroke-width="5"/><text x="966" y="330" fill="#fff" font-size="34">3. RE-ENTER</text><text x="966" y="375" fill="#cbd5e1" font-size="22">다시 들어가기</text></g><text x="80" y="555" fill="#cbd5e1" font-family="sans-serif" font-size="26">핵심: Reduce를 건너뛰고 곧바로 Re-enter를 시도하지 않는다.</text></svg>