<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#131720"/><text x="80" y="85" fill="#d7b77a" font-family="sans-serif" font-size="24">FOUR VOICES OF LIFE</text><text x="80" y="155" fill="#fff" font-family="sans-serif" font-size="40" font-weight="700">삶을 네 개의 선율로 나눠 보기</text><g font-family="sans-serif" text-anchor="middle"><g><circle cx="245" cy="350" r="105" fill="#172033" stroke="#d7b77a" stroke-width="5"/><text x="245" y="345" fill="#fff" font-size="31">WORK</text><text x="245" y="385" fill="#94a3b8" font-size="20">결과</text></g><g><circle cx="485" cy="350" r="105" fill="#172033" stroke="#8aa4c8" stroke-width="5"/><text x="485" y="345" fill="#fff" font-size="31">RELATION</text><text x="485" y="385" fill="#94a3b8" font-size="20">관계</text></g><g><circle cx="725" cy="350" r="105" fill="#172033" stroke="#b9c6d8" stroke-width="5"/><text x="725" y="345" fill="#fff" font-size="31">RECOVERY</text><text x="725" y="385" fill="#94a3b8" font-size="20">회복</text></g><g><circle cx="965" cy="350" r="105" fill="#172033" stroke="#8e7b61" stroke-width="5"/><text x="965" y="345" fill="#fff" font-size="31">GROWTH</text><text x="965" y="385" fill="#94a3b8" font-size="20">성장</text></g></g><text x="80" y="590" fill="#cbd5e1" font-family="sans-serif" font-size="24">균형은 25%씩 나누는 일이 아니라, 전체 음악이 무너지지 않도록 관계를 조정하는 일이다.</text></svg>