<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AI 추론에서 삼성전자·SK하이닉스 실적으로</title><desc id="d">AI 추론 수요가 HBM, ASP, 수율, 마진, EPS로 이어지는 투자 구조</desc><defs>
