<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#071735"/><text x="90" y="105" fill="#7EB6FF" font-family="Arial,sans-serif" font-size="28" font-weight="700">JOYLAB · U.S. RATES RESEARCH</text><text x="90" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="800">중국보다 중요한 변화: 미 국채 매수자 구조</text><text x="90" y="250" fill="#AFC6E5" font-family="Arial,sans-serif" font-size="28">Official → Private → Leveraged Money</text><g transform="translate(95 360)" font-family="Arial,sans-serif"><rect width="380" height="250" rx="28" fill="#10295B" stroke="#2E7CE8"/><text x="190" y="72" text-anchor="middle" fill="#fff" font-size="36" font-weight="800">중앙은행·정부</text><text x="190" y="120" text-anchor="middle" fill="#8FBFFF" font-size="25">외환보유 · 장기보유</text><text x="190" y="180" text-anchor="middle" fill="#fff" font-size="30">가격 민감도 낮음</text><path d="M400 125h130" stroke="#4FA3FF" stroke-width="9"/><path d="M515 105l28 20-28 20" fill="none" stroke="#4FA3FF" stroke-width="9"/><g transform="translate(550 0)"><rect width="380" height="250" rx="28" fill="#10295B" stroke="#2E7CE8"/><text x="190" y="72" text-anchor="middle" fill="#fff" font-size="36" font-weight="800">민간 자금</text><text x="190" y="120" text-anchor="middle" fill="#8FBFFF" font-size="25">은행 · 운용사 · 연기금</text><text x="190" y="180" text-anchor="middle" fill="#fff" font-size="30">수익률 민감도 상승</text></g><path d="M950 125h130" stroke="#4FA3FF" stroke-width="9"/><path d="M1065 105l28 20-28 20" fill="none" stroke="#4FA3FF" stroke-width="9"/><g transform="translate(1100 0)"><rect width="380" height="250" rx="28" fill="#0C397E" stroke="#69AFFF" stroke-width="2"/><text x="190" y="72" text-anchor="middle" fill="#fff" font-size="36" font-weight="800">헤지펀드</text><text x="190" y="120" text-anchor="middle" fill="#A8D0FF" font-size="25">레포 · 베이시스 · 레버리지</text><text x="190" y="180" text-anchor="middle" fill="#FFD76A" font-size="30" font-weight="800">변동성 증폭 가능</text></g></g><text x="90" y="760" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">핵심: 누가 팔았나보다 누가 다음 공급을 흡수할지가 중요하다.</text><text x="90" y="820" fill="#7E9BC2" font-family="Arial,sans-serif" font-size="24">Fact → Buyer Regime → Yield → Equity</text></svg>