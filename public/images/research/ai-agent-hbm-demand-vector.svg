<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AI 에이전트가 HBM 수요를 늘리는 이유</title><desc id="d">AI Agent 반복 추론과 KV Cache가 HBM 수요를 확대하는 구조</desc><defs>
