<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F7FAFF"/><text x="90" y="105" fill="#0B1F4D" font-family="Arial,sans-serif" font-size="54" font-weight="800">미 국채 입찰은 이 순서로 읽는다</text><text x="90" y="160" fill="#5B6F8D" font-family="Arial,sans-serif" font-size="26">Headline 숫자 하나가 아니라 수요의 질을 단계적으로 확인</text><g transform="translate(90 300)" font-family="Arial,sans-serif"><g><circle cx="110" cy="110" r="105" fill="#0B1F4D"/><text x="110" y="98" text-anchor="middle" fill="#7EB6FF" font-size="26" font-weight="700">01</text><text x="110" y="140" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">Tail</text></g><path d="M230 110H330" stroke="#1677FF" stroke-width="8"/><g transform="translate(350 0)"><circle cx="110" cy="110" r="105" fill="#0B1F4D"/><text x="110" y="98" text-anchor="middle" fill="#7EB6FF" font-size="26" font-weight="700">02</text><text x="110" y="140" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">Indirect</text></g><path d="M580 110H680" stroke="#1677FF" stroke-width="8"/><g transform="translate(700 0)"><circle cx="110" cy="110" r="105" fill="#0B1F4D"/><text x="110" y="98" text-anchor="middle" fill="#7EB6FF" font-size="26" font-weight="700">03</text><text x="110" y="140" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">Dealer</text></g><path d="M930 110H1030" stroke="#1677FF" stroke-width="8"/><g transform="translate(1050 0)"><circle cx="110" cy="110" r="105" fill="#0B1F4D"/><text x="110" y="98" text-anchor="middle" fill="#7EB6FF" font-size="26" font-weight="700">04</text><text x="110" y="140" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">B/C</text></g><path d="M1280 110H1380" stroke="#1677FF" stroke-width="8"/><g transform="translate(1400 0)"><circle cx="70" cy="110" r="70" fill="#1677FF"/><text x="70" y="102" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">05</text><text x="70" y="132" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">Yield</text></g></g><g font-family="Arial,sans-serif" fill="#0B1F4D" font-size="26"><text x="105" y="620">① 예상보다 높은 금리인가?</text><text x="105" y="670">② 해외·기관 실수요가 들어왔나?</text><text x="105" y="720">③ 딜러가 물량을 떠안았나?</text><text x="820" y="620">④ 주문 총량은 충분했나?</text><text x="820" y="670">⑤ 입찰 뒤 금리가 안정됐나?</text></g><text x="90" y="825" fill="#1677FF" font-family="Arial,sans-serif" font-size="31" font-weight="800">Bid-to-Cover는 시작점이지 결론이 아니다.</text></svg>