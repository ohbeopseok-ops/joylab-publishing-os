<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#081733"/><text x="100" y="120" fill="#72B7FF" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="3">VISUAL RESEARCH · FRAMEWORK</text><text x="100" y="220" fill="#fff" font-family="Arial,sans-serif" font-size="66" font-weight="800">판단은 네 단계로 연결합니다</text><g font-family="Arial,sans-serif"><g transform="translate(90 350)"><rect width="300" height="260" rx="28" fill="#10295B" stroke="#2C6EC9"/><text x="40" y="75" fill="#70B7FF" font-size="28" font-weight="700">01 FACT</text><text x="40" y="135" fill="#fff" font-size="34" font-weight="700">무엇이 사실인가</text><text x="40" y="195" fill="#AFC7E8" font-size="25">데이터·공시·사건</text></g><g transform="translate(450 350)"><rect width="300" height="260" rx="28" fill="#10295B" stroke="#2C6EC9"/><text x="40" y="75" fill="#70B7FF" font-size="28" font-weight="700">02 INTERPRET</text><text x="40" y="135" fill="#fff" font-size="34" font-weight="700">무엇을 의미하나</text><text x="40" y="195" fill="#AFC7E8" font-size="25">구조·인과·맥락</text></g><g transform="translate(810 350)"><rect width="300" height="260" rx="28" fill="#10295B" stroke="#2C6EC9"/><text x="40" y="75" fill="#70B7FF" font-size="28" font-weight="700">03 SCENARIO</text><text x="40" y="135" fill="#fff" font-size="34" font-weight="700">무엇이 달라지나</text><text x="40" y="195" fill="#AFC7E8" font-size="25">Bull·Base·Bear</text></g><g transform="translate(1170 350)"><rect width="300" height="260" rx="28" fill="#0C397E" stroke="#4FA3FF"/><text x="40" y="75" fill="#9ACBFF" font-size="28" font-weight="700">04 ACTION</text><text x="40" y="135" fill="#fff" font-size="34" font-weight="700">무엇을 확인하나</text><text x="40" y="195" fill="#C7DEFA" font-size="25">체크포인트·재검증</text></g></g><path d="M390 480H445M750 480H805M1110 480H1165" stroke="#70B7FF" stroke-width="8"/><text x="100" y="760" fill="#A9BDD9" font-family="Arial,sans-serif" font-size="30">이미지는 장식이 