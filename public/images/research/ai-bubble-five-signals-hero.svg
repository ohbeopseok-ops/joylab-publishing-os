<text x="96" y="238" font-family="Arial,'Noto Sans KR',sans-serif" font-size="58" font-weight="800" fill="#ffffff">AI 버블은 언제 터질까?</text>
<text x="96" y="312" font-family="Arial,'Noto Sans KR',sans-serif" font-size="58" font-weight="800" fill="#7fd7f7">다섯 개의 경고 신호</text>
<rect x="96" y="342" width="180" height="8" rx="4" fill="url(#accent)"/>
