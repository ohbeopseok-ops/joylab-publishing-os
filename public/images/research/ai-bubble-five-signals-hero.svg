<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="b-title b-desc">
<title id="b-title">AI 버블을 판단하는 다섯 가지 경고 신호</title>
<desc id="b-desc">빅테크 CAPEX, GPU·HBM, 데이터센터 금융, 전력 병목, 밸류에이션 다섯 지표를 순서대로 배치한 JoyLab 리서치 대표 이미지</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05122a"/><stop offset=".55" stop-color="#0d2a53"/><stop offset="1" stop-color="#071426"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1b8bff"/><stop offset="1" stop-color="#55e3dc"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#1677ff" stop-opacity=".45"/><stop offset="1" stop-color="#1677ff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#8fb7ff" opacity=".16"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<circle cx="1330" cy="220" r="340" fill="url(#glow)"/>
