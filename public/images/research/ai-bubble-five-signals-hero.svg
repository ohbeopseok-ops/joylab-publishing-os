<text x="230" y="704" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">빅테크 CAPEX</text>
<text x="515" y="704" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">GPU · HBM</text>
<text x="800" y="704" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">데이터센터 금융</text>
