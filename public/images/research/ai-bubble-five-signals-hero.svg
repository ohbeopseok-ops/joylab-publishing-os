<text x="800" y="581" text-anchor="middle" font-size="30" font-weight="800" fill="#7ff0e8">03</text>
<circle cx="1085" cy="570" r="76" fill="#0f2a4a" stroke="#1677ff" stroke-width="2"/>
<text x="1085" y="581" text-anchor="middle" font-size="30" font-weight="800" fill="#9fd0ff">04</text>
