<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08162f"/><stop offset="1" stop-color="#0e2a52"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial,sans-serif">
    <text x="100" y="115" fill="#fff" font-size="52" font-weight="700">JoyLab browser automation workflow</text>
    <text x="102" y="165" fill="#8fb4ff" font-size="25">Execution and verification are different jobs.</text>
    <g>
      <rect x="90" y="310" width="270" height="210" rx="26" fill="#0f3269" stroke="#1677ff" stroke-width="2"/>
      <text x="225" y="375" text-anchor="middle" fill="#56c7ff" font-size="24" font-weight="700">1 · ACQUIRE</text>
      <text x="225" y="430" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">Aside</text>
      <text x="225" y="475" text-anchor="middle" fill="#c7d8f5" font-size="22">browse · collect · act</text>

      <rect x="455" y="310" width="270" height="210" rx="26" fill="#12335e" stroke="#4a9cff" stroke-width="2"/>
      <text x="590" y="375" text-anchor="middle" fill="#56c7ff" font-size="24" font-weight="700">2 · REASON</text>
      <text x="590" y="430" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">ChatGPT Work</text>
      <text x="590" y="475" text-anchor="middle" fill="#c7d8f5" font-size="22">research · synthesize</text>

      <rect x="820" y="310" width="270" height="210" rx="26" fill="#0c314f" stroke="#39d4ff" stroke-width="2"/>
      <text x="955" y="375" text-anchor="middle" fill="#56c7ff" font-size="24" font-weight="700">3 · VERIFY</text>
      <text x="955" y="430" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">Playwright</text>
      <text x="955" y="475" text-anchor="middle" fill="#c7d8f5" font-size="22">assert · repeat · regress</text>

      <rect x="1185" y="310" width="325" height="210" rx="26" fill="#112840" stroke="#7dcfff" stroke-width="2"/>
      <text x="1347" y="375" text-anchor="middle" fill="#56c7ff" font-size="24" font-weight="700">4 · DELIVER</text>
      <text x="1347" y="430" text-anchor="middle" fill="#fff" font-size="34" font-weight="700">GitHub + Cloudflare</text>
      <text x="1347" y="475" text-anchor="middle" fill="#c7d8f5" font-size="22">gate · build · deploy</text>
    </g>
    <g stroke="#57bfff" stroke-width="6" fill="none">
      <path d="M360 415 H455"/><path d="M725 415 H820"/><path d="M1090 415 H1185"/>
    </g>
    <g fill="#57bfff"><polygon points="445,405 465,415 445,425"/><polygon points="810,405 830,415 810,425"/><polygon points="1175,405 1195,415 1175,425"/></g>
    <rect x="180" y="650" width="1240" height="105" rx="22" fill="#081b37" stroke="#234c7f"/>
    <text x="800" y="700" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">Human approval remains above the pipeline.</text>
    <text x="800" y="738" text-anchor="middle" fill="#9ab5dd" font-size="22">Publishing · payments · deletion · account changes · high-impact decisions</text>
  </g>
