<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aside AI Browser Benchmark</title>
  <desc id="desc">JoyLab benchmark dashboard showing three successful runs, 15 of 15 verified sources, zero manual interventions, zero critical failures, and 95.9 percent quality score excluding speed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071428"/>
      <stop offset="0.55" stop-color="#0B1F4D"/>
      <stop offset="1" stop-color="#06101E"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2A63"/>
      <stop offset="1" stop-color="#10213D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677FF"/>
      <stop offset="1" stop-color="#54D7FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="140" r="240" fill="#1677FF" opacity="0.13" filter="url(#glow)"/>
  <circle cx="220" cy="760" r="260" fill="#2BD9FE" opacity="0.08" filter="url(#glow)"/>

  <g opacity="0.14" stroke="#65A7FF" stroke-width="1">
    <path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600M0 840H1600"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/>
  </g>

  <text x="90" y="105" fill="#8AB9FF" font-family="Inter, Arial, sans-serif" font-size="25" letter-spacing="4">JOYLAB • REAL-WORLD TEST</text>
  <text x="90" y="170" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">ASIDE AI BROWSER</text>
  <text x="90" y="220" fill="#AFC9F7" font-family="Inter, Arial, sans-serif" font-size="28">Can it finish real research work repeatedly?</text>

  <g transform="translate(95 295)" filter="url(#shadow)">
    <rect x="0" y="0" width="835" height="445" rx="28" fill="#061324" stroke="#2A5A9B" stroke-width="2"/>
    <rect x="34" y="34" width="767" height="345" rx="18" fill="url(#screen)"/>
    <circle cx="64" cy="62" r="7" fill="#FF6B6B"/><circle cx="88" cy="62" r="7" fill="#FFD166"/><circle cx="112" cy="62" r="7" fill="#5BE29B"/>
    <text x="150" y="70" fill="#8DB7ED" font-family="Inter, Arial, sans-serif" font-size="17">Research Agent • Source Verification</text>

    <rect x="62" y="104" width="314" height="232" rx="14" fill="#0A1930" stroke="#244E85"/>
    <text x="84" y="137" fill="#D9E8FF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">5 SOURCES</text>
    <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#AFC9F7">
      <text x="84" y="176">01  Primary / Original</text><circle cx="346" cy="171" r="9" fill="#43E0A1"/>
      <text x="84" y="211">02  Published within 24h</text><circle cx="346" cy="206" r="9" fill="#43E0A1"/>
      <text x="84" y="246">03  Duplicate filtered</text><circle cx="346" cy="241" r="9" fill="#43E0A1"/>
      <text x="84" y="281">04  Facts verified</text><circle cx="346" cy="276" r="9" fill="#43E0A1"/>
      <text x="84" y="316">05  Evidence retained</text><circle cx="346" cy="311" r="9" fill="#43E0A1"/>
    </g>

    <rect x="402" y="104" width="369" height="232" rx="14" fill="#0B1730" stroke="#244E85"/>
    <text x="426" y="138" fill="#D9E8FF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">WORKFLOW</text>
    <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#B8CEF2">
      <rect x="426" y="164" width="304" height="36" rx="9" fill="#10294E"/><text x="444" y="188">SEARCH → FILTER</text>
      <rect x="426" y="211" width="304" height="36" rx="9" fill="#10294E"/><text x="444" y="235">OPEN → VERIFY</text>
      <rect x="426" y="258" width="304" height="36" rx="9" fill="#10294E"/><text x="444" y="282">EVIDENCE → REPORT</text>
    </g>
    <rect x="510" y="391" width="250" height="22" rx="11" fill="#11284B"/>
    <rect x="510" y="391" width="217" height="22" rx="11" fill="url(#accent)"/>
    <path d="M165 379h600l80 48H85z" fill="#09111F" stroke="#263B5A"/>
  </g>

  <g transform="translate(1010 286)" font-family="Inter, Arial, sans-serif">
    <rect width="495" height="470" rx="26" fill="#081629" stroke="#2C5C9B" stroke-width="2" filter="url(#shadow)"/>
    <text x="34" y="48" fill="#8AB9FF" font-size="18" letter-spacing="2">BENCHMARK RESULTS</text>

    <g transform="translate(34 76)">
      <rect width="427" height="80" rx="14" fill="#0D2342"/>
      <text x="22" y="31" fill="#FFFFFF" font-size="18" font-weight="700">RUN 1</text>
      <text x="128" y="31" fill="#FFFFFF" font-size="18" font-weight="700">RUN 2</text>
      <text x="234" y="31" fill="#FFFFFF" font-size="18" font-weight="700">RUN 3</text>
      <text x="22" y="60" fill="#78E6BD" font-size="17">3.43m ✓</text>
      <text x="128" y="60" fill="#78E6BD" font-size="17">1.02m ✓</text>
      <text x="234" y="60" fill="#78E6BD" font-size="17">3.52m ✓</text>
      <circle cx="387" cy="40" r="20" fill="#123454" stroke="#43E0A1" stroke-width="3"/><path d="M378 40l7 7 13-16" fill="none" stroke="#43E0A1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(34 174)">
      <rect width="205" height="105" rx="14" fill="#0D2342"/>
      <text x="20" y="36" fill="#8FB8EA" font-size="15">SOURCES VERIFIED</text>
      <text x="20" y="80" fill="#FFFFFF" font-size="38" font-weight="700">15/15</text>
      <rect x="222" width="205" height="105" rx="14" fill="#0D2342"/>
      <text x="242" y="36" fill="#8FB8EA" font-size="15">INTERVENTIONS</text>
      <text x="242" y="80" fill="#FFFFFF" font-size="38" font-weight="700">0</text>
    </g>

    <g transform="translate(34 297)">
      <rect width="205" height="105" rx="14" fill="#0D2342"/>
      <text x="20" y="36" fill="#8FB8EA" font-size="15">CRITICAL FAILS</text>
      <text x="20" y="80" fill="#FFFFFF" font-size="38" font-weight="700">0</text>
      <rect x="222" width="205" height="105" rx="14" fill="#0D2342"/>
      <text x="242" y="36" fill="#8FB8EA" font-size="15">QUALITY*</text>
      <text x="242" y="80" fill="#FFFFFF" font-size="38" font-weight="700">95.9%</text>
    </g>

    <text x="34" y="444" fill="#7297C9" font-size="14">* excluding speed baseline • JoyLab internal S01 test</text>
  </g>

  <text x="95" y="820" fill="#6FA8F5" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="1">BROWSER EXECUTION LAYER → VERIFY → DECIDE → HUMAN APPROVAL</text>
  <rect x="95" y="848" width="1410" height="3" fill="url(#accent)" opacity="0.8"/>
</svg>
