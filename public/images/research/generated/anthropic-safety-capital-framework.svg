<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="t d"><title id="t">Safety Competition Capital 삼각구조</title><desc id="d">프론티어 AI 기업이 안전, 경쟁, 자본시장 압력 사이에서 선택해야 하는 구조를 설명한 JoyLab 리서치 인포그래픽</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06142f"/><stop offset="1" stop-color="#10295c"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1400" height="788" rx="32" fill="url(#bg)"/><text x="70" y="78" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">THE FRONTIER AI INCENTIVE TRIANGLE</text><text x="70" y="116" fill="#87b8f6" font-family="Arial,sans-serif" font-size="19">Safety × Competition × Capital</text><path d="M700 190L315 610H1085Z" fill="none" stroke="#315f9d" stroke-width="5"/><g font-family="Arial,sans-serif"><circle cx="700" cy="190" r="112" fill="#123d78" stroke="#65a9ff" stroke-width="3"/><text x="700" y="180" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">SAFETY</text><text x="700" y="218" text-anchor="middle" fill="#b9d9ff" font-size="17">evaluation · alignment</text><circle cx="315" cy="610" r="112" fill="#173b70" stroke="#1677FF" stroke-width="3"/><text x="315" y="600" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">COMPETITION</text><text x="315" y="638" text-anchor="middle" fill="#b9d9ff" font-size="17">model race · share</text><circle cx="1085" cy="610" r="112" fill="#49391f" stroke="#f1c86b" stroke-width="3"/><text x="1085" y="600" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">CAPITAL</text><text x="1085" y="638" text-anchor="middle" fill="#ffe0a0" font-size="17">growth · IPO · returns</text><circle cx="700" cy="475" r="135" fill="#0a1c3c" stroke="#fff" stroke-opacity=".25" stroke-width="2"/><text x="700" y="438" text-anchor="middle" fill="#fff"