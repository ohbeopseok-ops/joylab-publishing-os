    <linearGradient id="node1" x1="0" x2="1"><stop stop-color="#6e50d8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="node2" x1="0" x2="1"><stop stop-color="#007bb5"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <linearGradient id="node3" x1="0" x2="1"><stop stop-color="#ab6011"/><stop offset="1" stop-color="#ffc176"/></linearGradient>
