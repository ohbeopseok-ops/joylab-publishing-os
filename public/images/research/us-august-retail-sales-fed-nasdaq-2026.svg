<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">미국 8월 소매판매와 Fed, 나스닥 리서치</title>
  <desc id="desc">미국 소매판매 1.2%, 시장 예상 0.8%, Fed 정책금리 3.75~4.00%를 데이터 카드와 상승 막대 그래프로 표현한 JoyLab 리서치 대표 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081B3A"/>
      <stop offset="1" stop-color="#102B62"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677FF"/>
      <stop offset="1" stop-color="#5AA8FF"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1370" cy="120" r="260" fill="#1677FF" opacity=".08"/>
  <circle cx="1260" cy="760" r="320" fill="#5AA8FF" opacity=".06"/>
  <text x="110" y="130" fill="#7EB7FF" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="4">JOYLAB · MACRO RESEARCH</text>
  <text x="110" y="235" fill="#F7FAFF" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="68" font-weight="800">미국 8월 소매판매</text>
  <text x="110" y="315" fill="#DCE8FA" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="40" font-weight="600">예상 +0.8% → 실제 +1.2%</text>
  <text x="110" y="370" fill="#9FB7D8" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28">강한 소비가 Fed 금리와 나스닥에 주는 신호</text>

  <rect x="110" y="455" width="400" height="250" rx="28" fill="#FFFFFF" opacity=".07" stroke="#4D79B8" stroke-width="2"/>
  <text x="150" y="515" fill="#AFC9EA" font-family="Arial, sans-serif" font-size="26">RETAIL SALES</text>
  <text x="150" y="615" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="78" font-weight="800">+1.2%</text>
  <text x="150" y="665" fill="#7EB7FF" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24">전월 대비 · 2026년 8월</text>

  <rect x="550" y="455" width="400" height="250" rx="28" fill="#FFFFFF" opacity=".07" stroke="#4D79B8" stroke-width="2"/>
  <text x="590" y="515" fill="#AFC9EA" font-family="Arial, sans-serif" font-size="26">FED FUNDS</text>
  <text x="590" y="605" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="64" font-weight="800">3.75–4.00%</text>
  <text x="590" y="665" fill="#7EB7FF" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24">9월 FOMC · +25bp</text>

  <g transform="translate(1040 440)">
    <text x="0" y="60" fill="#AFC9EA" font-family="Arial, sans-serif" font-size="26">MARKET TRANSMISSION</text>
    <rect x="0" y="205" width="85" height="120" rx="14" fill="#284A7A"/>
    <rect x="115" y="155" width="85" height="170" rx="14" fill="#3567A9"/>
    <rect x="230" y="95" width="85" height="230" rx="14" fill="#1677FF"/>
    <rect x="345" y="35" width="85" height="290" rx="14" fill="url(#accent)"/>
    <path d="M35 160 C140 115 210 120 275 65 C330 20 365 10 430 -20" fill="none" stroke="#DDEBFF" stroke-width="10" stroke-linecap="round"/>
    <path d="M405 -24 L438 -22 L427 10" fill="none" stroke="#DDEBFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="380" fill="#BFD2EC" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24">소비 → Fed → 국채금리 → 성장주 할인율</text>
  </g>

  <text x="110" y="825" fill="#7D96B8" font-family="Arial, sans-serif" font-size="23">FACT → INTERPRETATION → SCENARIO → ACTION</text>
</svg>