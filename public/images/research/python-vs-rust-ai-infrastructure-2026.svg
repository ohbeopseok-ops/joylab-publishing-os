<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Python vs Rust — AI Infrastructure</title>
<desc id="desc">AI 개발을 대표하는 Python과 안정적인 AI 인프라를 대표하는 Rust가 하나의 AI 서비스 파이프라인에 결합되는 구조</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08152A"/><stop offset="1" stop-color="#092E47"/></linearGradient>
  <linearGradient id="py" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5DA7D8"/><stop offset="1" stop-color="#28759E"/></linearGradient>
  <linearGradient id="rs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFAD72"/><stop offset="1" stop-color="#D46A43"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g stroke="#8EC5DB" opacity=".1" fill="none"><path d="M0 210H1600M0 420H1600M0 630H1600M0 840H1600"/><path d="M180 0V900M440 0V900M700 0V900M960 0V900M1220 0V900M1480 0V900"/></g>
<circle cx="1320" cy="110" r="360" fill="#3285A6" opacity=".09"/>
<circle cx="220" cy="760" r="250" fill="#EC936B" opacity=".07"/>
<text x="122" y="140" fill="#8CD6E5" font-size="25" font-weight="700" letter-spacing="5" font-family="Arial,sans-serif">JOYLAB RESEARCH / ENGINEERING</text>
<text x="120" y="265" fill="#F8FBFF" font-size="92" font-weight="800" font-family="Arial,sans-serif">Python <tspan fill="#6CB3E0">×</tspan> Rust</text>
<text x="124" y="331" fill="#BBD1E0" font-size="34" font-family="Arial,sans-serif">Why AI infrastructure needs both.</text>
<g filter="url(#shadow)">
  <rect x="124" y="435" width="604" height="280" rx="28" fill="#102A43" stroke="#317298" stroke-width="3"/>
  <rect x="875" y="435" width="604" height="280" rx="28" fill="#2D2430" stroke="#9E6249" stroke-width="3"/>
</g>
<g font-family="Arial,sans-serif">
  <rect x="162" y="469" width="190" height="45" rx="22" fill="url(#py)"/>
  <text x="257" y="499" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">PYTHON</text>
  <text x="162" y="580" fill="#F0F8FF" font-size="37" font-weight="700">Build &amp; experiment</text>
  <text x="162" y="627" fill="#A7C5D7" font-size="24">Models · Data · Workflow</text>
  <rect x="913" y="469" width="150" height="45" rx="22" fill="url(#rs)"/>
  <text x="988" y="499" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">RUST</text>
  <text x="913" y="580" fill="#FFF8F3" font-size="37" font-weight="700">Serve &amp; optimize</text>
  <text x="913" y="627" fill="#DFC4B4" font-size="24">Memory · Routing · Runtime</text>
</g>
<path d="M729 568H870" stroke="#E1F4FE" stroke-width="5" stroke-linecap="round"/>
<path d="M853 551L872 568L853 585" fill="none" stroke="#E1F4FE" stroke-width="5" stroke-linecap="round"/>
<text x="124" y="811" fill="#9CBBCE" font-size="25" letter-spacing="1" font-family="Arial,sans-serif">One AI stack. Different jobs. Better decisions.</text>
</svg>