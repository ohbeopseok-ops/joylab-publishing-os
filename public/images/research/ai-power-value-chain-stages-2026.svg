<text x="48" y="150" font-family="Arial,'Noto Sans KR',sans-serif" font-size="40" font-weight="800" fill="#ffffff">AI 전력 수요는 어느 단계에서 매출이 되나</text>
<text x="48" y="192" font-family="Arial,'Noto Sans KR',sans-serif" font-size="20" fill="#a9cce8">수요 전망에서 이익·현금 회수까지 7단계. 기업마다 수혜를 받는 구간이 다릅니다.</text>
