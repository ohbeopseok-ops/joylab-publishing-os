<text x="48" y="610" font-size="16" fill="#6d92b8">채운 칸 = 해당 기업의 수주·실적이 확인되는 구간 · 점선 칸 = 모든 기업이 함께 도달해야 하는 결과 단계</text>
<rect x="48" y="632" width="1462" height="64" rx="14" fill="#0b1d33" stroke="#25486b"/>
<text x="76" y="672" font-size="21" fill="#dbe9f6">일곱 번째 단계인 이익·현금 회수는 수요가 아니라 결과입니다. 매출 인식 이후에 확인됩니다.</text>
<rect x="48" y="716" width="716" height="106" rx="16" fill="#2a1c23" stroke="#d96b52"/>
<text x="76" y="754" font-size="18" font-weight="700" fill="#ffcbb8">수주잔고 ≠ 확정 이익</text>
<text x="76" y="786" font-size="18" fill="#f7d9cd">잔고는 앞으로 수행할 계약 규모입니다. 납기·원재료비·계약 변경이 남습니다.</text>
<rect x="792" y="716" width="718" height="106" rx="16" fill="#2a1c23" stroke="#d96b52"/>
<text x="820" y="754" font-size="18" font-weight="700" fill="#ffcbb8">GPU 판매 ≠ 실사용</text>
<text x="820" y="786" font-size="18" fill="#f7d9cd">출하와 재고, 가격과 수익성이 함께 확인돼야 매출이 이익으로 남습니다.</text>
<text x="60" y="866" font-size="14" fill="#6d92b8">JOYLAB RESEARCH · 업종 특성에 대한 질적 판단이며 특정 기업의 목표주가나 수익률 전망이 아닙니다.</text>
<text x="1510" y="866" text-anchor="end" font-size="14" fill="#6d92b8">NOT INVESTMENT ADVICE</text>
