<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="v-title v-desc">
<title id="v-title">AI 전력 수요가 매출이 되는 7단계와 기업별 수혜 구간</title>
<desc id="v-desc">수요 전망부터 이익·현금 회수까지 일곱 단계를 두고 삼성전자·SK하이닉스는 생산 이후 구간, LS ELECTRIC은 발주에서 납품 구간에 위치한다는 것을 보여주는 단계표</desc>
<defs>
