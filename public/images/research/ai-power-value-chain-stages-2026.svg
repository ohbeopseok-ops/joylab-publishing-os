<linearGradient id="grid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17858f"/><stop offset="1" stop-color="#31b8b0"/></linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#bde0ff" opacity=".18"/></pattern>
</defs>
