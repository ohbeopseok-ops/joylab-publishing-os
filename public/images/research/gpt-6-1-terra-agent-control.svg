<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Terra 업무 자동화의 검증 및 승인 구조</title><desc id="d">읽기, 초안, 검증, 사람 승인, 실행 및 복구로 이어지는 단계별 운영체계</desc><rect width="1200" height="675" fill="#0d2338"/><text x="67" y="107" fill="#f0fbfc" font-family="Arial" font-size="44" font-weight="bold">Controlled agent workflow</text><text x="67" y="151" fill="#b2d3df" font-family="Arial" font-size="22">Human approval remains the boundary for high-risk actions</text><rect x="48" y="254" width="198" height="143" rx="16" fill="#22445e" stroke="#568a9f" stroke-width="2"/><text x="147" y="325" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="bold">Read</text><text x="147" y="365" text-anchor="middle" fill="#bce4ea" font-family="Arial" font-size="17">least privilege</text><path d="M251 324h24" stroke="#83d2d2" stroke-width="5"/><path d="M275 324l-11 -8v16z" fill="#83d2d2"/><rect x="278" y="254" width="198" height="143" rx="16" fill="#22445e" stroke="#568a9f" stroke-width="2"/><text x="377" y="325" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="bold">Draft</text><text x="377" y="365" text-anchor="middle" fill="#bce4ea" font-family="Arial" font-size="17">no write access</text><path d="M481 324h24" stroke="#83d2d2" stroke-width="5"/><path d="M505 324l-11 -8v16z" fill="#83d2d2"/><rect x="508" y="254" width="198" height="143" rx="16" fill="#22445e" stroke="#568a9f" stroke-width="2"/><text x="607" y="325" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="bold">Verify</text><text x="607" y="365" text-anchor="middle" fill="#bce4ea" font-family="Arial" font-size="17">evidence check</text><path d="M711 324h24" stroke="#83d2d2" stroke-width="5"/><path d="M735 324l-11 -8v16z" fill="#83d2d2"/><rect x="738" y="254" width="198" height="143" rx="16" fill="#1d716a" stroke="#7ce6ca" stroke-width="2"/><text x="837" y="325" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="bold">Approve</text><text x="837" y="365" text-anchor="middle" fill="#bce4ea" font-family="Arial" font-size="17">human decision</text><path d="M941 324h24" stroke="#83d2d2" stroke-width="5"/><path d="M965 324l-11 -8v16z" fill="#83d2d2"/><rect x="968" y="254" width="198" height="143" rx="16" fill="#22445e" stroke="#568a9f" stroke-width="2"/><text x="1067" y="325" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="bold">Execute</text><text x="1067" y="365" text-anchor="middle" fill="#bce4ea" font-family="Arial" font-size="17">audit + rollback</text><rect x="56" y="462" width="1087" height="99" rx="13" fill="#173850"/><text x="82" y="502" fill="#e1f7fa" font-family="Arial" font-size="23" font-weight="bold">Decision rule</text><text x="82" y="540" fill="#d1e7ee" font-family="Arial" font-size="21">Cost per verified outcome + safety + recovery — not token price alone</text><text x="63" y="616" fill="#9bbbc8" font-family="Arial" font-size="19">JoyLab Research framework · Conceptual workflow, not product guarantee</text></svg>