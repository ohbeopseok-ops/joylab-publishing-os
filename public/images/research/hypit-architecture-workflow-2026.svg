<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">Hypit 영상 제작 논리 구조</title><desc id="desc">레퍼런스 분석, 마크업 구조화, 실행, 검토의 네 단계와 각 단계에서 필요한 검수</desc><rect width="1400" height="780" fill="#F1F6FC"/><text x="82" y="100" font-size="42" fill="#0B1F4D" font-family="Arial" font-weight="700">AI VIDEO WORKFLOW</text><text x="82" y="145" font-size="24" fill="#4B6786" font-family="Arial">공식 패키지 구성에서 도출한 논리적 제작 단계</text><g font-family="Arial" text-anchor="middle"><g transform="translate(85 240)"><rect width="265" height="292" rx="25" fill="#0B1F4D"/><text x="132" y="62" font-size="27" fill="#98C9FF" font-weight="700">01</text><text x="132" y="119" font-size="30" fill="#fff" font-weight="700">REFERENCE</text><text x="132" y="160" font-size="21" fill="#D6E8FE">장면·음성 분석</text><rect x="28" y="207" width="209" height="45" rx="13" fill="#214E87"/><text x="132" y="237" font-size="19" fill="#fff">원본 권리 확인</text></g><g transform="translate(406 240)"><rect width="265" height="292" rx="25" fill="#14467C"/><text x="132" y="62" font-size="27" fill="#B6DEFF" font-weight="700">02</text><text x="132" y="119" font-size="30" fill="#fff" font-weight="700">SVML</text><text x="132" y="160" font-size="21" fill="#D6E8FE">편집 구조·자막</text><rect x="28" y="207" width="209" height="45" rx="13" fill="#2866A6"/><text x="132" y="237" font-size="19" fill="#fff">타이밍 검토</text></g><g transform="translate(727 240)"><rect width="265" height="292" rx="25" fill="#1677C8"/><text x="132" y="62" font-size="27" fill="#E0F1FF" font-weight="700">03</text><text x="132" y="119" font-size="30" fill="#fff" font-weight="700">RENDER</text><text x="132" y="160" font-size="21" fill="#F3F9FF">모델·미디어 실행</text><rect x="28" y="207" width="209" height="45" rx="13" fill="#0A5BA8"/><text x="132" y="237" font-size="19" fill="#fff">비용·로그 확인</text></g><g transform="translate(1048 240)"><rect width="265" height="292" rx="25" fill="#0C447B"/><text x="132" y="62" font-size="27" fill="#B6DEFF" font-weight="700">04</text><text x="132" y="119" font-size="30" fill="#fff" font-weight="700">REVIEW</text><text x="132" y="160" font-size="21" fill="#E5F1FF">영상·자막 검수</text><rect x="28" y="207" width="209" height="45" rx="13" fill="#2866A6"/><text x="132" y="237" font-size="19" fill="#fff">사람 승인</text></g></g><path d="M350 387H406M671 387H727M992 387H1048" stroke="#70A4D1" stroke-width="7" stroke-dasharray="10 10"/><rect x="82" y="616" width="1235" height="80" rx="17" fill="#E1EBF7"/><text x="105" y="664" font-size="24" font-family="Arial" fill="#294F75">주의: 실제 소스코드의 전체 호출 순서를 검증한 실행 추적도가 아닌 도입 검토용 개념도</text></svg>