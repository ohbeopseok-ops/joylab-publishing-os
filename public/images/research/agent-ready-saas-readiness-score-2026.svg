  <text x="300" y="76" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff" font-weight="700">AGENT READINESS · 100</text>
  <g font-family="Arial" font-size="20" fill="#fff">
    <text x="60" y="145">Data &amp; Context</text><rect x="60" y="165" width="480" height="22" rx="11" fill="#102e4d"/><rect x="60" y="165" width="445" height="22" rx="11" fill="url(#g)"/>
    <text x="60" y="225">Permission Design</text><rect x="60" y="245" width="480" height="22" rx="11" fill="#102e4d"/><rect x="60" y="245" width="420" height="22" rx="11" fill="url(#g)"/>
    <text x="60" y="305">Tool / MCP Surface</text><rect x="60" y="325" width="480" height="22" rx="11" fill="#102e4d"/><rect x="60" y="325" width="405" height="22" rx="11" fill="url(#g)"/>
    <text x="60" y="385">Auditability</text><rect x="60" y="405" width="480" height="22" rx="11" fill="#102e4d"/><rect x="60" y="405" width="430" height="22" rx="11" fill="url(#g)"/>
    <text x="60" y="465">Reliability &amp; Recovery</text><rect x="60" y="485" width="480" height="22" rx="11" fill="#102e4d"/><rect x="60" y="485" width="390" height="22" rx="11" fill="url(#g)"/>
  </g>
