<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#071735"/><text x="100" y="120" fill="#72B7FF" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="3">VISUAL RESEARCH · COMPARE</text><text x="100" y="220" fill="#fff" font-family="Arial,sans-serif" font-size="66" font-weight="800">비교형 리서치는 차이를 구조화합니다</text><g transform="translate(120 340)" font-family="Arial,sans-serif"><rect width="600" height="330" rx="30" fill="#10295B" stroke="#2868BE"/><text x="50" y="85" fill="#9CCAFF" font-size="30" font-weight="700">OPTION A</text><text x="50" y="155" fill="#fff" font-size="40" font-weight="700">강점 · 리스크 · 촉매</text><text x="50" y="220" fill="#B6CBE8" font-size="27">핵심 변수를 같은 기준으로 비교</text><path d="M50 270H500" stroke="#1677FF" stroke-width="12"/></g><g transform="translate(880 340)" font-family="Arial,sans-serif"><rect width="600" height="330" rx="30" fill="#0C397E" stroke="#4FA3FF"/><text x="50" y="85" fill="#B9D9FF" font-size="30" font-weight="700">OPTION B</text><text x="50" y="155" fill="#fff" font-size="40" font-weight="700">밸류에이션 · 실행력 · 수급</text><text x="50" y="220" fill="#D1E5FF" font-size="27">결론보다 선택 기준을 남김</text><path d="M50 270H500" stroke="#70B7FF" stroke-width="12"/></g><text x="800" y="530" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="800">VS</text><text x="100" y="780" fill="#A9BDD9" font-family="Arial,sans-serif" font-size="30">비교·밸류체인 글은 필요할 때 세 번째 보조 시각자료를 허용합니다.</text></svg>