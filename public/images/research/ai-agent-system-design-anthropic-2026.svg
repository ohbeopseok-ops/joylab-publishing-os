<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI Agent System Design</title>
<desc id="desc">Orchestrator, Worker, Verification, Governance, Recovery 흐름을 표현한 JoyLab AI Agent System 대표 이미지</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06132F"/>
    <stop offset="1" stop-color="#0B1F4D"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1677FF"/>
    <stop offset="1" stop-color="#65A8FF"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".22"/>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1360" cy="110" r="260" fill="#1677FF" opacity=".08"/>
<circle cx="1240" cy="790" r="330" fill="#65A8FF" opacity=".05"/>
<g opacity=".16" stroke="#9CC8FF" stroke-width="1">
  <path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/>
  <path d="M320 0V900M640 0V900M960 0V900M1280 0V900"/>
</g>

<g transform="translate(120 150)">
  <text x="0" y="0" fill="#7FB5FF" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">JOYLAB · AI AGENT SYSTEM</text>
  <text x="0" y="90" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="72" font-weight="800">Autonomy needs</text>
  <text x="0" y="170" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="72" font-weight="800">governance.</text>
  <text x="0" y="238" fill="#AFC6E8" font-family="Arial, sans-serif" font-size="28">Delegate · Verify · Approve · Recover</text>
</g>

<g transform="translate(700 165)" filter="url(#shadow)">
  <rect x="0" y="0" width="720" height="570" rx="34" fill="#091A3D" stroke="#244C80" stroke-width="2"/>
  <rect x="58" y="62" width="250" height="86" rx="18" fill="#102B5F" stroke="#3D82D8"/>
  <text x="183" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="700">ORCHESTRATOR</text>
  <text x="183" y="125" text-anchor="middle" fill="#9FC8FF" font-family="Arial, sans-serif" font-size="16">PLAN · DELEGATE</text>

  <g stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M308 105H390"/>
    <path d="M515 148V210"/>
    <path d="M390 105H515"/>
    <path d="M515 210H180V270"/>
    <path d="M515 210H515V270"/>
    <path d="M515 210H850"/>
  </g>

  <rect x="385" y="62" width="260" height="86" rx="18" fill="#0E244F" stroke="#2F6FB8"/>
  <text x="515" y="98" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="700">GOAL + CONTEXT</text>
  <text x="515" y="125" text-anchor="middle" fill="#9FC8FF" font-family="Arial, sans-serif" font-size="16">BOUNDARIES · TOOLS</text>

  <rect x="62" y="270" width="230" height="90" rx="18" fill="#0D234C" stroke="#2A5E9E"/>
  <text x="177" y="307" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">WORKERS</text>
  <text x="177" y="334" text-anchor="middle" fill="#9FC8FF" font-family="Arial, sans-serif" font-size="16">RESEARCH · TOOLS</text>

  <rect x="398" y="270" width="230" height="90" rx="18" fill="#102B5F" stroke="#4E95E8"/>
  <text x="513" y="307" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">VERIFIER</text>
  <text x="513" y="334" text-anchor="middle" fill="#9FC8FF" font-family="Arial, sans-serif" font-size="16">CLAIM ↔ EVIDENCE</text>

  <path d="M292 315H398" stroke="#4B91E6" stroke-width="4"/>
  <path d="M513 360V420" stroke="#4B91E6" stroke-width="4"/>

  <rect x="238" y="420" width="275" height="92" rx="20" fill="#132F63" stroke="#5AA0F2"/>
  <text x="375" y="458" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">RISK + APPROVAL</text>
  <text x="375" y="487" text-anchor="middle" fill="#9FC8FF" font-family="Arial, sans-serif" font-size="16">READ · WRITE · PUBLISH</text>

  <rect x="548" y="420" width="125" height="92" rx="20" fill="#2A1F33" stroke="#FFB45B"/>
  <text x="610" y="458" text-anchor="middle" fill="#FFD08A" font-family="Arial, sans-serif" font-size="19" font-weight="700">RECOVER</text>
  <text x="610" y="486" text-anchor="middle" fill="#E9C694" font-family="Arial, sans-serif" font-size="14">RETRY SAFELY</text>

  <path d="M513 466H548" stroke="#FFB45B" stroke-width="4"/>
  <path d="M610 420V390H513V360" stroke="#FFB45B" stroke-width="3" fill="none" stroke-dasharray="10 8"/>

  <rect x="62" y="430" width="135" height="72" rx="18" fill="#2B1622" stroke="#E85E7A"/>
  <text x="129" y="458" text-anchor="middle" fill="#FF9DB0" font-family="Arial, sans-serif" font-size="17" font-weight="800">KILL SWITCH</text>
  <text x="129" y="482" text-anchor="middle" fill="#EFB7C3" font-family="Arial, sans-serif" font-size="13">STOP SIDE EFFECTS</text>
</g>

<g transform="translate(120 650)">
  <rect width="500" height="120" rx="24" fill="#FFFFFF" opacity=".06" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="32" y="46" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">System principle</text>
  <text x="32" y="82" fill="#B8CCE8" font-family="Arial, sans-serif" font-size="21">Human sets goals. Agents execute.</text>
  <text x="32" y="108" fill="#B8CCE8" font-family="Arial, sans-serif" font-size="21">The system verifies and controls.</text>
</g>
</svg>