<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">JoyLab Hypit 도입 전 네 가지 검수</title><desc id="desc">실행환경, 편집 재구성, 한국어 자막, 재현성·비용 네 가지 게이트와 공개 SaaS 상업 라이선스 경고</desc><rect width="1400" height="780" fill="#071B39"/><text x="84" y="95" font-family="Arial" fill="#81C2FF" font-size="24" font-weight="700" letter-spacing="4">JOYLAB DECISION GATE</text><text x="84" y="154" font-family="Arial" fill="#FFFFFF" font-size="46" font-weight="700">Hypit 도입 전 확인할 4가지</text><g font-family="Arial"><g transform="translate(80 234)"><rect width="590" height="162" rx="23" fill="#123566" stroke="#326CB0" stroke-width="2"/><circle cx="69" cy="81" r="36" fill="#1B71C5"/><text x="69" y="91" font-size="29" fill="#fff" text-anchor="middle">01</text><text x="140" y="76" font-size="30" fill="#fff" font-weight="700">환경 실행</text><text x="140" y="119" font-size="22" fill="#B8D5FA">CLI · OS · 의존성</text></g><g transform="translate(726 234)"><rect width="590" height="162" rx="23" fill="#123566" stroke="#326CB0" stroke-width="2"/><circle cx="69" cy="81" r="36" fill="#1B71C5"/><text x="69" y="91" font-size="29" fill="#fff" text-anchor="middle">02</text><text x="140" y="76" font-size="30" fill="#fff" font-weight="700">영상 재구성</text><text x="140" y="119" font-size="22" fill="#B8D5FA">장면 · 자막 · 효과</text></g><g transform="translate(80 425)"><rect width="590" height="162" rx="23" fill="#123566" stroke="#326CB0" stroke-width="2"/><circle cx="69" cy="81" r="36" fill="#1B71C5"/><text x="69" y="91" font-size="29" fill="#fff" text-anchor="middle">03</text><text x="140" y="76" font-size="30" fill="#fff" font-weight="700">한국어 검수</text><text x="140" y="119" font-size="22" fill="#B8D5FA">숫자 · 발화 · 자막 동기화</text></g><g transform="translate(726 425)"><rect width="590" height="162" rx="23" fill="#123566" stroke="#326CB0" stroke-width="2"/><circle cx="69" cy="81" r="36" fill="#1B71C5"/><text x="69" y="91" font-size="29" fill="#fff" text-anchor="middle">04</text><text x="140" y="76" font-size="30" fill="#fff" font-weight="700">재현성 · 비용</text><text x="140" y="119" font-size="22" fill="#B8D5FA">재렌더링 · API 요금</text></g></g><rect x="82" y="650" width="1235" height="80" rx="17" fill="#472E2D" stroke="#E18A64"/><text x="108" y="697" font-family="Arial" font-size="25" fill="#FFD4BD">주의: 외부 고객 대상 멀티테넌트 제공은 별도 상업 라이선스 검토 필요</text></svg>