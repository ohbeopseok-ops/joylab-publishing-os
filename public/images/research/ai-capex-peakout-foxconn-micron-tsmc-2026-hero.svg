  <text x="210" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#8fb7d7">AI SERVER · SHIPMENTS</text>
  <g transform="translate(15 80)">
    <g fill="#091521" stroke="#2fa7ef" stroke-width="2">
      <rect x="0" y="0" width="112" height="250" rx="6"/>
      <rect x="135" y="20" width="112" height="230" rx="6"/>
      <rect x="270" y="42" width="112" height="208" rx="6"/>
    </g>
    <g fill="#4dc5ff">
      <g transform="translate(13 18)">
        <rect width="86" height="9"/><rect y="24" width="86" height="9"/><rect y="48" width="86" height="9"/><rect y="72" width="86" height="9"/><rect y="96" width="86" height="9"/><rect y="120" width="86" height="9"/><rect y="144" width="86" height="9"/><rect y="168" width="86" height="9"/><rect y="192" width="86" height="9"/>
      </g>
      <g transform="translate(148 39)" opacity=".85">
        <rect width="86" height="8"/><rect y="24" width="86" height="8"/><rect y="48" width="86" height="8"/><rect y="72" width="86" height="8"/><rect y="96" width="86" height="8"/><rect y="120" width="86" height="8"/><rect y="144" width="86" height="8"/><rect y="168" width="86" height="8"/>
      </g>
      <g transform="translate(283 61)" opacity=".7">
        <rect width="86" height="8"/><rect y="24" width="86" height="8"/><rect y="48" width="86" height="8"/><rect y="72" width="86" height="8"/><rect y="96" width="86" height="8"/><rect y="120" width="86" height="8"/><rect y="144" width="86" height="8"/>
      </g>
    </g>
  </g>
  <text x="210" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a9c9df">RACK-SCALE SYSTEMS · GLOBAL SHIPMENTS</text>
</g>

<!-- Flow arrows -->
<g fill="none" stroke="url(#blue)" stroke-width="12" stroke-linecap="round" filter="url(#glow)">
  <path d="M470 650 C535 610 570 610 635 650"/>
  <path d="M935 650 C1000 610 1030 610 1095 650"/>
</g>
<g fill="#67d8ff">
  <path d="M625 631l36 19-36 19z"/>
  <path d="M1085 631l36 19-36 19z"/>
</g>

<!-- Footer -->
<line x1="110" y1="805" x2="1490" y2="805" stroke="#86a9c2" stroke-opacity=".28"/>
<text x="110" y="852" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8fabbe">ADVANCED NODES</text>
<text x="500" y="852" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8fabbe">HIGHER MEMORY CONTENT</text>
<text x="980" y="852" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8fabbe">RACK-SCALE DEPLOYMENT</text>
<text x="1490" y="852" text-anchor="end" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8fabbe">JOYLAB RESEARCH</text>
