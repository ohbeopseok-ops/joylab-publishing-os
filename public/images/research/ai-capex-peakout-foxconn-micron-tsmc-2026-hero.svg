    <g>
      <rect x="30" y="108" width="215" height="24" rx="5" fill="url(#gold)"/>
      <rect x="42" y="80" width="191" height="24" rx="5" fill="url(#gold)"/>
      <rect x="54" y="52" width="167" height="24" rx="5" fill="url(#gold)"/>
      <rect x="66" y="24" width="143" height="24" rx="5" fill="url(#gold)"/>
      <rect x="78" y="-4" width="119" height="24" rx="5" fill="url(#gold)"/>
    </g>
    <g stroke="#61ccff" stroke-width="2" opacity=".8">
      <path d="M45 132v54M75 132v54M105 132v54M135 132v54M165 132v54M195 132v54M225 132v54"/>
    </g>
  </g>
  <text x="220" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#a9c9df">MEMORY BANDWIDTH · AI PERFORMANCE</text>
</g>

<!-- Right / Foxconn -->
<g transform="translate(1050 390)">
