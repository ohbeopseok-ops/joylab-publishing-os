    <path d="M65 240h290M76 220h268M91 200h238M118 180h184M146 160h128"/>
    <path d="M90 182l45 129M130 164l42 154M175 157l35 166M225 158l22 164M270 165l5 149M310 180l-16 122"/>
  </g>
  <path d="M75 126 C155 135 230 82 330 46" fill="none" stroke="url(#blue)" stroke-width="8" filter="url(#glow)"/>
  <path d="M326 28l33 10-20 28" fill="none" stroke="#73d6ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2ba9ff" opacity=".6">
    <rect x="88" y="92" width="14" height="46"/><rect x="122" y="79" width="14" height="59"/><rect x="156" y="68" width="14" height="70"/><rect x="190" y="54" width="14" height="84"/><rect x="224" y="48" width="14" height="90"/><rect x="258" y="38" width="14" height="100"/>
  </g>
</g>

<!-- Center / Micron -->
<g transform="translate(575 390)">
