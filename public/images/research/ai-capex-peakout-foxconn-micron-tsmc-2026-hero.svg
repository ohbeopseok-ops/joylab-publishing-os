<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI CAPEX 피크아웃인가</title>
<desc id="desc">TSMC 첨단공정, Micron HBM, Foxconn AI 서버를 연결해 AI CAPEX 확장 사이클을 보여주는 JoyLab 리서치 이미지</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#061326"/>
    <stop offset="0.55" stop-color="#0a1d38"/>
    <stop offset="1" stop-color="#102a46"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#45b8ff"/>
    <stop offset="1" stop-color="#7ae7ff"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffe09a"/>
    <stop offset="1" stop-color="#c98a36"/>
  </linearGradient>
  <radialGradient id="wafer" cx="42%" cy="32%" r="70%">
    <stop offset="0" stop-color="#f5d877"/>
    <stop offset="0.25" stop-color="#86d8ff"/>
    <stop offset="0.55" stop-color="#9f8cff"/>
    <stop offset="1" stop-color="#236b9e"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#7dd8ff" stroke-opacity=".12" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<circle cx="1320" cy="360" r="300" fill="#158dff" opacity=".06"/>
<circle cx="1180" cy="655" r="340" fill="#22d3ee" opacity=".04"/>

<!-- Top label -->
<rect x="585" y="52" width="430" height="54" rx="27" fill="#0b1b31" stroke="#cfe9ff" stroke-width="1.4"/>
<text x="800" y="86" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" letter-spacing="4" fill="#ffffff">JOYLAB VIEW: <tspan fill="#36b7ff" font-weight="700">EXPANSION</tspan></text>
<text x="1515" y="80" text-anchor="end" font-family="Arial, sans-serif" font-size="20" letter-spacing="4" fill="#b9cbe0">2026.10</text>

<!-- Headline -->
<text x="800" y="215" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="86" font-weight="800" fill="#ffffff">AI CAPEX 피크아웃인가</text>
<text x="800" y="278" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="34" font-weight="650" fill="#e7f3ff">폭스콘 · 마이크론 · TSMC가 말하는 2026년 AI 투자 사이클</text>
<text x="800" y="326" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="20" letter-spacing="4" fill="#a8bfd8">TSMC FOUNDRY  ·  MICRON HBM  ·  FOXCONN AI SERVER</text>

<!-- Left / TSMC -->
<g transform="translate(110 390)">
  <text x="0" y="0" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">TSMC</text>
  <text x="0" y="34" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#8fb7d7">FOUNDRY · CAPEX</text>
