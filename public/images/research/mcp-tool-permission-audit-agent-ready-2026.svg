<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MCP Tool Permission Audit</title>
<desc id="desc">MCP Tool 앞에 Permission, Approval, Audit, Recovery Gate가 배치된 Agent Ready 보안 구조</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131f"/><stop offset="1" stop-color="#0d2750"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1677ff"/><stop offset="1" stop-color="#65e4ff"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="105" y="185" fill="#fff" font-size="58" font-weight="700">MCP가 있다고</text>
  <text x="105" y="255" fill="#fff" font-size="58" font-weight="700">Agent Ready가 아니다</text>
  <text x="108" y="320" fill="#a6ceff" font-size="25">Tool Permission · Approval · Audit · Recovery</text>
</g>
<g transform="translate(820 165)" font-family="Arial,Helvetica,sans-serif">
  <rect width="640" height="540" rx="34" fill="#0c1c2f" stroke="#265786"/>
  <rect x="55" y="55" width="210" height="82" rx="18" fill="#112a47" stroke="#57dfff"/>
  <text x="160" y="106" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">AI Agent</text>
  <path d="M265 96H365" stroke="url(#accent)" stroke-width="6"/>
  <rect x="365" y="55" width="220" height="82" rx="18" fill="#112a47" stroke="#1677ff"/>
  <text x="475" y="106" text-anchor="middle" fill="#fff" font-size="27">MCP Tool</text>
  <path d="M475 137V190" stroke="url(#accent)" stroke-width="6"/>
  <g fill="#fff" font-size="20">
    <rect x="80" y="205" width="480" height="56" rx="14" fill="#10243c" stroke="#2c76b9"/><text x="320" y="240" text-anchor="middle">PERMISSION</text>
    <rect x="80" y="280" width="480" height="56" rx="14" fill="#10243c" stroke="#2c76b9"/><text x="320" y="315" text-anchor="middle">HUMAN APPROVAL</text>
    <rect x="80" y="355" width="480" height="56" rx="14" fill="#10243c" stroke="#2c76b9"/><text x="320" y="390" text-anchor="middle">AUDIT TRAIL</text>
    <rect x="80" y="430" width="480" height="56" rx="14" fill="#10243c" stroke="#2c76b9"/><text x="320" y="465" text-anchor="middle">RECOVERY / KILL</text>
  </g>
</g>
</svg>