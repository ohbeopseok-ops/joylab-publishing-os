<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">미국 금리에서 한국 반도체까지 전염경로</title>
  <desc id="desc">미국 10년물과 30년물 금리 상승이 달러, 원달러, 외국인 수급을 거쳐 삼성전자와 SK하이닉스로 전염되는 경로를 표현한 JoyLab 리서치 대표 이미지</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071735"/><stop offset="1" stop-color="#0B1F4D"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4FA3FF"/><stop offset="1" stop-color="#1677FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".13" stroke="#8EBEFF"><path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
  <text x="110" y="115" fill="#7EB6FF" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="3">JOYLAB · U.S. RATES RESEARCH</text>
  <text x="110" y="220" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="66" font-weight="800">미국 금리 → 원달러 → KOSPI → 반도체</text>
  <text x="110" y="290" fill="#B9CCE8" font-family="Arial, sans-serif" font-size="34">삼성전자·SK하이닉스 외국인 수급으로 확인한 전염경로</text>
  <g transform="translate(110 390)"><g><rect x="0" y="0" rx="24" width="230" height="150" fill="#10295B" stroke="#2E7CE8" stroke-width="2"/><text x="115" y="57" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">US 10Y / 30Y</text><text x="115" y="103" text-anchor="middle" fill="#7EB6FF" font-family="Arial, sans-serif" font-size="26">장기금리 상승</text></g><path d="M250 75H345" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/><path d="M330 58L355 75L330 92" fill="none" stroke="#4FA3FF" stroke-width="8"/>
  <g transform="translate(370 0)"><rect x="0" y="0" rx="24" width="220" height="150" fill="#10295B" stroke="#2E7CE8" stroke-width="2"/><text x="110" y="58" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">USD/KRW</text><text x="110" y="103" text-anchor="middle" fill="#7EB6FF" font-family="Arial, sans-serif" font-size="26">원화 약세 압력</text></g><path d="M610 75H705" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/><path d="M690 58L715 75L690 92" fill="none" stroke="#4FA3FF" stroke-width="8"/>
  <g transform="translate(730 0)"><rect x="0" y="0" rx="24" width="220" height="150" fill="#10295B" stroke="#2E7CE8" stroke-width="2"/><text x="110" y="58" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">외국인</text><text x="110" y="103" text-anchor="middle" fill="#7EB6FF" font-family="Arial, sans-serif" font-size="26">KOSPI 익스포저 축소</text></g><path d="M970 75H1065" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/><path d="M1050 58L1075 75L1050 92" fill="none" stroke="#4FA3FF" stroke-width="8"/>
  <g transform="translate(1090 0)" filter="url(#glow)"><rect x="0" y="0" rx="24" width="300" height="150" fill="#0C397E" stroke="#4FA3FF" stroke-width="3"/><text x="150" y="56" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="31" font-weight="800">삼성전자 · SK하이닉스</text><text x="150" y="103" text-anchor="middle" fill="#A8D0FF" font-family="Arial, sans-serif" font-size="25">수급·밸류에이션 압력</text></g></g>
  <g transform="translate(110 665)"><rect x="0" y="0" width="1380" height="135" rx="22" fill="#08152F" stroke="#234B84"/><text x="40" y="54" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">핵심 사례</text><text x="250" y="54" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34">9/10~9/11 외국인 순매도 합계</text><text x="850" y="54" fill="#69AFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">약 5.18조원</text><text x="40" y="102" fill="#9FB7D5" font-family="Arial, sans-serif" font-size="27">삼성전자 약 2.32조원 · SK하이닉스 약 2.86조원</text></g>
  <text x="1490" y="855" text-anchor="end" fill="#7E9BC2" font-family="Arial, sans-serif" font-size="24">Fact → Signal → Transmission → Action</text>
</svg>