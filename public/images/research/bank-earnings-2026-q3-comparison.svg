<title id="t">KB금융과 JP모건 2026년 3분기 실적 핵심 변수 비교</title>
<desc id="d">KB금융 NII 3조 5070억 원 그룹 NIM 1.92퍼센트, JP모건 NII 270억 달러 평균 예금 약 2조 7000억 달러. 통화와 사업구조가 달라 직접 우열 비교는 불가</desc>
<rect width="1600" height="700" fill="#f4f7fd"/><rect x="40" y="42" width="1520" height="616" rx="28" fill="white" stroke="#dbe5f6" stroke-width="3"/>
<text x="85" y="123" font-family="Arial,Noto Sans KR,sans-serif" font-weight="700" font-size="47" fill="#0b1f4d">2026년 3분기 은행 실적 비교</text><text x="85" y="178" font-family="Arial,Noto Sans KR,sans-serif" font-size="27" fill="#53647e">절대금액의 대소 비교가 아닌, 각 기업의 수익구조 확인</text>
<rect x="80" y="215" width="688" height="328" rx="22" fill="#eaf2ff"/><rect x="830" y="215" width="688" height="328" rx="22" fill="#eaf8f6"/>
