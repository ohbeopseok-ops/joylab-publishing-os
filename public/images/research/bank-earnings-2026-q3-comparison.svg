<text x="118" y="350" font-family="Arial,Noto Sans KR,sans-serif" font-size="29" fill="#425775">순이자이익 NII</text><text x="118" y="415" font-family="Arial,Noto Sans KR,sans-serif" font-weight="800" font-size="60" fill="#0b1f4d">3조 5,070억 원</text>
<text x="118" y="472" font-family="Arial,Noto Sans KR,sans-serif" font-size="30" fill="#3e5b85">그룹 NIM 1.92% · 전분기 -2bp</text>
<text x="870" y="350" font-family="Arial,Noto Sans KR,sans-serif" font-size="29" fill="#425775">순이자이익 NII</text><text x="870" y="415" font-family="Arial,Noto Sans KR,sans-serif" font-weight="800" font-size="64" fill="#0b1f4d">270억 달러</text>
<text x="870" y="472" font-family="Arial,Noto Sans KR,sans-serif" font-size="29" fill="#366a6a">평균 예금 약 2.7조 달러</text>
<text x="88" y="602" font-family="Arial,Noto Sans KR,sans-serif" font-size="25" fill="#53647e">자료: KB금융 3Q26 IR / JP모건 3Q26 SEC 10-Q · 통화·사업구조·지표 분모가 서로 다름</text>
