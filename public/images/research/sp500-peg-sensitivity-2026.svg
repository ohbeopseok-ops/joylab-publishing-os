<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">PEG sensitivity at Forward P/E 19.2</title>
<desc id="d">At Forward P/E 19.2, PEG rises as expected earnings growth falls from 30 percent to 12 percent.</desc>
<rect width="1600" height="900" fill="#0b1220"/>
<text x="90" y="90" fill="#ffffff" font-size="44" font-family="Arial, sans-serif" font-weight="700">PEG Sensitivity — Forward P/E 19.2x</text>
<text x="90" y="132" fill="#9fb0c7" font-size="24" font-family="Arial, sans-serif">Lower expected growth can erase a low PEG even when price does not move</text>
<line x1="160" y1="690" x2="1490" y2="690" stroke="#50627a" stroke-width="2"/>
<line x1="160" y1="210" x2="160" y2="690" stroke="#50627a" stroke-width="2"/>
<g stroke="#263449" stroke-width="1"><line x1="160" y1="570" x2="1490" y2="570"/><line x1="160" y1="450" x2="1490" y2="450"/><line x1="160" y1="330" x2="1490" y2="330"/></g>
<g fill="#9fb0c7" font-family="Arial, sans-serif" font-size="20"><text x="95" y="696">0.5</text><text x="95" y="576">0.8</text><text x="95" y="456">1.1</text><text x="95" y="336">1.4</text><text x="95" y="216">1.7</text></g>
<polyline points="240,634 430,606 620,570 810,526 1000,462 1190,378 1380,250" fill="none" stroke="#7aa2d6" stroke-width="7"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<circle cx="240" cy="634" r="10" fill="#dce6f2"/><text x="240" y="735" fill="#9fb0c7" font-size="20">30%</text><text x="240" y="615" fill="#dce6f2" font-size="20">0.64</text>
<circle cx="430" cy="606" r="14" fill="#f59e0b"/><text x="430" y="735" fill="#9fb0c7" font-size="20">27%</text><text x="430" y="580" fill="#f59e0b" font-size="24" font-weight="700">0.71</text>
<circle cx="620" cy="570" r="10" fill="#dce6f2"/><text x="620" y="735" fill="#9fb0c7" font-size="20">24%</text><text x="620" y="548" fill="#dce6f2" font-size="20">0.80</text>
<circle cx="810" cy="526" r="10" fill="#dce6f2"/><text x="810" y="735" fill="#9fb0c7" font-size="20">21%</text><text x="810" y="504" fill="#dce6f2" font-size="20">0.91</text>
<circle cx="1000" cy="462" r="14" fill="#f59e0b"/><text x="1000" y="735" fill="#9fb0c7" font-size="20">18%</text><text x="1000" y="436" fill="#f59e0b" font-size="24" font-weight="700">1.07</text>
<circle cx="1190" cy="378" r="10" fill="#dce6f2"/><text x="1190" y="735" fill="#9fb0c7" font-size="20">15%</text><text x="1190" y="356" fill="#dce6f2" font-size="20">1.28</text>
<circle cx="1380" cy="250" r="10" fill="#dce6f2"/><text x="1380" y="735" fill="#9fb0c7" font-size="20">12%</text><text x="1380" y="228" fill="#dce6f2" font-size="20">1.60</text>
</g>
<text x="820" y="810" fill="#c8d4e3" font-size="26" font-family="Arial, sans-serif" text-anchor="middle">Expected EPS growth → lower growth means higher PEG</text>
</svg>