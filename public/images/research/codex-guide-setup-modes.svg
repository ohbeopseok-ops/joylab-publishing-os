<rect x="34" y="171" width="612" height="78" rx="14" fill="#132a4d" stroke="#1677ff"/><text x="58" y="205" fill="#7db6ff" font-size="18" font-family="Arial,sans-serif" font-weight="700">목표 · 완료 기준까지 반복</text><text x="58" y="229" fill="#a9b9d3" font-size="15" font-family="Arial,sans-serif">성공 조건을 먼저 정의</text>
<rect x="34" y="267" width="612" height="78" rx="14" fill="#17202d"/><text x="58" y="301" fill="#fff" font-size="18" font-family="Arial,sans-serif">계획 · 기능과 작업 순서를 먼저 설계</text><text x="58" y="325" fill="#a9b9d3" font-size="15" font-family="Arial,sans-serif">처음 시작하거나 방향이 없을 때</text>
