<rect x="34" y="218" width="612" height="215" rx="14" fill="#151b25"/><text x="58" y="258" fill="#cbd7e8" font-size="18" font-family="Arial,sans-serif">Codex 메모리</text>
<circle cx="605" cy="256" r="14" fill="#2bb673"/><rect x="58" y="292" width="420" height="12" rx="6" fill="#2a3444"/><rect x="58" y="325" width="500" height="12" rx="6" fill="#2a3444"/><rect x="58" y="358" width="386" height="12" rx="6" fill="#2a3444"/>
<rect x="34" y="462" width="612" height="82" rx="14" fill="#10243f"/><text x="58" y="511" fill="#7db6ff" font-size="19" font-family="Arial,sans-serif">폴더 연결 → 권한 확인 → 지침 고정</text>
