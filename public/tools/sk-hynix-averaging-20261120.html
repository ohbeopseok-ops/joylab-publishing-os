<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>SK하이닉스 평균단가 계산기 | JoyLab</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,sans-serif;color:#0b1f4d;margin:0;padding:20px}main{max-width:640px;margin:auto}label{display:block;margin:12px 0}input{display:block;width:100%;font:inherit;padding:12px;border:1px solid #64748b;border-radius:8px}output{display:block;white-space:pre-line;background:#eef4ff;padding:16px;border-radius:14px}</style><main><h1>SK하이닉스 평균단가 계산기</h1><p>가상 시나리오이며 실시간 시세가 아닙니다.</p><form id="calc"><label>기존 단가 (원)<input type="number" min="0" value="1850000"></label><label>기존 수량 (주)<input type="number" min="0" step="1" value="10"></label><label>추가 단가 (원)<input type="number" min="0" value="1100000"></label><label>추가 수량 (주)<input type="number" min="0" step="1" value="10"></label><label>평가 가격 (원)<input type="number" min="0" value="1100000"></label><output id="result" aria-live="polite"></output></form><p>수수료·세금 제외. 평균단가가 낮아져도 위험이 감소하는 것은 아닙니다.</p></main><script>const form=document.getElementById('calc'),out=document.getElementById('result');function run(){const [p,q,a,n,m]=Array.from(form.querySelectorAll('input'),e=>Math.max(0,Number(e.value)||0));const Q=Math.floor(q),N=Math.floor(n),t=p*Q+a*N,k=Q+N,f=x=>Math.round(x).toLocaleString('ko-KR');out.textContent=['평균단가: '+(k?f(t/k):'—')+' 원','총 투자금: '+f(t)+' 원','추가 투자금: '+f(a*N)+' 원','평가손익: '+f(m*k-t)+' 원','수익률: '+(t?((m*k/t-1)*100).toFixed(2)+'%':'—')].join('\n')}form.addEventListener('input',run);run();</script></html>
