<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="t d">
<title id="t">문제를 서비스로 바꾸는 법</title>
<desc id="d">어머니와 걷다가 시작된 시니어 화장실 찾기 AI 서비스 제작기 표지</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04172e"/><stop offset=".62" stop-color="#0b3767"/><stop offset="1" stop-color="#f5b94c"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd55d" stop-opacity=".95"/><stop offset="1" stop-color="#f29b39" stop-opacity=".15"/></linearGradient>
</defs>
<rect width="640" height="960" fill="url(#bg)"/>
<circle cx="538" cy="650" r="190" fill="url(#sun)" opacity=".5"/>
<path d="M0 744 C140 680 220 704 330 660 C438 618 512 626 640 566 L640 960 L0 960Z" fill="#071a2b" opacity=".88"/>
<path d="M20 794 C150 746 270 758 390 704 C478 666 548 666 640 624" fill="none" stroke="#ffd83d" stroke-width="4" opacity=".65"/>
<g opacity=".42" fill="none" stroke="#3da7ff" stroke-width="2">
  <path d="M66 480 C150 420 222 508 304 440 S468 370 558 426"/>
  <circle cx="80" cy="470" r="8"/><circle cx="308" cy="438" r="8"/><circle cx="558" cy="426" r="8"/>
</g>
<text x="58" y="72" fill="#62c4ff" font-size="20" font-family="Arial, sans-serif" font-weight="700" letter-spacing="4">JOYLAB BUILD SERIES 01</text>
<text x="56" y="170" fill="#ffffff" font-size="72" font-family="Arial, 'Noto Sans KR', sans-serif" font-weight="900">문제를</text>
<text x="56" y="252" fill="#ffe033" font-size="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-weight="900">서비스로</text>
<text x="56" y="334" fill="#ffffff" font-size="72" font-family="Arial, 'Noto Sans KR', sans-serif" font-weight="900">바꾸는 법</text>
<text x="58" y="390" fill="#dceaff" font-size="23" font-family="Arial, 'Noto Sans KR', sans-serif">어머니와 걷다가 시작된</text>
<text x="58" y="424" fill="#dceaff" font-size="23" font-family="Arial, 'Noto Sans KR', sans-serif">시니어 화장실 찾기 AI 서비스 제작기</text>
<text x="58" y="510" fill="#7ed0ff" font-size="22" font-family="Arial, 'Noto Sans KR', sans-serif">“여기 화장실 어디 있어?”</text>
<text x="58" y="546" fill="#ffffff" font-size="18" font-family="Arial, 'Noto Sans KR', sans-serif">어머니의 한마디가 실제 서비스가 되기까지.</text>
