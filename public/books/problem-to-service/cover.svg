<text x="58" y="904" fill="#ffffff" font-size="24" font-family="Arial, sans-serif" font-weight="700" letter-spacing="5">JOYLAB</text>
<text x="58" y="932" fill="#9fc8ef" font-size="14" font-family="Arial, 'Noto Sans KR', sans-serif">생각을 분석하고, 분석을 실행으로.</text>
