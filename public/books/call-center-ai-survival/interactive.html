<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콜센터 AI 생존기 · Interactive Workbook | JoyLab Books</title><meta name="description" content="콜센터 AI 생존기 인터랙티브 워크북. 10장 전체 읽기, 프롬프트 복사, 장별 실습 메모, 검증 체크리스트와 이어읽기를 제공합니다."><link rel="canonical" href="https://aijoylab.kr/books/call-center-ai-survival/"><meta name="robots" content="noindex,follow"><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet"><script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Noto Sans KR','sans-serif'],serif:['Noto Serif KR','serif'],mono:['JetBrains Mono','monospace']}}}}</script><style>:root{--navy:#07152f;--blue:#1677ff;--line:#dce5f0}.theme-sepia body,.theme-sepia{background:#f6f0e4!important;color:#382c1f!important}.theme-sepia .paper{background:#fbf8f2!important}.paper{background:#fff}.dark .paper{background:#0f172a}.prompt-copy{position:absolute;top:.5rem;right:.5rem}.workbook-card{margin-top:1.75rem;border:1px solid #c7d2fe;border-radius:1rem;overflow:hidden;background:rgba(238,242,255,.72)}.dark .workbook-card{border-color:#3730a3;background:rgba(49,46,129,.15)}.workbook-head{display:flex;justify-content:space-between;gap:.75rem;align-items:center;padding:.9rem 1rem;background:rgba(99,102,241,.09);border-bottom:1px solid #c7d2fe}.dark .workbook-head{border-color:#3730a3}.workbook-title{font-size:.88rem;font-weight:800;color:#3730a3}.dark .workbook-title{color:#a5b4fc}.workbook-status{font-size:.78rem;color:#64748b}.workbook-body{padding:1rem;display:grid;gap:1rem}.workbook-step strong{display:block;margin-bottom:.4rem;font-size:.88rem}.workbook-step p{margin:0 0 .6rem;font-size:.875rem;line-height:1.7;color:#64748b}.workbook-textarea{width:100%;min-height:130px;resize:vertical;border:1px solid #cbd5e1;border-radius:.75rem;padding:.8rem;background:#fff;color:#0f172a;font-size:.875rem;line-height:1.65;outline:none}.dark .workbook-textarea{background:#0f172a;border-color:#334155;color:#e2e8f0}.workbook-checks{display:grid;gap:.6rem}.workbook-check{display:flex;gap:.55rem;align-items:flex-start;font-size:.875rem;line-height:1.55}.workbook-check input{width:17px;height:17px;margin-top:2px;accent-color:#4f46e5}.workbook-btn{border:1px solid #cbd5e1;border-radius:.6rem;padding:.5rem .75rem;font-size:.8rem;font-weight:700;background:#fff;color:#334155;cursor:pointer}.dark .workbook-btn{background:#111827;color:#cbd5e1;border-color:#334155}.workbook-btn.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}.toast{position:fixed;right:18px;bottom:24px;z-index:70;background:#0f172a;color:#fff;border-radius:10px;padding:10px 14px;font-size:12px;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.toc-link.active{background:#e0e7ff;color:#312e81;font-weight:800}.dark .toc-link.active{background:#312e81;color:#eef2ff}.mode-btn.active{background:#fff!important;color:#0f172a!important}.dark .mode-btn.active{background:#e2e8f0!important;color:#0f172a!important}.sidebar-progress{margin:12px;border:1px solid #dbe4f0;border-radius:12px;padding:12px;background:#f8fafc}.dark .sidebar-progress{background:#111827;border-color:#334155}.sidebar-progress-bar{height:6px;border-radius:999px;background:#e2e8f0;overflow:hidden}.dark .sidebar-progress-bar{background:#334155}.sidebar-progress-fill{height:100%;width:0;background:#4f46e5;transition:width .2s}.reading-mode .workbook-card{display:none}.practice-mode .workbook-card{display:block}#paper section:not(#publication-info):not(#cover) p,#paper section:not(#publication-info):not(#cover) li{font-size:16.5px;line-height:1.82}#paper section:not(#publication-info):not(#cover) h2{line-height:1.35}#paper section:not(#publication-info):not(#cover) .text-xs{font-size:14px!important;line-height:1.68!important}#paper section:not(#publication-info):not(#cover) pre,#paper section:not(#publication-info):not(#cover) .font-mono{font-size:13.5px!important;line-height:1.72!important}#paper table{font-size:14px!important;line-height:1.6}body>header{height:52px;min-height:52px;padding-left:16px!important;padding-right:16px!important}body>header>div:first-child>div>div:first-child{font-size:14.5px!important;line-height:1.2!important}body>header a{min-height:36px;display:inline-flex!important;align-items:center;padding:0 11px!important;font-size:12.5px!important}body>header button[data-theme]{width:36px;height:36px;padding:0!important;display:inline-flex;align-items:center;justify-content:center}#layout{height:calc(100vh - 56px)!important}#sidebar{width:260px!important}#sidebar>div:first-child{padding:18px 16px!important}#toc{font-size:13px!important;line-height:1.55!important;padding:10px!important}#toc .toc-link{padding:9px 11px!important;margin-bottom:3px!important}#viewport{padding:32px 48px 72px!important}#paper{width:min(800px,100%)!important;max-width:800px!important;margin-left:auto!important;margin-right:auto!important;padding:52px 56px!important;border-radius:18px!important;box-sizing:border-box!important}.workbook-btn{min-height:36px}.longread-card{border:1px solid #dbe4f0;border-radius:14px;padding:14px 16px;background:#f8fafc}.dark .longread-card{background:#111827;border-color:#334155}.longread-card strong{display:block;margin-bottom:5px}.longread-grid{display:grid;gap:10px}.longread-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}@media (min-width:901px) and (max-width:1100px){#sidebar{width:240px!important}#viewport{padding:24px 28px 72px!important}#paper{width:min(760px,100%)!important;padding:44px 42px!important}}@media(max-width:900px){#sidebar{position:absolute;z-index:55;inset:0 auto 0 0;transform:translateX(-100%);transition:.2s;width:min(86vw,320px)!important}.sidebar-open #sidebar{transform:none}#viewport{padding:16px 12px 52px!important}#paper{width:100%!important;padding:26px 20px!important;border-radius:14px!important}#paper section:not(#publication-info):not(#cover) p,#paper section:not(#publication-info):not(#cover) li{font-size:16px;line-height:1.78}.longread-grid.three{grid-template-columns:1fr}.header-mode-label{display:none}}@media print{header,#sidebar,.toast,.workbook-card{display:none!important}#viewport{overflow:visible!important}.paper{box-shadow:none!important;max-width:none!important;padding:0!important}@page{size:A5;margin:15mm}}</style></head><body class="h-screen overflow-hidden bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100"><header class="bg-slate-950 text-white flex items-center justify-between border-b border-slate-800"><div class="flex items-center gap-3"><button id="menu" class="px-2 py-1.5 rounded bg-slate-800">☰</button><div><div class="font-extrabold">『콜센터 AI 생존기』</div><div class="hidden sm:block text-[11px] text-slate-400">Interactive Workbook V1.2.1 · Long Reading Pass · 오법석</div></div></div><div class="flex items-center gap-1"><div class="hidden md:flex items-center gap-1 mr-2 p-1 rounded-lg bg-slate-800"><button data-mode="reading" class="mode-btn px-2.5 py-1.5 text-xs rounded active"><span class="header-mode-label">읽기 </span>모드</button><button data-mode="practice" class="mode-btn px-2.5 py-1.5 text-xs rounded"><span class="header-mode-label">실습 </span>모드</button></div><a href="/books/call-center-ai-survival/" class="hidden sm:inline text-slate-300">책 소개</a><a href="./resources.html" class="hidden sm:inline text-slate-300">리소스</a><button data-theme="light" class="text-xs bg-slate-800 rounded">☀</button><button data-theme="sepia" class="text-xs bg-slate-800 rounded">◐</button><button data-theme="dark" class="text-xs bg-slate-800 rounded">☾</button></div></header><div class="h-1 bg-slate-800"><div id="readbar" class="h-full bg-blue-500" style="width:0"></div></div><div id="layout" class="relative flex"><aside id="sidebar" class="shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 overflow-y-auto"><div class="border-b border-slate-200 dark:border-slate-800"><div class="text-[11px] font-bold text-indigo-600">JOYLAB BOOKS</div><div class="text-[15px] font-extrabold mt-1">전체 목차</div><div class="text-[11.5px] text-slate-500 mt-1">읽기 + 실습 + 검증</div></div><div class="sidebar-progress"><div class="flex items-center justify-between text-[11px] text-slate-500 mb-1"><span>실습 완료</span><b id="donePercent" class="text-indigo-600">0%</b></div><div class="text-sm font-extrabold mb-2"><span id="doneCount">0/10</span></div><div class="sidebar-progress-bar"><div id="doneBar" class="sidebar-progress-fill"></div></div><div class="grid grid-cols-2 gap-1 mt-3 md:hidden"><button data-mode="reading" class="mode-btn workbook-btn active">읽기</button><button data-mode="practice" class="mode-btn workbook-btn">실습</button></div></div><nav id="toc"></nav></aside><main id="viewport" class="flex-1 overflow-y-auto"><article id="paper" class="paper mx-auto shadow-sm border border-slate-200 dark:border-slate-800 space-y-10"></article></main></div><div id="toast" class="toast">알림</div><script>const sections=[['cover','표지'],['publication-info','판권·AI 보안 원칙'],['prologue','시작하며'],...Array.from({length:10},(_,i)=>[`ch${i+1}`,`${i+1}장`]),['appendix','부록'],['epilogue','마치며']];const chapterIds=Array.from({length:10},(_,i)=>`ch${i+1}`);const KEY='joylab-call-center-ai-workbook-v1';const cfg={ch1:['AI에게 맡겨도 되는 일 2가지와 사람이 최종 판단해야 하는 일 1가지를 적어보세요.',['AI 답변과 최종 업무 판단을 구분했다','회사 정책·원문 확인 지점을 표시했다','고객에게 바로 약속하면 안 되는 항목을 구분했다']],ch2:['내 상담석의 CRM·AI·매뉴얼 배치를 가장 적은 화면 전환으로 설계해보세요.',['승인된 AI 도구·계정을 확인했다','단축키가 실제 PC에서 동작하는지 확인했다','화면 배치가 고객정보 노출을 키우지 않는다']],ch3:['가상의 상담 메모를 개인정보 없이 쓰고 AI 입력 전 마스킹 항목을 적어보세요.',['식별·인증·결제 정보를 제거했다','자료 밖 추측 금지 제약을 넣었다','금액·날짜·정책 재확인을 계획했다']],ch4:['내가 자주 찾는 매뉴얼 질문 1개를 R-C-I 방식으로 다시 작성해보세요.',['참고자료 범위를 지정했다','고객 조건과 적용 조건을 분리했다','근거 없는 답은 [확인 필요]로 남긴다']],ch5:['상담 1건을 개인정보 없이 문의 요지·사실 확인·조치 내용·약속/이관 4단으로 정리해보세요.',['입력에 없는 사실을 만들지 않았다','고객 요청과 완료 조치를 구분했다','약속·이관의 실제 확정 여부를 확인했다']],ch6:['강한 불만 상황 하나를 골라 E-V-A 3문장으로 직접 작성해보세요.',['Empathy는 감정을 인정하되 과실을 임의 인정하지 않는다','Validation은 확인된 사실만 말한다','Action은 실제 가능한 다음 행동만 제시한다']],ch7:['복합 민원 1건을 사건 경위·고객 요구·현재 조치·추가 확인·판단 요청으로 분해해보세요.',['과실 여부를 AI가 임의 판단하지 않았다','고객 주장과 확인 사실을 분리했다','상급자 결정 항목을 명확히 남겼다']],ch8:['잘 안 됐던 프롬프트 하나를 Role·Context·Instruction 관점에서 다시 작성해보세요.',['Role이 필요한 수준으로 구체적이다','Context에 필요한 입력과 제약이 있다','Instruction에 출력 형식이 명확하다']],ch9:['오늘 어려웠던 상담을 개인정보 없이 적고 다음 통화에서 바꿀 행동 1가지를 적어보세요.',['고객 식별정보를 기록하지 않았다','통제 가능 행동과 통제 불가능 상황을 분리했다','진단·낙인 대신 업무 행동으로 회고했다']],ch10:['재사용할 프롬프트 1개를 Category·Situation·Prompt·Quality 구조로 작성해보세요.',['사용 상황이 구체적이다','좋은 출력의 품질 기준이 있다','팀 공유 전 개인정보·정책·정확성을 검증했다']]};let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const toast=(m)=>{const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('프롬프트를 복사했습니다.')}function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('프롬프트를 복사했습니다.')).catch(()=>fallbackCopy(t))}function workbook(id,sec){if(!cfg[id])return;const [practice,checks]=cfg[id];const st=state[id]||{note:'',checks:{},done:false};state[id]=st;const card=document.createElement('div');card.className='workbook-card';card.innerHTML=`<div class="workbook-head"><div><div class="workbook-title">INTERACTIVE WORKBOOK · ${id.toUpperCase()}</div><div class="workbook-status">프롬프트 복사 → 직접 실습 → 검증 체크 → 장 완료</div></div><button class="workbook-btn primary" data-done>${st.done?'완료됨 ✓':'이 장 완료'}</button></div><div class="workbook-body"><div class="workbook-step"><strong>STEP 1 · 프롬프트 활용</strong><p>이 장의 프롬프트가 있다면 복사해 테스트하세요. 실제 업무에서는 고객 식별정보를 제거하고 회사 승인 기준을 우선합니다.</p><button class="workbook-btn" data-copy>이 장 첫 프롬프트 복사</button></div><div class="workbook-step"><strong>STEP 2 · 직접 실습</strong><p>${practice}</p><textarea class="workbook-textarea" data-note placeholder="실습 메모는 이 브라우저에만 저장됩니다.">${st.note||''}</textarea></div><div class="workbook-step"><strong>STEP 3 · 검증 체크리스트</strong><div class="workbook-checks">${checks.map((x,i)=>`<label class="workbook-check"><input type="checkbox" data-check="${i}" ${st.checks?.[i]?'checked':''}><span>${x}</span></label>`).join('')}</div></div><button class="workbook-btn" data-clear>이 장 기록 초기화</button></div>`;sec.appendChild(card);card.querySelector('[data-copy]').onclick=()=>{const pre=sec.querySelector('pre');pre?copyText(pre.textContent):toast('복사형 프롬프트가 없습니다.')};card.querySelector('[data-note]').oninput=e=>{st.note=e.target.value;save()};card.querySelectorAll('[data-check]').forEach(x=>x.onchange=e=>{st.checks=st.checks||{};st.checks[e.target.dataset.check]=e.target.checked;save()});card.querySelector('[data-done]').onclick=e=>{st.done=!st.done;e.target.textContent=st.done?'완료됨 ✓':'이 장 완료';save();updateDone()};card.querySelector('[data-clear]').onclick=()=>{state[id]={note:'',checks:{},done:false};save();location.reload()}}async function load(){const paper=document.getElementById('paper');for(const [id,label] of sections){const r=await fetch(`./chapters/${id}.html`);if(!r.ok)continue;const wrap=document.createElement('div');wrap.innerHTML=await r.text();const sec=wrap.firstElementChild;paper.appendChild(sec);sec.querySelectorAll('pre').forEach(pre=>{if(pre.parentElement.querySelector('.prompt-copy'))return;const b=document.createElement('button');b.className='prompt-copy workbook-btn';b.textContent='복사';b.onclick=()=>copyText(pre.textContent);pre.parentElement.style.position='relative';pre.parentElement.appendChild(b)});workbook(id,sec)}buildToc();restore();updateDone();applyMode(localStorage.getItem(KEY+'-mode')||'reading')}function buildToc(){const toc=document.getElementById('toc');sections.forEach(([id,label])=>{const sec=document.getElementById(id);if(!sec)return;const h=sec.querySelector('h1,h2');const a=document.createElement('a');a.href=`#${id}`;a.dataset.id=id;a.className='toc-link block px-3 py-2 rounded-lg mb-1 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800';a.textContent=h?.textContent?.trim()||label;a.onclick=()=>document.getElementById('layout').classList.remove('sidebar-open');toc.appendChild(a)})}function restore(){const v=document.getElementById('viewport');const y=Number(localStorage.getItem(KEY+'-scroll')||0);if(y>0)v.scrollTop=y;v.addEventListener('scroll',()=>{const max=Math.max(1,v.scrollHeight-v.clientHeight);document.getElementById('readbar').style.width=(v.scrollTop/max*100)+'%';localStorage.setItem(KEY+'-scroll',String(v.scrollTop));let cur='';document.querySelectorAll('#paper section[id]').forEach(s=>{if(s.offsetTop-v.scrollTop<160)cur=s.id});document.querySelectorAll('.toc-link').forEach(a=>a.classList.toggle('active',a.dataset.id===cur))},{passive:true})}function updateDone(){const done=chapterIds.filter(id=>state[id]?.done).length;const pct=Math.round(done/10*100);document.getElementById('doneCount').textContent=`${done}/10`;document.getElementById('donePercent').textContent=`${pct}%`;document.getElementById('doneBar').style.width=`${pct}%`}function applyMode(mode){document.body.classList.toggle('reading-mode',mode==='reading');document.body.classList.toggle('practice-mode',mode==='practice');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));localStorage.setItem(KEY+'-mode',mode)}document.getElementById('menu').onclick=()=>document.getElementById('layout').classList.toggle('sidebar-open');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>applyMode(b.dataset.mode));document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.documentElement.classList.remove('dark','theme-sepia');if(b.dataset.theme==='dark')document.documentElement.classList.add('dark');if(b.dataset.theme==='sepia')document.documentElement.classList.add('theme-sepia');localStorage.setItem(KEY+'-theme',b.dataset.theme)});const th=localStorage.getItem(KEY+'-theme');if(th==='dark')document.documentElement.classList.add('dark');if(th==='sepia')document.documentElement.classList.add('theme-sepia');load();</script></body></html>
