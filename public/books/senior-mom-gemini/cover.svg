<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">시니어인 우리 엄마도 제미나이를 쓴다</title>
  <desc id="desc">JoyLab Books의 시니어 AI 생활 안내서 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071A35"/>
      <stop offset="58%" stop-color="#0B2D55"/>
      <stop offset="100%" stop-color="#124A7F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FBFF"/>
      <stop offset="100%" stop-color="#D9E9FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#041020" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="640" height="960" rx="28" fill="url(#bg)"/>
  <circle cx="548" cy="112" r="118" fill="#1677FF" opacity=".14"/>
  <circle cx="74" cy="824" r="150" fill="#F2C989" opacity=".08"/>

  <text x="54" y="74" fill="#F2C989" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">JOYLAB BOOKS</text>
  <text x="54" y="112" fill="#8EBBFF" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">SENIOR AI LIFE</text>

  <text x="54" y="198" fill="#FFFFFF" font-family="'Noto Serif KR','Nanum Myeongjo',serif" font-size="58" font-weight="700">
    <tspan x="54" dy="0">시니어인</tspan>
    <tspan x="54" dy="72">우리 엄마도</tspan>
    <tspan x="54" dy="72">제미나이를 쓴다</tspan>
  </text>

  <text x="56" y="430" fill="#DCE8F7" font-family="'Noto Sans KR',Arial,sans-serif" font-size="23">
    <tspan x="56" dy="0">말 한마디와 사진 한 장으로 시작하는</tspan>
    <tspan x="56" dy="34">가장 쉬운 AI 생활 안내서</tspan>
  </text>

  <g transform="translate(60 526)" filter="url(#shadow)">
    <rect x="0" y="0" width="214" height="330" rx="34" fill="#0A1B31" stroke="#8FB9EE" stroke-width="2"/>
    <rect x="15" y="23" width="184" height="274" rx="22" fill="url(#screen)"/>
    <rect x="83" y="309" width="48" height="5" rx="2.5" fill="#7891B3"/>
    <circle cx="107" cy="12" r="3.5" fill="#5F7899"/>

    <g transform="translate(40 58)">
      <rect width="104" height="72" rx="16" fill="#FFFFFF"/>
      <circle cx="30" cy="36" r="12" fill="#1677FF"/>
      <path d="M49 28h37M49 38h28M49 48h33" stroke="#8AA4C7" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g transform="translate(36 166)">
      <rect width="112" height="86" rx="14" fill="#EAF4FF"/>
      <rect x="12" y="12" width="88" height="62" rx="10" fill="#B8D7FF"/>
      <circle cx="36" cy="34" r="9" fill="#F2C989"/>
      <path d="M18 66l25-22 18 15 14-10 27 17H18z" fill="#3BAA5C"/>
    </g>
  </g>

  <g transform="translate(315 560)">
    <rect x="0" y="0" width="250" height="78" rx="22" fill="#FFFFFF"/>
    <path d="M34 78l22-22H34z" fill="#FFFFFF"/>
    <circle cx="42" cy="35" r="13" fill="#1677FF"/>
    <path d="M71 27h142M71 40h122M71 53h82" stroke="#24466F" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(315 666)">
    <rect width="250" height="78" rx="22" fill="#F4D5A4"/>
    <circle cx="42" cy="39" r="13" fill="#0B2D55"/>
    <path d="M71 29h138M71 42h118M71 55h96" stroke="#704E23" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="316" y="805" fill="#D9E8FB" font-family="'Noto Sans KR',Arial,sans-serif" font-size="20">
    <tspan x="316" dy="0">말로 묻고</tspan>
    <tspan x="316" dy="30">사진으로 보여주고</tspan>
    <tspan x="316" dy="30">안전하게 확인합니다.</tspan>
  </text>

  <line x1="54" y1="892" x2="586" y2="892" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="54" y="930" fill="#FFFFFF" font-family="'Noto Sans KR',Arial,sans-serif" font-size="19" font-weight="700">오법석 지음</text>
  <text x="586" y="930" text-anchor="end" fill="#F2C989" font-family="Arial,sans-serif" font-size="17" font-weight="700">JOYLAB</text>
</svg>