name: Company Compact Rollout Preview QA V1

on:
  pull_request:
    paths:
      - 'src/pages/articles/**'
      - 'src/components/ResearchGraphMap.astro'
      - 'src/config/companyCompactResearch.ts'
      - 'src/styles/research-graph-map-v3.css'
      - 'config/research-graph-*-compact-v1.json'
      - 'config/research-graph-display-modes-v1.json'
      - 'config/company-compact-targets-v1.json'
      - 'scripts/check-company-compact-rollout-v1.mjs'
      - 'scripts/create-company-compact-scaffold-v1.mjs'
      - 'scripts/check-company-compact-contract-v1.mjs'
      - 'package.json'
      - '.github/workflows/company-compact-rollout-gold-v1.yml'
  workflow_dispatch:

jobs:
  compact-rollout-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Run Company Compact Contract
        run: npm run company-compact:contract
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/joylab-preview.log 2>&1 &
          echo $! > /tmp/joylab-preview.pid
      - name: Wait for preview
        run: |
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4321/articles/sk-hynix-outlook > /dev/null && curl -fsS http://127.0.0.1:4321/articles/kb-financial-shareholder-return > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/joylab-preview.log
          exit 1
      - name: Run Company Compact Preview QA
        env:
          QA_BASE_URL: http://127.0.0.1:4321
        run: npm run company-compact:preview-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-compact-rollout-preview-qa
          path: qa-artifacts/company-compact-rollout
          if-no-files-found: warn
