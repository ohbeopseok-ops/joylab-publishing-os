name: GSC 7-Day Visibility

on:
  schedule:
    - cron: '5 1 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/report-gsc-7d.mjs'
      - '.github/workflows/gsc-7d-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gsc-7d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: sc-domain:aijoylab.kr
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Detect GSC credential
        id: credential
        shell: bash
        run: |
          if [ -n "${GSC_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate rolling GSC report
        if: steps.credential.outputs.available == 'true'
        run: node scripts/report-gsc-7d.mjs

      - name: Record credential wait state
        if: steps.credential.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/gsc-7d
          cat > qa-artifacts/gsc-7d/gsc-7d.md <<'EOF'
          # JoyLab GSC 7-Day Visibility

          Status: **WAITING_FOR_CREDENTIAL**

          The reporting workflow is installed and scheduled, but GitHub Actions does not currently have the `GSC_SERVICE_ACCOUNT_JSON` repository secret. Add a Search Console service-account JSON with read access to `sc-domain:aijoylab.kr`; the next scheduled or manual run will automatically produce the live rolling 7-day report.
          EOF
          cat > qa-artifacts/gsc-7d/gsc-7d.json <<'EOF'
          {
            "status": "WAITING_FOR_CREDENTIAL",
            "siteUrl": "sc-domain:aijoylab.kr",
            "requiredSecret": "GSC_SERVICE_ACCOUNT_JSON"
          }
          EOF

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [ -f qa-artifacts/gsc-7d/gsc-7d.md ]; then
            cat qa-artifacts/gsc-7d/gsc-7d.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload GSC report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gsc-7d-visibility
          path: qa-artifacts/gsc-7d
          if-no-files-found: error
          retention-days: 30
