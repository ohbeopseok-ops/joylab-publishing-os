name: GSC 7-Day Visibility

on:
  schedule:
    - cron: '5 1 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/report-gsc-7d.mjs'
      - '.github/workflows/gsc-7d-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gsc-7d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: sc-domain:aijoylab.kr
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate rolling GSC report
        run: node scripts/report-gsc-7d.mjs

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [ -f qa-artifacts/gsc-7d/gsc-7d.md ]; then
            cat qa-artifacts/gsc-7d/gsc-7d.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload GSC report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gsc-7d-visibility
          path: qa-artifacts/gsc-7d
          if-no-files-found: error
          retention-days: 30
