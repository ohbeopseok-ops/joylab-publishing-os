name: KIS OAuth Read-only Smoke V1

on:
  workflow_dispatch:
    inputs:
      acknowledge_token_request:
        description: 'I approve one manual KIS OAuth token request and one read-only market GET'
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: kis-oauth-readonly-smoke-v1
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ inputs.acknowledge_token_request == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: KIS OAuth + one allowlisted read-only market call
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_SMOKE_ACK: 'true'
        run: python3 scripts/qa-kis-auth-smoke-v1.py
