name: Materialize article hero

on:
  push:
    branches:
      - content/money-basics-7-economic-terms
    paths:
      - '.tmp/hero/**'
      - '.github/workflows/materialize-hero.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/money-basics-7-economic-terms
          fetch-depth: 0
      - name: Decode and verify hero asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/articles/money-basics-7-economic-terms
          cat \
            .tmp/hero/part1.b64 \
            .tmp/hero/part2.b64 \
            .tmp/hero/part3.b64 \
            .tmp/hero/part4.b64 \
            .tmp/hero/part5a.b64 \
            .tmp/hero/part5b.b64 \
            .tmp/hero/part5c.b64 \
            .tmp/hero/part6a.b64 \
            .tmp/hero/part6b.b64 \
            .tmp/hero/part6c.b64 \
            | base64 --decode > public/images/articles/money-basics-7-economic-terms/hero.webp
          test "$(wc -c < public/images/articles/money-basics-7-economic-terms/hero.webp | tr -d ' ')" = "77734"
          echo "541effedc6c2a83f714f5e24ad0f0f523efe5ba3deaa620ca92c64d157b94433  public/images/articles/money-basics-7-economic-terms/hero.webp" | sha256sum -c -
          file public/images/articles/money-basics-7-economic-terms/hero.webp | grep -F "Web/P image"
      - name: Commit binary asset and remove staging chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/articles/money-basics-7-economic-terms/hero.webp
          git rm -r .tmp/hero
          git commit -m "Image System V1: add economic terms hero asset"
          git push
