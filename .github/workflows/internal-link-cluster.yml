name: Internal Link Cluster Gate

on:
  pull_request:
    paths:
      - 'src/data/articles/**'
      - 'src/pages/guides/**'
      - 'config/internal-link-clusters.json'
      - 'scripts/check-internal-link-clusters.mjs'
      - '.github/workflows/internal-link-cluster.yml'
  push:
    branches:
      - main
    paths:
      - 'src/data/articles/**'
      - 'src/pages/guides/**'
      - 'config/internal-link-clusters.json'
      - 'scripts/check-internal-link-clusters.mjs'

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Validate pillar and backlink structure
        run: node scripts/check-internal-link-clusters.mjs
