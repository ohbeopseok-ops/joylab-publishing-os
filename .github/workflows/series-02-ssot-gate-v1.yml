name: Series 02 Source of Truth Gate V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Series 02 Source of Truth Gate V1
        run: npm run studio:ssot
      - name: EPUB self-test from canonical source
        run: npm run studio:epub:self-test
