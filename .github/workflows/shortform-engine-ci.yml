name: Shortform Engine CI

on:
  pull_request:
    paths:
      - "shortform-engine/**"
      - "scripts/build-shortform-handoff.mjs"
      - ".github/workflows/shortform-*.yml"
      - "package.json"
  push:
    branches:
      - "feat/shortform-engine-v0.1"
    paths:
      - "shortform-engine/**"
      - "scripts/build-shortform-handoff.mjs"
      - ".github/workflows/shortform-*.yml"
      - "package.json"

jobs:
  gold-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Korean font and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg

      - name: Install engine dependencies
        run: npm --prefix shortform-engine install

      - name: Typecheck
        run: npm --prefix shortform-engine run typecheck

      - name: Render GOLD case
        run: npm --prefix shortform-engine run render:gold

      - name: Verify output contract
        run: |
          test -s shortform-engine/output/ai-workforce-20s.mp4
          ffprobe -v error             -show_entries stream=width,height,r_frame_rate             -show_entries format=duration             -of json             shortform-engine/output/ai-workforce-20s.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: ai-workforce-20s-gold
          path: shortform-engine/output/ai-workforce-20s.mp4
