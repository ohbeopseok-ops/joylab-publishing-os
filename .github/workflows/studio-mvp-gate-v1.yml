name: JoyLab Studio Gate V1

on:
  pull_request:
    paths:
      - 'src/pages/studio/**'
      - 'src/lib/studio/**'
      - 'src/data/studio/**'
      - 'config/contracts/interactive-block-v1.schema.json'
      - 'scripts/check-studio-mvp-v1.mjs'
      - 'scripts/check-series-02-release-manifest-v1.mjs'
      - 'scripts/write-series-02-release-manifest-v1.mjs'
      - 'scripts/release-engine-v2.mjs'
      - 'config/release-engine-v2.json'
      - '.github/workflows/release-engine-v2.yml'
      - 'config/series-02-release-v1.json'
      - 'src/data/studio/releases/**'
      - 'src/pages/studio/releases/**'
      - 'package.json'
      - '.github/workflows/studio-mvp-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: JoyLab Studio Gate V1
        run: npm run studio:gate
      - name: Verify immutable Series 02 release manifest
        run: npm run studio:release:verify
      - name: Release Engine V2 published-state verification
        run: npm run release:engine:v2
      - name: Astro build
        run: npm run build
