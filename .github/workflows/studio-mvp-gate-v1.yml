name: JoyLab Studio Gate V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: JoyLab Studio Gate V1
        run: npm run studio:gate
      - name: Verify immutable Series 02 release manifest
        run: npm run studio:release:verify
      - name: Release Engine V2 published-state verification
        run: npm run release:engine:v2
      - name: Astro build
        run: npm run build
