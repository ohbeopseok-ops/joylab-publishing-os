name: Company Compact Production GOLD V1

on:
  push:
    branches: [main]
    paths:
      - 'src/config/companyCompactResearch.ts'
      - 'config/research-graph-*-compact-v1.json'
      - 'src/pages/articles/**'
      - 'src/components/ResearchGraphMap.astro'
      - 'src/styles/research-graph-map-v3.css'
      - 'scripts/check-company-compact-production-gold-v1.mjs'
      - '.github/workflows/company-compact-production-gold-v1.yml'
  workflow_dispatch:

jobs:
  production-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Wait for Wave 2 production marker
        shell: bash
        run: |
          set -euo pipefail
          url="https://aijoylab.kr/articles/hd-hyundai-heavy-industries-shipbuilding"
          for i in {1..30}; do
            html="$(curl -fsSL --max-time 20 "$url?production-gold=$GITHUB_SHA" || true)"
            if grep -Fq 'HD HYUNDAI HEAVY INDUSTRIES · COMPACT THESIS' <<< "$html"; then
              echo "Wave 2 production marker found"
              exit 0
            fi
            echo "Waiting for production Wave 2 ($i/30)..."
            sleep 10
          done
          echo "Production Wave 2 marker not found"
          exit 1

      - name: Run production GOLD
        env:
          QA_BASE_URL: https://aijoylab.kr
        run: node scripts/check-company-compact-production-gold-v1.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-compact-production-gold
          path: qa-artifacts/company-compact-production-gold
          if-no-files-found: warn
