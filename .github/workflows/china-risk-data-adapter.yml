name: China Semiconductor Risk Data Adapter V1

on:
  pull_request:
    types: [labeled]
    paths:
      - 'scripts/sync-china-risk-data.mjs'
      - 'src/data/china-risk-adapter-config.json'
      - 'src/data/china-semiconductor-risk-snapshot.json'
      - 'src/data/china-semiconductor-risk-history.json'
      - 'scripts/update-china-risk-history.mjs'
      - 'scripts/publish-china-risk-brief.mjs'
      - 'src/data/china-semiconductor-risk-brief.json'
      - 'public/data/china-semiconductor-risk-brief.json'
      - 'src/components/ChinaSemiconductorRiskScore.astro'
      - 'package.json'
      - '.github/workflows/china-risk-data-adapter.yml'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: china-risk-data-adapter
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Adapter self-test
        run: npm run china-risk-data:self-test

      - name: Public-source dry run
        run: npm run china-risk-data:dry-run

      - name: History self-test
        run: npm run china-risk-history:self-test

      - name: Risk Brief self-test
        run: npm run china-risk-brief:self-test

  sync:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Sync public risk sources
        run: npm run china-risk-data:sync

      - name: Update quarterly risk history
        run: npm run china-risk-history:update

      - name: Publish material Risk Brief
        run: npm run china-risk-brief:publish

      - name: Commit changed snapshot, history and brief
        shell: bash
        run: |
          if git diff --quiet -- src/data/china-semiconductor-risk-snapshot.json src/data/china-semiconductor-risk-history.json src/data/china-semiconductor-risk-brief.json public/data/china-semiconductor-risk-brief.json; then
            echo "No risk-data changes."
            exit 0
          fi
          git config user.name "joylab-risk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/china-semiconductor-risk-snapshot.json src/data/china-semiconductor-risk-history.json src/data/china-semiconductor-risk-brief.json public/data/china-semiconductor-risk-brief.json
          git commit -m "data: refresh China semiconductor risk snapshot, history and brief"
          BRANCH="bot/china-risk-data"
          git checkout -B "$BRANCH"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          PR_NUMBER="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" --title "data: refresh China semiconductor risk snapshot" --body "Automated China risk data refresh. Auto-merges after the build check passes."
          fi
          gh pr merge "$BRANCH" --auto --squash || echo "Auto-merge could not be enabled; check the PR."
          gh workflow run build.yml --ref "$BRANCH"
