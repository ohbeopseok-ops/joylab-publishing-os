name: Research Graph Responsive GOLD

on:
  workflow_dispatch:

jobs:
  responsive-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install project
        run: npm ci

      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/joylab-preview.log 2>&1 &
          echo $! > /tmp/joylab-preview.pid

      - name: Wait for preview
        run: |
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4321/guides/growth-leadership > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/joylab-preview.log
          exit 1

      - name: Run GOLD gate
        env:
          QA_BASE_URL: http://127.0.0.1:4321
        run: npm run research-graph:responsive:gold

      - name: Upload GOLD artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-graph-responsive-gold
          path: qa-artifacts/research-graph-responsive-gold
          if-no-files-found: warn
