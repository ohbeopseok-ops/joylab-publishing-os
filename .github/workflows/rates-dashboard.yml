name: Rates Dashboard Refresh

on:
  schedule:
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: rates-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture previous TIC period
        id: before
        run: echo "tic_period=$(node -e \"const d=require('./src/data/rates-dashboard.json'); console.log(d.series.foreignTreasuryHoldings.period)\")" >> "$GITHUB_OUTPUT"

      - name: Refresh rates data
        run: node scripts/update-rates-dashboard.mjs

      - name: Build gate
        run: npm run build

      - name: Capture refreshed TIC period
        id: after
        run: echo "tic_period=$(node -e \"const d=require('./src/data/rates-dashboard.json'); console.log(d.series.foreignTreasuryHoldings.period)\")" >> "$GITHUB_OUTPUT"

      - name: Commit verified dashboard data
        id: commit
        run: |
          if git diff --quiet -- src/data/rates-dashboard.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "joylab-rates-bot"
          git config user.email "joylab-rates-bot@users.noreply.github.com"
          git add src/data/rates-dashboard.json
          git commit -m "data: refresh rates dashboard"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open TIC editorial update issue
        if: steps.before.outputs.tic_period != steps.after.outputs.tic_period
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_TIC: ${{ steps.before.outputs.tic_period }}
          NEW_TIC: ${{ steps.after.outputs.tic_period }}
        run: |
          existing=$(gh issue list --state open --search "TIC editorial refresh ${NEW_TIC} in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then exit 0; fi
          gh issue create \
            --title "TIC editorial refresh ${NEW_TIC}" \
            --body "## Trigger\nRates Dashboard detected a new U.S. Treasury TIC period: **${OLD_TIC} → ${NEW_TIC}**.\n\n## Required editorial update\n- [ ] Verify Major Foreign Holders Table 5 values\n- [ ] Update \`china-us-treasury-holdings-2026.md\`\n- [ ] Update \`who-buys-us-treasuries-2026.md\`\n- [ ] Regenerate major holders comparison chart / caption\n- [ ] Re-check China, Japan, UK and foreign-official deltas\n- [ ] Build green\n- [ ] Merge and production smoke test\n\n## Rule\nDashboard numbers may update automatically after plausibility checks. Research prose and editorial interpretation require source verification and PR review before publication."
