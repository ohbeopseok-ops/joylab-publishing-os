name: Rates Dashboard Refresh

on:
  schedule:
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: rates-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture previous TIC period
        id: before
        run: echo "tic_period=$(node -e \"const d=require('./src/data/rates-dashboard.json'); console.log(d.series.foreignTreasuryHoldings.period)\")" >> "$GITHUB_OUTPUT"

      - name: Official Treasury structure self-test
        run: npm run treasury:self-test

      - name: Market rates self-test
        run: npm run rates:self-test

      - name: Refresh official Auction + TIC + 30D market data
        run: npm run build

      - name: Capture refreshed TIC period
        id: after
        run: echo "tic_period=$(node -e \"const d=require('./src/data/rates-dashboard.json'); console.log(d.series.foreignTreasuryHoldings.period)\")" >> "$GITHUB_OUTPUT"

      - name: Commit verified dashboard data
        id: commit
        run: |
          if git diff --quiet -- src/data/rates-dashboard.json src/data/rates-timeseries.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "joylab-rates-bot"
          git config user.email "joylab-rates-bot@users.noreply.github.com"
          git add src/data/rates-dashboard.json src/data/rates-timeseries.json
          git commit -m "data: refresh Treasury risk inputs"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open TIC Monthly Research Runtime issue
        if: steps.before.outputs.tic_period != steps.after.outputs.tic_period
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_TIC: ${{ steps.before.outputs.tic_period }}
          NEW_TIC: ${{ steps.after.outputs.tic_period }}
        run: |
          existing=$(gh issue list --state open --search "TIC Monthly Research ${NEW_TIC} in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then exit 0; fi
          gh issue create \
            --title "TIC Monthly Research ${NEW_TIC}" \
            --body "## Trigger\nTIC Monthly Research Runtime detected a new U.S. Treasury TIC period: **${OLD_TIC} → ${NEW_TIC}**.\n\nRuntime spec: \`docs/operations/tic-monthly-research-runtime.md\`\n\n## Automated inputs\n- Auction Score: latest 10Y + 30Y from TreasuryDirect TA_WS\n- TIC Score: SLT Table 5 holdings + SLT Table 1 Treasury net flows\n- Market Risk: 10Y + 30Y + USD/KRW Level/Momentum\n- Treasury Risk Index V1.1 recomputed after all inputs refresh\n\n## Required editorial validation\n- [ ] Verify Grand Total / Foreign Official holdings\n- [ ] Verify China / Japan / United Kingdom\n- [ ] Reconcile MoM and YoY deltas\n- [ ] Separate holdings change from monthly transaction flow\n- [ ] Update \`china-us-treasury-holdings-2026.md\` if interpretation changed\n- [ ] Update \`who-buys-us-treasuries-2026.md\` if buyer regime changed\n- [ ] Re-evaluate crisis / stress language before publishing prose\n\n## Rule\nNumbers and model scores may refresh automatically after plausibility checks. Research prose, crisis language and investment interpretation require verified source review and PR approval."
