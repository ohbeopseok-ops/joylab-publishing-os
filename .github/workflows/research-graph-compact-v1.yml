name: Research Graph Compact Mode V1

on:
  workflow_dispatch:

jobs:
  compact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run research-graph:compact:check
      - run: npm run build
