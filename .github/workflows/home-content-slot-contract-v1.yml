name: Home Content Slot Contract V1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit home content slots
        run: npm run home-slot:audit

      - name: Upload home slot contract audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: home-content-slot-contract-v1
          path: qa-artifacts/home-content-slot-contract-v1/report.json
          if-no-files-found: error
          retention-days: 90
