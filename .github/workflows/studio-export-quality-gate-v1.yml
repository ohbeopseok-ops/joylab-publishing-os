name: Studio Export Quality Gate V1

on:
  pull_request:
    paths:
      - 'src/data/studio/series-02-source.json'
      - 'scripts/generate-studio-epub-v1.mjs'
      - 'scripts/generate-studio-print-pdf-v1.mjs'
      - 'scripts/generate-export-provenance-v1.mjs'
      - 'scripts/preflight-studio-print-pdf-v1.mjs'
      - 'scripts/check-studio-production-smoke-v1.mjs'
      - '.github/workflows/studio-export-quality-gate-v1.yml'
      - '.github/workflows/deploy-cloudflare.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Korean font and PDF preflight tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils unzip
      - run: npm ci
      - name: Build site and EPUB
        run: npm run build
      - name: Install Playwright PDF runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Generate Print PDF
        run: npm run studio:print
      - name: PDF preflight
        run: npm run studio:pdf:preflight
      - name: EPUBCheck 5.4.0
        run: |
          curl -fL --retry 3 -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          java -jar /tmp/epubcheck/epubcheck-5.4.0/epubcheck.jar dist/studio/exports/series-02-memory-debt.epub
      - name: Generate provenance manifest
        run: npm run studio:provenance
      - name: Upload export quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: joylab-studio-export-quality-v1
          path: |
            dist/studio/exports/series-02-memory-debt.epub
            dist/studio/exports/series-02-memory-debt-print.pdf
            dist/studio/exports/export-provenance-v1.json
          if-no-files-found: error
          retention-days: 30
