name: Responsive Visual Gate V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/**'
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/styles/**'
      - 'src/data/**'
      - 'scripts/qa-responsive-visual-v2.mjs'
      - '.github/workflows/responsive-visual-gate-v2.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/**'
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/styles/**'
      - 'src/data/**'
      - 'scripts/qa-responsive-visual-v2.mjs'
      - '.github/workflows/responsive-visual-gate-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/responsive-v2-preview.log 2>&1 &
          echo $! > /tmp/responsive-v2-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/responsive-v2-preview.log
          exit 1

      - name: Responsive Visual Gate V2
        run: node scripts/qa-responsive-visual-v2.mjs

      - name: Stop preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/responsive-v2-preview.pid ]; then kill "$(cat /tmp/responsive-v2-preview.pid)" || true; fi

      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: responsive-visual-gate-v2
          path: qa-artifacts/responsive-visual-gate-v2
          if-no-files-found: error
          retention-days: 30
