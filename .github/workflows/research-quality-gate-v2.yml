name: Research Quality Gate V2

on:
  pull_request:
    paths:
      - "src/data/articles/**"
      - "docs/JOYLAB_RESEARCH_STANDARD_V2.0.md"
      - "docs/prompts/**"
      - "config/research-quality-gate-v2.json"
      - "scripts/audit-research-v2.mjs"
      - ".github/workflows/research-quality-gate-v2.yml"
  push:
    branches: [main]
    paths:
      - "src/data/articles/**"
      - "docs/prompts/**"
      - "config/research-quality-gate-v2.json"
      - "scripts/audit-research-v2.mjs"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit all research articles
        run: node scripts/audit-research-v2.mjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-v2-audit
          path: artifacts/research-v2-audit.*
