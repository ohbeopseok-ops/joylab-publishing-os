name: AdSense Site Readiness Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/check-adsense-site-readiness-v1.mjs'
      - '.github/workflows/adsense-site-readiness-v1.yml'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/check-adsense-site-readiness-v1.mjs'
      - '.github/workflows/adsense-site-readiness-v1.yml'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adsense-site-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check dead links, sitemap coverage and noindex rules
        run: node scripts/check-adsense-site-readiness-v1.mjs
