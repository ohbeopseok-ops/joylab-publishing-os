name: Books Production Visual QA

on:
  pull_request:
    paths:
      - 'src/pages/index.astro'
      - 'src/styles/homepage-books-feature.css'
      - '.github/workflows/deploy-cloudflare.yml'
      - 'scripts/qa-books-production.mjs'
      - '.github/workflows/books-production-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Audit production Books
        run: node scripts/qa-books-production.mjs

      - name: Upload Books QA screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: books-production-visual-qa
          path: qa-artifacts/books-production
          if-no-files-found: warn
          retention-days: 30
