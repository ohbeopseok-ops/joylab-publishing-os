name: About Activation Branch QA

on:
  push:
    branches: [activation/about-pass-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  about-activation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Check About QA syntax
        run: node --check scripts/qa-about-activation.mjs

      - name: Test Click Analytics V3 Worker contract
        run: node scripts/test-click-analytics.mjs

      - name: Build Astro site
        run: npm run build

      - name: Verify About identity and channels
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'id="joylab-identity-schema"' dist/about/index.html
          grep -Fq '"@id":"https://aijoylab.kr/#organization"' dist/about/index.html
          grep -Fq '"@id":"https://aijoylab.kr/#founder"' dist/about/index.html
          grep -Fq 'OFFICIAL CHANNELS' dist/about/index.html
          grep -Fq 'data-analytics-placement="about"' dist/about/index.html
          grep -Fq '오법석 · AIJoyLab' dist/about/index.html

      - name: Install Playwright QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Astro preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/joylab-preview.log 2>&1 &
          echo $! > /tmp/joylab-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/about >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/joylab-preview.log
          exit 1

      - name: About Activation PC/Mobile GOLD QA
        run: node scripts/qa-about-activation.mjs

      - name: Stop Astro preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/joylab-preview.pid ]; then kill "$(cat /tmp/joylab-preview.pid)" || true; fi

      - name: Upload About Activation GOLD QA screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: about-activation-gold-qa
          path: qa-artifacts/about-activation
          if-no-files-found: warn
