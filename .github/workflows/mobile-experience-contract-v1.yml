name: Mobile Experience Contract V1

on:
  pull_request:
    types: [labeled]
    branches: [main]
    paths:
      - 'src/pages/**'
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/styles/**'
      - 'src/data/articles/**'
      - 'src/data/research-image-manifest.json'
      - 'src/data/article-image-overrides.json'
      - 'public/images/**'
      - 'src/data/mobile-experience-contract-v1.json'
      - 'scripts/check-first-content-entry-budget-v1.mjs'
      - 'scripts/rank-first-content-entry-v1.mjs'
      - 'src/data/first-content-priority-v1.json'
      - 'scripts/check-mobile-experience-contract-v1.mjs'
      - 'scripts/check-mobile-lighthouse-v1.mjs'
      - '.github/workflows/mobile-experience-contract-v1.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/**'
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/styles/**'
      - 'src/data/articles/**'
      - 'src/data/research-image-manifest.json'
      - 'src/data/article-image-overrides.json'
      - 'public/images/**'
      - 'src/data/mobile-experience-contract-v1.json'
      - 'scripts/check-first-content-entry-budget-v1.mjs'
      - 'scripts/rank-first-content-entry-v1.mjs'
      - 'src/data/first-content-priority-v1.json'
      - 'scripts/check-mobile-experience-contract-v1.mjs'
      - 'scripts/check-mobile-lighthouse-v1.mjs'
      - '.github/workflows/mobile-experience-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/mobile-experience-preview.log 2>&1 &
          echo $! > /tmp/mobile-experience-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mobile-experience-preview.log
          exit 1

      - name: First Content Entry Budget V1
        run: node scripts/check-first-content-entry-budget-v1.mjs

      - name: Rank First Content Entry V1
        run: node scripts/rank-first-content-entry-v1.mjs

      - name: Mobile Font Rendering Gate V1
        run: node scripts/check-mobile-experience-contract-v1.mjs

      - name: Install Lighthouse
        run: npm install --no-save --package-lock=false lighthouse@12.8.2

      - name: Run Lighthouse mobile 390 and 430
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/mobile-experience-contract-v1
          for spec in "home|/" "articles|/articles" "giant-shoulder|/articles/semiconductor-giant-shoulder-flow" "investing-guide|/guides/investing"; do
            name="${spec%%|*}"
            route="${spec#*|}"
            for viewport in "iphone-390|390|844" "iphone-430|430|932"; do
              vp="${viewport%%|*}"
              rest="${viewport#*|}"
              width="${rest%%|*}"
              height="${rest#*|}"
              npx lighthouse "http://127.0.0.1:4321${route}"                 --quiet                 --output=json                 --output-path="qa-artifacts/mobile-experience-contract-v1/lighthouse-${name}-${vp}.json"                 --only-categories=performance                 --form-factor=mobile                 --screenEmulation.mobile=true                 --screenEmulation.width="${width}"                 --screenEmulation.height="${height}"                 --screenEmulation.deviceScaleFactor=1                 --throttling-method=provided                 --throttling.cpuSlowdownMultiplier=1                 --chrome-flags="--headless --no-sandbox"
            done
          done

      - name: Mobile Lighthouse Budget V1
        run: node scripts/check-mobile-lighthouse-v1.mjs

      - name: Stop preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/mobile-experience-preview.pid ]; then kill "$(cat /tmp/mobile-experience-preview.pid)" || true; fi

      - name: Upload mobile experience evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-experience-contract-v1
          path: |
            qa-artifacts/first-content-entry-budget-v1
            qa-artifacts/first-content-ranking-v1
            qa-artifacts/mobile-experience-contract-v1
          if-no-files-found: warn
          retention-days: 30
