name: Research Image Sync Branch

on:
  push:
    branches: [feat/global-research-image-standard]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/global-research-image-standard
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Sync manifest and audit
        run: node scripts/sync-research-image-manifest.mjs
      - name: Commit generated research image coverage
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/research-image-manifest.json docs/operations/research-image-audit-2026-09-13.md
          git commit -m 'chore: sync global research image coverage'
          git push origin HEAD:feat/global-research-image-standard
