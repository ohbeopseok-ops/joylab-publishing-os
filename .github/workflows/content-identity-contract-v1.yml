name: Content Identity Contract V1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Audit published content identity
        env:
          IDENTITY_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run content-identity:audit
      - name: Upload identity audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: content-identity-contract-v1
          path: qa-artifacts/content-identity-contract-v1/report.json
          if-no-files-found: error
          retention-days: 90
