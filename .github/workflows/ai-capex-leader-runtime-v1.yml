name: AI CAPEX Leader Runtime V1

on:
  schedule:
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-capex-leader-runtime-v1
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resume outstanding runtime branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="bot/ai-capex-leader-runtime"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git rebase origin/main
          else
            git checkout -b "$BRANCH"
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Market adapter self-test
        run: npm run ai-capex-market:self-test

      - name: Fundamental adapter self-test
        run: npm run ai-capex-fundamental:self-test

      - name: Runtime self-test
        run: npm run ai-capex-leader:self-test

      - name: Refresh direct market snapshot
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: npm run ai-capex-market:update

      - name: Refresh fundamental snapshot
        env:
          AI_CAPEX_EPS_CONSENSUS_URL: ${{ secrets.AI_CAPEX_EPS_CONSENSUS_URL }}
          AI_CAPEX_EPS_CONSENSUS_TOKEN: ${{ secrets.AI_CAPEX_EPS_CONSENSUS_TOKEN }}
          AI_CAPEX_IR_EVIDENCE_URL: ${{ secrets.AI_CAPEX_IR_EVIDENCE_URL }}
          AI_CAPEX_IR_EVIDENCE_TOKEN: ${{ secrets.AI_CAPEX_IR_EVIDENCE_TOKEN }}
        run: npm run ai-capex-fundamental:update

      - name: Refresh Leader Score and regime history
        run: npm run ai-capex-leader:update

      - name: Validate generated JSON
        run: |
          node -e "for (const f of ['src/data/ai-capex-market-snapshot-v1.json','src/data/ai-capex-fundamental-snapshot-v1.json','src/data/ai-capex-leader-v1.json','src/data/ai-capex-leader-history-v1.json','src/data/ai-capex-regime-events-v1.json']) JSON.parse(require('node:fs').readFileSync(f,'utf8')); console.log('AI CAPEX JSON PASS')"

      - name: Open protected-main update PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/ai-capex-market-snapshot-v1.json src/data/ai-capex-fundamental-snapshot-v1.json src/data/ai-capex-leader-v1.json src/data/ai-capex-leader-history-v1.json src/data/ai-capex-regime-events-v1.json; then
            echo 'No AI CAPEX leader changes.'
            exit 0
          fi
          BRANCH="bot/ai-capex-leader-runtime"
          git config user.name 'JoyLab AI CAPEX Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/data/ai-capex-market-snapshot-v1.json src/data/ai-capex-leader-v1.json src/data/ai-capex-leader-history-v1.json src/data/ai-capex-regime-events-v1.json
          git commit -m 'data: refresh AI CAPEX leader scores and regime history'
          git push --force-with-lease origin "$BRANCH"
          PR_NUMBER="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            set +e
            PR_OUTPUT="$(gh pr create --base main --head "$BRANCH"               --title "data(ai-capex): refresh leader scores $(date -u +%Y-%m-%d)"               --body "Automated AI CAPEX Leader Runtime refresh. This persistent branch carries forward unmerged history. Protected main is preserved; merge only after required gates pass." 2>&1)"
            PR_EXIT=$?
            set -e
            if [ "$PR_EXIT" -eq 0 ]; then
              echo "$PR_OUTPUT"
              echo "Runtime PR created."
            elif printf '%s' "$PR_OUTPUT" | grep -Fq "GitHub Actions is not permitted to create or approve pull requests"; then
              echo "::warning title=Runtime PR creation blocked::GitHub Actions PR creation is disabled in repository settings. Data was pushed successfully to $BRANCH."
              echo "Open this URL to create the PR manually: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            else
              echo "$PR_OUTPUT" >&2
              exit "$PR_EXIT"
            fi
          else
            gh pr comment "$PR_NUMBER" --body "Runtime refreshed on the existing bot branch; history and regime events were carried forward."
          fi
