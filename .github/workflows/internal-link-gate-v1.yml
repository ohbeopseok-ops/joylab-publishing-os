name: Internal Link Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/articles/**'
      - 'src/pages/guides/**'
      - 'scripts/check-internal-links-v1.mjs'
  push:
    branches: [main]
    paths:
      - 'src/data/articles/**'
      - 'src/pages/guides/**'
      - 'scripts/check-internal-links-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check Pillar · related links · backlinks
        env:
          INTERNAL_LINK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-internal-links-v1.mjs
