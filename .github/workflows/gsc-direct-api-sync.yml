name: GSC Direct API Sync

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gsc-api-sync.mjs'
      - '.github/workflows/gsc-direct-api-sync.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: gsc-direct-api-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check direct API script syntax
        run: node --check scripts/gsc-api-sync.mjs

      - name: Check direct API configuration
        id: config
        run: |
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GSC_SERVICE_ACCOUNT_JSON not configured — CSV fallback remains active."
          fi

      - name: Sync 28 settled days from Google Search Console
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        run: node scripts/gsc-api-sync.mjs

      - name: Re-score Evidence Priority
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        run: node scripts/research-corpus-evidence-audit.mjs

      - name: Persist latest GSC snapshot through protected-main PR
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BRANCH: automation/gsc-data
        run: |
          git config user.name "joylab-gsc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gsc/latest.json data/gsc/history

          if git diff --cached --quiet; then
            echo "No new settled GSC data"
            exit 0
          fi

          git checkout -B "$BOT_BRANCH"
          git commit -m "gsc: sync official Search Console API"
          git push --force origin "HEAD:$BOT_BRANCH"

          pr_number="$(gh pr list --head "$BOT_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create               --base main               --head "$BOT_BRANCH"               --title "chore(gsc): refresh Search Console snapshot"               --body "Automated GSC snapshot refresh. Source: Google Search Console API. Evidence Priority is recalculated from the same snapshot.")"
            pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"
          fi

          echo "GSC data PR #$pr_number"

          gh workflow run build.yml --ref "$BOT_BRANCH"

          gh pr merge "$pr_number" --auto --squash             || echo "Auto-merge is unavailable; PR #$pr_number remains open for manual merge after checks."

      - name: Upload Evidence Priority report
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gsc-direct-evidence-priority
          path: |
            data/gsc/latest.json
            artifacts/research-corpus-evidence-audit.json
            artifacts/research-corpus-evidence-audit.md
          if-no-files-found: error
