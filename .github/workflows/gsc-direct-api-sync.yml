name: GSC Direct API Sync

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gsc-direct-api-sync.yml'
      - 'scripts/gsc-api-sync.mjs'
      - 'scripts/research-corpus-evidence-audit.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gsc-api-sync.mjs'
      - '.github/workflows/gsc-direct-api-sync.yml'

permissions:
  contents: write

concurrency:
  group: gsc-direct-api-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check direct API script syntax
        run: node --check scripts/gsc-api-sync.mjs

      - name: Check direct API configuration
        id: config
        run: |
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GSC_SERVICE_ACCOUNT_JSON not configured — CSV fallback remains active."
          fi

      - name: Restore previous GSC data branch
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        run: |
          if git ls-remote --exit-code --heads origin automation/gsc-data >/dev/null 2>&1; then
            git fetch origin automation/gsc-data
            git checkout FETCH_HEAD -- data/gsc/latest.json data/gsc/history 2>/dev/null || true
          fi

      - name: Sync 28 settled days from Google Search Console
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        run: node scripts/gsc-api-sync.mjs

      - name: Re-score Evidence Priority
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        run: node scripts/research-corpus-evidence-audit.mjs

      - name: Persist GSC data plane
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        env:
          BOT_BRANCH: automation/gsc-data
        run: |
          git config user.name "joylab-gsc-bot"
          git config user.email "actions@users.noreply.github.com"

          mkdir -p data/gsc/history artifacts
          if ls data/gsc/history/*.json >/dev/null 2>&1; then
            ls -1t data/gsc/history/*.json | tail -n +91 | xargs -r rm --
          fi

          git add data/gsc/latest.json data/gsc/history             artifacts/research-corpus-evidence-audit.json             artifacts/research-corpus-evidence-audit.md

          if git diff --cached --quiet; then
            echo "No new settled GSC data"
            exit 0
          fi

          git checkout -B "$BOT_BRANCH"
          git commit -m "gsc: refresh data plane"
          git push --force origin "HEAD:$BOT_BRANCH"

          echo "GSC data plane updated: $BOT_BRANCH"
      - name: Upload Evidence Priority report
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gsc-direct-evidence-priority
          path: |
            data/gsc/latest.json
            artifacts/research-corpus-evidence-audit.json
            artifacts/research-corpus-evidence-audit.md
          if-no-files-found: error
