name: Books Visual QA V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/books/**'
      - 'src/pages/index.astro'
      - 'src/data/books/**'
      - 'src/data/book-chapters/**'
      - 'src/layouts/BaseLayout.astro'
      - 'src/components/BookSchema.astro'
      - 'src/styles/books.css'
      - 'src/styles/book-call-center-ai.css'
      - 'src/styles/homepage-books-v2.css'
      - 'src/styles/book-reader.css'
      - 'public/books/**'
      - 'scripts/qa-books-visual.mjs'
      - 'scripts/qa-call-center-reader.mjs'
      - 'scripts/qa-weight-of-silence-reader.mjs'
      - 'scripts/qa-weight-of-silence-mindmap.mjs'
      - 'scripts/qa-senior-mom-gemini-390.mjs'
      - 'scripts/check-reader-binary-immutability.mjs'
      - 'config/reader-binary-assets.json'
      - '.github/workflows/books-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Korean font for book artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/books-preview.log 2>&1 &
          echo $! > /tmp/books-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/books >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/books-preview.log
          exit 1
      - name: Books visual QA
        run: node scripts/qa-books-visual.mjs
      - name: Call-center Reader 1440/1920 GOLD QA
        run: node scripts/qa-call-center-reader.mjs
      - name: Weight of Silence Reader 1440/390 GOLD QA
        run: node scripts/qa-weight-of-silence-reader.mjs
      - name: Weight of Silence Mindmap 1440/390 GOLD QA
        run: node scripts/qa-weight-of-silence-mindmap.mjs
      - name: Senior Mom Gemini Detail 390 GOLD QA
        run: node scripts/qa-senior-mom-gemini-390.mjs
      - name: Stop preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/books-preview.pid ]; then kill "$(cat /tmp/books-preview.pid)" || true; fi
      - name: Upload Books QA
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: books-visual-qa
          path: qa-artifacts/books
          if-no-files-found: error
          retention-days: 30
