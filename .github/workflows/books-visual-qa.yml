name: Books Visual QA V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/books/**'
      - 'src/styles/books.css'
      - 'src/styles/book-reader.css'
      - 'scripts/qa-books-visual.mjs'
      - '.github/workflows/books-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/books-preview.log 2>&1 &
          echo $! > /tmp/books-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/books/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/books-preview.log
          exit 1
      - name: Books visual QA
        run: node scripts/qa-books-visual.mjs
      - name: Stop preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/books-preview.pid ]; then kill "$(cat /tmp/books-preview.pid)" || true; fi
      - name: Upload Books QA
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: books-visual-qa
          path: qa-artifacts/books
          if-no-files-found: error
          retention-days: 30
