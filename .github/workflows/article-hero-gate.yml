name: Article Hero Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/data/articles/**'
      - 'src/data/research-image-manifest.json'
      - 'src/data/article-image-overrides.json'
      - 'src/data/curated-generated-heroes.json'
      - 'public/images/**'
      - 'scripts/check-article-heroes.mjs'
      - 'scripts/check-article-hero-quality-v3.mjs'
      - 'src/data/article-hero-quality-rules-v3.json'
      - 'scripts/apply-curated-research-images.mjs'
      - 'scripts/materialize-ep03-demian-v5.mjs'
      - 'assets/ep03-demian-v5/**'
      - 'scripts/assemble-generated-hero-assets.mjs'
      - '.github/workflows/article-hero-gate.yml'
  pull_request:
    types: [labeled]
    branches: [main]
    paths:
      - 'src/data/articles/**'
      - 'src/data/research-image-manifest.json'
      - 'src/data/article-image-overrides.json'
      - 'src/data/curated-generated-heroes.json'
      - 'public/images/**'
      - 'scripts/check-article-heroes.mjs'
      - 'scripts/check-article-hero-quality-v3.mjs'
      - 'src/data/article-hero-quality-rules-v3.json'
      - 'scripts/apply-curated-research-images.mjs'
      - 'scripts/materialize-ep03-demian-v5.mjs'
      - 'assets/ep03-demian-v5/**'
      - 'scripts/assemble-generated-hero-assets.mjs'
      - '.github/workflows/article-hero-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  article-hero-gate:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-gates'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Materialize curated Hero assets and overrides
        run: node scripts/apply-curated-research-images.mjs

      - name: Validate every published Article Hero
        run: node scripts/check-article-heroes.mjs

      - name: Validate raster Hero quality V3
        run: node scripts/check-article-hero-quality-v3.mjs
