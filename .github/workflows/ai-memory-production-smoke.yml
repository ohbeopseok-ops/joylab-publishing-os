name: AI Memory Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check-ai-memory-production.mjs'
      - '.github/workflows/ai-memory-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify production HTTP 200 · canonical · JSON-LD · sitemap
        run: node scripts/check-ai-memory-production.mjs
      - name: Upload production smoke report
        uses: actions/upload-artifact@v6
        with:
          name: ai-memory-production-smoke
          path: qa-artifacts/ai-memory-production-smoke
          if-no-files-found: error
          retention-days: 30
