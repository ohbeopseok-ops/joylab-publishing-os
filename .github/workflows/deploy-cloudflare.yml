name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Korean font for book artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Materialize verified EP03 hero
        run: node scripts/materialize-ep03-demian-v5.mjs

      - name: Build Astro site
        id: build_site
        run: npm run build

      - name: Legacy Public Email Gate
        run: node scripts/check-legacy-public-email.mjs

      - name: Deploy to Cloudflare Workers
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Wait for custom domain
        id: custom_domain
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if curl -fsS --max-time 15 https://aijoylab.kr/ >/dev/null; then
              echo "aijoylab.kr is reachable"
              exit 0
            fi
            echo "Waiting for DNS/TLS propagation ($i/18)..."
            sleep 10
          done
          echo "aijoylab.kr did not become reachable in time"
          exit 1

      - name: Production smoke test
        id: production_smoke
        shell: bash
        run: |
          set -euo pipefail

          check_200() {
            url="$1"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$url")
            echo "$code $url"
            test "$code" = "200"
            test -s /tmp/body
          }

          check_follow_200() {
            url="$1"
            code=$(curl -LsS -o /tmp/body -w '%{http_code}' --max-time 20 "$url")
            echo "$code $url (follow redirects)"
            test "$code" = "200"
            test -s /tmp/body
          }

          check_200 https://aijoylab.kr/
          grep -Fq 'JoyLab' /tmp/body
          grep -Fq 'https://aijoylab.kr/' /tmp/body
          grep -Fq 'content-search' /tmp/body
          grep -Fq 'tag-filter' /tmp/body
          grep -Fq 'load-more' /tmp/body
          grep -Fq '/guides/semiconductor-investing' /tmp/body
          grep -Fq 'id="site-footer-v2"' /tmp/body
          grep -Fq 'https://blog.naver.com/joy014' /tmp/body
          grep -Fq 'https://www.threads.com/@ohbeopseok' /tmp/body
          grep -Fq 'https://www.instagram.com/aijoylab/' /tmp/body
          grep -Fq 'linkedin.com/in/' /tmp/body
          grep -Fq 'contact@aijoylab.kr' /tmp/body
          grep -Fq '/__analytics/event' /tmp/body
          grep -Fq 'data-analytics-event="social_click"' /tmp/body
          ! grep -Fq 'id="article-contact-cta"' /tmp/body

          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/body', 'utf8');
          const match = html.match(/<h2>최신 업데이트<\/h2>([\s\S]*?)<div class="home-category-card">/);
          if (!match) throw new Error('최신 업데이트 section not found');
          const latest = match[1];
          if (!latest.includes('/articles/')) throw new Error('최신 업데이트 must contain article links');
          if (latest.includes('/books/')) throw new Error('Books leaked into 최신 업데이트');
          console.log('Home latest slot article-only PASS');
          NODE

          check_200 "https://aijoylab.kr/books?deploy=${GITHUB_SHA}"
          grep -Fq 'LIBRARY · 출간일순' /tmp/body
          grep -Fq '출간일 2026. 9. 25.' /tmp/body
          grep -Fq '악보의 쉼표 사이에 고여 있는 침묵의 무게' /tmp/body

          headers=$(curl -sSI --max-time 20 https://aijoylab.kr/ | tr -d '\r')
          echo "$headers"
          grep -Fqi 'strict-transport-security: max-age=31536000; includeSubDomains' <<< "$headers"
          grep -Fqi 'x-content-type-options: nosniff' <<< "$headers"
          grep -Fqi 'x-frame-options: DENY' <<< "$headers"
          grep -Fqi 'referrer-policy: strict-origin-when-cross-origin' <<< "$headers"
          grep -Fqi 'permissions-policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()' <<< "$headers"

          analytics_code=$(curl -sS -o /tmp/analytics-body -w '%{http_code}' --max-time 20 \
            -X POST \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            -H 'Origin: https://aijoylab.kr' \
            -H 'Sec-Fetch-Site: same-origin' \
            --data '{"event":"smoke_test","target":"deploy","placement":"production_smoke","path":"/"}' \
            https://aijoylab.kr/__analytics/event)
          echo "$analytics_code https://aijoylab.kr/__analytics/event"
          test "$analytics_code" = "204"

          check_200 "https://aijoylab.kr/guides/growth-leadership?deploy=${GITHUB_SHA}"
          grep -Fq '완벽하지 않아서 스며들 수 있었다' /tmp/body
          grep -Fq '/books/' /tmp/body
          grep -Fq '/guides/growth-leadership/literature' /tmp/body
          grep -Fq '/guides/growth-leadership/playbook/performance-coaching' /tmp/body

          check_200 "https://aijoylab.kr/guides/growth-leadership/literature?deploy=${GITHUB_SHA}"
          grep -Fq '문학에서 배우는 리더십' /tmp/body
          grep -Fq '/guides/growth-leadership/literature/old-man-and-the-sea' /tmp/body
          grep -Fq '/guides/growth-leadership/literature/little-prince' /tmp/body
          grep -Fq '/guides/growth-leadership/literature/demian' /tmp/body
          grep -Fq '/guides/growth-leadership/literature/metamorphosis' /tmp/body

          check_200 "https://aijoylab.kr/guides/growth-leadership/literature/old-man-and-the-sea?deploy=${GITHUB_SHA}"
          grep -Fq '성과가 무너졌을 때' /tmp/body
          grep -Fq 'RESEARCH BRIEF' /tmp/body
          grep -Fq 'KEY TAKEAWAYS' /tmp/body
          grep -Fq 'LEADERSHIP ACTION' /tmp/body
          grep -Fq 'NEXT · EP02' /tmp/body
          grep -Fq '/images/leadership/literature/ep01-old-man-and-the-sea.webp' /tmp/body
          grep -Fq '/guides/growth-leadership/playbook/performance-coaching' /tmp/body
          grep -Fq '/guides/growth-leadership/literature/little-prince' /tmp/body

          check_200 "https://aijoylab.kr/guides/growth-leadership/literature/little-prince?deploy=${GITHUB_SHA}"
          grep -Fq '관계를 만든다는 것은' /tmp/body
          grep -Fq 'RESEARCH BRIEF' /tmp/body
          grep -Fq 'KEY TAKEAWAYS' /tmp/body
          grep -Fq 'LEADERSHIP ACTION' /tmp/body
          grep -Fq 'NEXT · EP03' /tmp/body
          grep -Fq '/images/leadership/literature/ep02-little-prince.webp' /tmp/body
          grep -Fq 'og:image:width" content="1200"' /tmp/body
          grep -Fq 'og:image:height" content="675"' /tmp/body
          grep -Fq '/guides/growth-leadership/literature/demian' /tmp/body

          check_200 https://aijoylab.kr/images/leadership/literature/ep02-little-prince.webp

          check_200 "https://aijoylab.kr/guides/growth-leadership/literature/demian?deploy=${GITHUB_SHA}"
          grep -Fq '리더는 답을 줘야 하는가' /tmp/body
