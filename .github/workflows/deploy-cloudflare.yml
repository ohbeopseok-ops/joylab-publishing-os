          grep -Fq 'KEY TAKEAWAYS' /tmp/body
          grep -Fq 'LEADERSHIP ACTION' /tmp/body
          grep -Fq 'NEXT · EP04' /tmp/body
          grep -Fq '/images/leadership/literature/ep03-demian-v7.webp' /tmp/body
          grep -Fq 'og:image:width" content="1200"' /tmp/body
          grep -Fq 'og:image:height" content="675"' /tmp/body
          grep -Fq '/guides/growth-leadership/literature/metamorphosis' /tmp/body

          ep03_asset="https://aijoylab.kr/images/leadership/literature/ep03-demian-v7.webp?deploy=${GITHUB_SHA}"
