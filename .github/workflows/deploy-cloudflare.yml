          echo "$ep03_code $ep03_asset"
          test "$ep03_code" = "200"
          test "$(stat -c%s /tmp/ep03-demian-v7.webp)" -gt 1000
          node scripts/check-production-image.mjs /tmp/ep03-demian-v7.webp 1200 675

          check_200 "https://aijoylab.kr/guides/growth-leadership/literature/metamorphosis?deploy=${GITHUB_SHA}"
          grep -Fq '쓸모를 잃으면' /tmp/body
