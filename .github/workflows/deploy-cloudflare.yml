          grep -Fq 'KEY TAKEAWAYS' /tmp/body
          grep -Fq 'LEADERSHIP ACTION' /tmp/body
          grep -Fq 'NEXT · EP05' /tmp/body
          grep -Fq '/guides/growth-leadership/literature#ep05' /tmp/body

          check_200 "https://aijoylab.kr/guides/growth-leadership/playbook/performance-coaching?deploy=${GITHUB_SHA}"
