          node -e "const fs=require('fs'),z=require('zlib');const s=z.gunzipSync(fs.readFileSync('/tmp/weight-of-silence-interactive-v3.bin')).toString('utf8');if(!s.includes('<!doctype html')&&!s.includes('<html'))process.exit(1);if(!s.includes('악보의 쉼표 사이에 고여 있는 침묵의 무게'))process.exit(1);console.log('Reader payload strict gzip PASS')"

          check_follow_200 "https://aijoylab.kr/books/weight-of-silence/mindmap.html?deploy=${GITHUB_SHA}"
          grep -Fq '침묵' /tmp/body
          curl -fsS --max-time 20 "https://aijoylab.kr/books/weight-of-silence/mindmap-v3.bin?deploy=${GITHUB_SHA}" -o /tmp/weight-of-silence-mindmap-v3.bin
          node -e "const fs=require('fs'),z=require('zlib');const s=z.gunzipSync(fs.readFileSync('/tmp/weight-of-silence-mindmap-v3.bin')).toString('utf8');if(!s.includes('<!doctype html')&&!s.includes('<html'))process.exit(1);if(!s.includes('침묵'))process.exit(1);console.log('Mindmap payload strict gzip PASS')"

          check_200 "https://aijoylab.kr/articles/why-we-cannot-stand-silence?deploy=${GITHUB_SHA}"
          grep -Fq '침묵의 기술' /tmp/body
          grep -Fq 'JoyLab 성장·리더십 프레임워크' /tmp/body
          grep -Fq '/guides/growth-leadership' /tmp/body

          check_200 "https://aijoylab.kr/articles/bach-counterpoint-order-in-chaos?deploy=${GITHUB_SHA}"
          grep -Fq '침묵의 기술' /tmp/body
          grep -Fq 'JoyLab 성장·리더십 프레임워크' /tmp/body

