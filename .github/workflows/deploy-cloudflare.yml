          grep -Fq 'https://aijoylab.kr/articles/foreign-investor-flow' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/samsung-electronics-outlook' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/sk-hynix-outlook' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/samsung-vs-sk-hynix-ai-memory' /tmp/body

          check_200 https://aijoylab.kr/rss.xml
          grep -Fq '<link>https://aijoylab.kr</link>' /tmp/body
          grep -Fq '삼성전자 vs SK하이닉스' /tmp/body

          legacy_https='https://aijoylab.kr/index.html'
          legacy_https_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$legacy_https")
          legacy_https_location=$(curl -sSI --max-time 20 "$legacy_https" | tr -d '\r' | awk 'tolower($1)=="location:" {$1=""; sub(/^ /,""); print; exit}')
          echo "$legacy_https_code $legacy_https -> $legacy_https_location"
          test "$legacy_https_code" = "301"
          test "$legacy_https_location" = "https://aijoylab.kr/"

          legacy_http='http://aijoylab.kr/index.html'
          legacy_http_final=$(curl -LsS -o /dev/null -w '%{url_effective}' --max-time 20 "$legacy_http")
          echo "$legacy_http -> $legacy_http_final"
          test "$legacy_http_final" = "https://aijoylab.kr/"

          www_url='https://www.aijoylab.kr/articles/samsung-vs-sk-hynix-ai-memory'
          www_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$www_url")
          www_location=$(curl -sSI --max-time 20 "$www_url" | tr -d '\r' | awk 'tolower($1)=="location:" {$1=""; sub(/^ /,""); print; exit}')
          echo "$www_code $www_url -> $www_location"
          test "$www_code" = "301"
          test "$www_location" = "https://aijoylab.kr/articles/samsung-vs-sk-hynix-ai-memory"

          echo 'Production smoke test passed.'

      - name: Install Production Reader QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Production Mobile Visual GOLD QA
        if: ${{ !cancelled() }}
        id: production_mobile_visual_qa
        env:
          QA_BASE_URL: https://aijoylab.kr
        run: node scripts/qa-mobile-visual-regression-v1.mjs

      - name: Production Responsive Visual GOLD QA
        if: ${{ !cancelled() }}
        id: production_responsive_visual_qa
        env:
          QA_BASE_URL: https://aijoylab.kr
        run: node scripts/qa-responsive-visual-v2.mjs

      - name: Weight of Silence Production Reader GOLD QA
        if: ${{ !cancelled() }}
        id: production_reader_qa
        env:
          QA_BASE_URL: https://aijoylab.kr
        run: node scripts/qa-weight-of-silence-reader.mjs

      - name: Weight of Silence Production Mindmap GOLD QA
        if: ${{ !cancelled() }}
        id: production_mindmap_qa
        env:
          QA_BASE_URL: https://aijoylab.kr
        run: node scripts/qa-weight-of-silence-mindmap.mjs

      - name: Upload Production Mobile Visual GOLD QA
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-mobile-visual-gold
          path: qa-artifacts/mobile-visual-regression-v1
          if-no-files-found: error
          retention-days: 30

      - name: Upload Production Responsive Visual GOLD QA
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-responsive-visual-gold
          path: qa-artifacts/responsive-visual-gate-v2
          if-no-files-found: error
          retention-days: 30

      - name: Upload Production Reader GOLD QA
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weight-of-silence-production-reader-gold
          path: qa-artifacts/weight-of-silence-reader
          if-no-files-found: error
          retention-days: 30

      - name: Upload Production Mindmap GOLD QA
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weight-of-silence-production-mindmap-gold
          path: qa-artifacts/weight-of-silence-mindmap
          if-no-files-found: error
          retention-days: 30

      - name: JoyLab Release Gate V1
        if: always()
        env:
          RELEASE_BUILD_RESULT: ${{ steps.build_site.outcome }}
          RELEASE_DEPLOY_RESULT: ${{ steps.cloudflare_deploy.outcome }}
          RELEASE_DOMAIN_RESULT: ${{ steps.custom_domain.outcome }}
          RELEASE_SMOKE_RESULT: ${{ steps.production_smoke.outcome }}
          RELEASE_MOBILE_VISUAL_QA_RESULT: ${{ steps.production_mobile_visual_qa.outcome }}
          RELEASE_RESPONSIVE_VISUAL_QA_RESULT: ${{ steps.production_responsive_visual_qa.outcome }}
          RELEASE_READER_QA_RESULT: ${{ steps.production_reader_qa.outcome }}
          RELEASE_MINDMAP_QA_RESULT: ${{ steps.production_mindmap_qa.outcome }}
        run: node scripts/write-release-gate-v1.mjs

      - name: Upload JoyLab Release Gate V1
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: joylab-release-gate-v1
          path: qa-artifacts/release-gate/release-gate.json
          if-no-files-found: error
          retention-days: 90

