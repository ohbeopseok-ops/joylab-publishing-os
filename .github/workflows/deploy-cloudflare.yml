name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Wait for custom domain
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if curl -fsS --max-time 15 https://aijoylab.kr/ >/dev/null; then
              echo "aijoylab.kr is reachable"
              exit 0
            fi
            echo "Waiting for DNS/TLS propagation ($i/18)..."
            sleep 10
          done
          echo "aijoylab.kr did not become reachable in time"
          exit 1

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail

          check_200() {
            url="$1"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$url")
            echo "$code $url"
            test "$code" = "200"
            test -s /tmp/body
          }

          check_200 https://aijoylab.kr/
          grep -Fq 'JoyLab' /tmp/body
          grep -Fq 'https://aijoylab.kr/' /tmp/body
          grep -Fq 'content-search' /tmp/body
          grep -Fq 'tag-filter' /tmp/body
          grep -Fq 'load-more' /tmp/body
          grep -Fq '/guides/semiconductor-investing' /tmp/body

          check_200 https://aijoylab.kr/guides/semiconductor-investing
          grep -Fq '반도체 투자 가이드' /tmp/body
          grep -Fq '/articles/what-is-hbm' /tmp/body
          grep -Fq '/articles/semiconductor-cycle' /tmp/body
          grep -Fq '/articles/foreign-investor-flow' /tmp/body
          grep -Fq '/articles/samsung-electronics-outlook' /tmp/body
          grep -Fq '/articles/sk-hynix-outlook' /tmp/body
          grep -Fq '/articles/samsung-vs-sk-hynix-ai-memory' /tmp/body

          check_200 https://aijoylab.kr/articles/what-is-hbm
          grep -Fq 'HBM' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/what-is-hbm' /tmp/body
          grep -Fq '/guides/semiconductor-investing' /tmp/body
          grep -Fq 'reading-progress' /tmp/body
          grep -Fq 'article-toc-list' /tmp/body
          grep -Fq 'back-to-top' /tmp/body
          grep -Fq 'data-reader-size="large"' /tmp/body
          grep -Fq 'focus-reading' /tmp/body

          check_200 https://aijoylab.kr/articles/semiconductor-cycle
          grep -Fq '반도체' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/semiconductor-cycle' /tmp/body

          check_200 https://aijoylab.kr/articles/foreign-investor-flow
          grep -Fq '외국인 수급' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/foreign-investor-flow' /tmp/body

          check_200 https://aijoylab.kr/articles/samsung-electronics-outlook
          grep -Fq '삼성전자 주가 전망' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/samsung-electronics-outlook' /tmp/body

          check_200 https://aijoylab.kr/articles/sk-hynix-outlook
          grep -Fq 'SK하이닉스 주가 전망' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/sk-hynix-outlook' /tmp/body

          check_200 https://aijoylab.kr/articles/samsung-vs-sk-hynix-ai-memory
          grep -Fq '삼성전자 vs SK하이닉스' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/samsung-vs-sk-hynix-ai-memory' /tmp/body
          grep -Fq 'compare-scorecard' /tmp/body
          grep -Fq 'AI 성장 우선' /tmp/body
          grep -Fq 'data-total="samsung"' /tmp/body

          check_200 https://aijoylab.kr/about
          grep -Fq 'ABOUT JOYLAB' /tmp/body

          check_200 https://aijoylab.kr/contact
          grep -Fq 'CONTACT' /tmp/body

          check_200 https://aijoylab.kr/privacy
          grep -Fq '개인정보처리 안내' /tmp/body

          check_200 https://aijoylab.kr/robots.txt
          grep -Fq 'Sitemap: https://aijoylab.kr/sitemap.xml' /tmp/body

          check_200 https://aijoylab.kr/sitemap.xml
          grep -Fq '<loc>https://aijoylab.kr/</loc>' /tmp/body
          grep -Fq 'https://aijoylab.kr/about' /tmp/body
          grep -Fq 'https://aijoylab.kr/contact' /tmp/body
          grep -Fq 'https://aijoylab.kr/privacy' /tmp/body
          grep -Fq 'https://aijoylab.kr/guides/semiconductor-investing' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/what-is-hbm' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/semiconductor-cycle' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/foreign-investor-flow' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/samsung-electronics-outlook' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/sk-hynix-outlook' /tmp/body
          grep -Fq 'https://aijoylab.kr/articles/samsung-vs-sk-hynix-ai-memory' /tmp/body

          check_200 https://aijoylab.kr/rss.xml
          grep -Fq '<link>https://aijoylab.kr</link>' /tmp/body
          grep -Fq '삼성전자 vs SK하이닉스' /tmp/body

          www_url='https://www.aijoylab.kr/articles/samsung-vs-sk-hynix-ai-memory'
          www_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$www_url")
          www_location=$(curl -sSI --max-time 20 "$www_url" | tr -d '\r' | awk 'tolower($1)=="location:" {$1=""; sub(/^ /,""); print; exit}')
          echo "$www_code $www_url -> $www_location"
          test "$www_code" = "301"
          test "$www_location" = "https://aijoylab.kr/articles/samsung-vs-sk-hynix-ai-memory"

          echo 'Production smoke test passed.'
