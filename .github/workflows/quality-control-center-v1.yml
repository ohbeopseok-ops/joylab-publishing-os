name: JoyLab Quality Control Center V1

on:
  schedule:
    - cron: "45 22 * * *"
  pull_request:
    branches: [main]
    paths:
      - 'scripts/generate-official-execution-queue-v1.mjs'
      - 'scripts/generate-ranking-drift-v1.mjs'
      - 'scripts/generate-today-fix-cards-v1.mjs'
      - 'scripts/generate-quality-control-center-v1.mjs'
      - 'scripts/rank-first-content-entry-v1.mjs'
      - 'src/data/first-content-priority-v1.json'
      - 'src/pages/articles/[...slug].astro'
      - '.github/workflows/quality-control-center-v1.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/rank-business-impact-effort-v2.mjs'
      - 'scripts/generate-official-execution-queue-v1.mjs'
      - 'scripts/generate-ranking-drift-v1.mjs'
      - 'scripts/generate-today-fix-cards-v1.mjs'
      - 'scripts/generate-quality-control-center-v1.mjs'
      - 'scripts/fetch-business-impact-signals-v1.mjs'
      - 'scripts/rank-business-impact-debt-v1.mjs'
      - 'scripts/fetch-rum-web-vitals-v1.mjs'
      - 'src/data/first-content-priority-v1.json'
      - '.github/workflows/quality-control-center-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-control-center:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT_DIR: qa-artifacts/quality-control-center-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Visual Asset Contract V4
        continue-on-error: true
        run: node scripts/check-visual-asset-contract-v4.mjs

      - name: Build Visual Quality Dashboard V1
        if: always()
        run: node scripts/build-visual-quality-dashboard-v1.mjs

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/qc-preview.log 2>&1 &
          echo $! > /tmp/qc-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qc-preview.log
          exit 1

      - name: First Content Entry Budget V1
        continue-on-error: true
        run: node scripts/check-first-content-entry-budget-v1.mjs

      - name: First Content Ranking V1
        continue-on-error: true
        run: node scripts/rank-first-content-entry-v1.mjs

      - name: Mobile Font Rendering Gate V1
        continue-on-error: true
        run: node scripts/check-mobile-experience-contract-v1.mjs

      - name: Install Lighthouse
        run: npm install --no-save --package-lock=false lighthouse@12.8.2

      - name: Run Lighthouse mobile 390 and 430
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/mobile-experience-contract-v1
          for spec in "home|/" "articles|/articles" "giant-shoulder|/articles/semiconductor-giant-shoulder-flow" "investing-guide|/guides/investing"; do
            name="${spec%%|*}"
            route="${spec#*|}"
            for viewport in "iphone-390|390|844" "iphone-430|430|932"; do
              vp="${viewport%%|*}"
              rest="${viewport#*|}"
              width="${rest%%|*}"
              height="${rest#*|}"
              npx lighthouse "http://127.0.0.1:4321${route}"                 --quiet                 --output=json                 --output-path="qa-artifacts/mobile-experience-contract-v1/lighthouse-${name}-${vp}.json"                 --only-categories=performance                 --form-factor=mobile                 --screenEmulation.mobile=true                 --screenEmulation.width="${width}"                 --screenEmulation.height="${height}"                 --screenEmulation.deviceScaleFactor=1                 --throttling-method=provided                 --throttling.cpuSlowdownMultiplier=1                 --chrome-flags="--headless --no-sandbox"
            done
          done

      - name: Mobile Lighthouse Budget V1
        continue-on-error: true
        run: node scripts/check-mobile-lighthouse-v1.mjs

      - name: Real User Experience Gate V1
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN }}
          RUM_DAYS: "7"
          RUM_MIN_SAMPLES: "20"
          RUM_OUT: qa-artifacts/real-user-experience-gate-v1/rum.json
        run: node scripts/fetch-rum-web-vitals-v1.mjs

      - name: Experience Debt Ranking V1
        if: always()
        continue-on-error: true
        run: node scripts/rank-experience-debt-v1.mjs

      - name: Fetch GSC business signals
        if: always()
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: sc-domain:aijoylab.kr
          GSC_PAGE_ROW_LIMIT: "1000"
        run: node scripts/report-gsc-7d.mjs

      - name: Fetch AdSense page-level business signals
        if: always()
        continue-on-error: true
        env:
          ADSENSE_OAUTH_CLIENT_ID: ${{ secrets.ADSENSE_OAUTH_CLIENT_ID }}
          ADSENSE_OAUTH_CLIENT_SECRET: ${{ secrets.ADSENSE_OAUTH_CLIENT_SECRET }}
          ADSENSE_OAUTH_REFRESH_TOKEN: ${{ secrets.ADSENSE_OAUTH_REFRESH_TOKEN }}
          ADSENSE_ACCOUNT_RESOURCE: ${{ vars.ADSENSE_ACCOUNT_RESOURCE }}
          ADSENSE_SITE_DOMAIN: aijoylab.kr
          ADSENSE_PAGE_PREFIX: /articles/
          ADSENSE_REPORT_DAYS: "7"
          ADSENSE_METRICS_OUT: qa-artifacts/business-impact-signals-v1/adsense.json
        run: node scripts/fetch-adsense-metrics-v1.mjs

      - name: Compose business impact signals
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_READ_TOKEN }}
          BUSINESS_SIGNAL_DAYS: "7"
          BUSINESS_GSC_JSON: qa-artifacts/gsc-7d/gsc-7d.json
          BUSINESS_ADSENSE_JSON: qa-artifacts/business-impact-signals-v1/adsense.json
          BUSINESS_SIGNALS_OUT: qa-artifacts/business-impact-signals-v1/signals.json
        run: node scripts/fetch-business-impact-signals-v1.mjs

      - name: Business Impact Debt Ranking V1
        if: always()
        continue-on-error: true
        run: node scripts/rank-business-impact-debt-v1.mjs

      - name: Business Impact × Effort Ranking V2
        if: always()
        continue-on-error: true
        run: node scripts/rank-business-impact-effort-v2.mjs

      - name: Official Execution Queue V1
        if: always()
        run: node scripts/generate-official-execution-queue-v1.mjs

      - name: Ranking Drift Report V1
        if: always()
        run: node scripts/generate-ranking-drift-v1.mjs

      - name: Today Fix Cards V1
        if: always()
        run: node scripts/generate-today-fix-cards-v1.mjs

      - name: Generate Quality Control Center V1
        if: always()
        run: node scripts/generate-quality-control-center-v1.mjs

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "# JoyLab Quality Control Center V1"
            echo
            if [ -f "$OUT_DIR/dashboard.json" ]; then
              node -e "const j=require('./$OUT_DIR/dashboard.json'); console.log('Overall: **'+j.overall+'**'); console.log(''); console.log(JSON.stringify(j.status,null,2))"
            else
              echo "Dashboard missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/qc-preview.pid ]; then kill "$(cat /tmp/qc-preview.pid)" || true; fi

      - name: Upload Quality Control Center
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: joylab-quality-control-center-v1
          path: |
            qa-artifacts/visual-asset-contract-v4
            qa-artifacts/visual-quality-dashboard-v1
            qa-artifacts/first-content-entry-budget-v1
            qa-artifacts/first-content-ranking-v1
            qa-artifacts/mobile-experience-contract-v1
            qa-artifacts/real-user-experience-gate-v1
            qa-artifacts/experience-debt-ranking-v1
            qa-artifacts/gsc-7d
            qa-artifacts/business-impact-signals-v1
            qa-artifacts/business-impact-debt-v1
            qa-artifacts/business-impact-effort-v2
            qa-artifacts/official-execution-queue-v1
            qa-artifacts/ranking-drift-v1
            qa-artifacts/today-fix-cards-v1
            qa-artifacts/quality-control-center-v1
          if-no-files-found: warn
          retention-days: 90
