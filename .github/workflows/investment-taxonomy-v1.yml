name: Investment Taxonomy V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/articles/**'
      - 'src/content.config.ts'
      - 'src/lib/investment-taxonomy.ts'
      - 'config/investment-taxonomy-v1.json'
      - 'scripts/check-investment-taxonomy-v1.mjs'
      - 'src/pages/guides/investing.astro'
      - 'src/styles/investment-hub-v2.css'
  push:
    branches: [main]
    paths:
      - 'src/data/articles/**'
      - 'src/content.config.ts'
      - 'src/lib/investment-taxonomy.ts'
      - 'config/investment-taxonomy-v1.json'
      - 'scripts/check-investment-taxonomy-v1.mjs'
      - 'src/pages/guides/investing.astro'
      - 'src/styles/investment-hub-v2.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate Industry × Thesis × Company taxonomy
        env:
          INVESTMENT_TAXONOMY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-investment-taxonomy-v1.mjs
