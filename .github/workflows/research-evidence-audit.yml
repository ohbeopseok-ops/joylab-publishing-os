name: Research Evidence Audit

on:
  schedule:
    - cron: '5 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-evidence-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate Evidence Engine
        run: node scripts/research-evidence-engine.mjs

      - name: Upload Evidence Audit
        uses: actions/upload-artifact@v4
        with:
          name: research-evidence-audit
          path: artifacts/research-evidence-audit.json
          if-no-files-found: error
