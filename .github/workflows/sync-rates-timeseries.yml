name: Sync Rates 30D

on:
  schedule:
    - cron: '15 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: sync-rates-timeseries
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Rates sync self-test
        run: npm run rates:self-test

      - name: Risk delta attribution self-test
        run: npm run risk-history:self-test

      - name: Fetch 30-observation market data
        run: npm run rates:sync

      - name: Recompute and persist Risk Delta Attribution
        run: npm run risk-history:update

      - name: Validate generated JSON
        shell: bash
        run: |
          set -euo pipefail
          node -e "const d=require('./src/data/rates-timeseries.json'); if(!d.ready) process.exit(1); for (const k of ['us10y','us30y','usdkrw']) if(d.series[k].points.length!==30) process.exit(1); if(!d.treasuryRiskIndex.deltaAttribution && !require('./src/data/treasury-risk-history.json').snapshots.length) process.exit(1); console.log(d.asOf,d.marketRisk,d.treasuryRiskIndex)"
          node -e "JSON.parse(require('node:fs').readFileSync('src/data/rates-dashboard.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('src/data/treasury-risk-history.json','utf8'))"

      - name: Commit updated rates data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/rates-timeseries.json src/data/rates-dashboard.json src/data/treasury-risk-history.json; then
            echo 'No rates data changes.'
            exit 0
          fi
          git config user.name 'JoyLab Rates Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/data/rates-timeseries.json src/data/rates-dashboard.json src/data/treasury-risk-history.json
          git commit -m 'data: refresh 30d Treasury signals and delta history'
          BRANCH="bot/sync-rates-timeseries"
          git checkout -B "$BRANCH"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          PR_NUMBER="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" --title "data: refresh 30d Treasury signals" --body "Automated rates refresh. Auto-merges after the build check passes."
          fi
          gh pr merge "$BRANCH" --auto --squash || echo "Auto-merge could not be enabled; check the PR."
          gh workflow run build.yml --ref "$BRANCH"
