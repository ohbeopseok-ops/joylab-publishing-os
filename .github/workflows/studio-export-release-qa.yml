name: Studio Export Release QA (manual only)

# Book export validation is an explicit release operation, not part of every site deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-export-release-qa
  cancel-in-progress: false

jobs:
  verify-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java for EPUBCheck
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install font and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils unzip

      - name: Install dependencies
        run: npm ci

      - name: Build site and EPUB export
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Generate Studio Print PDF
        run: npm run studio:print

      - name: Validate Studio Print PDF
        run: npm run studio:pdf:preflight

      - name: EPUBCheck 5.4.0
        run: |
          curl -fL --retry 3 -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          java -jar /tmp/epubcheck/epubcheck-5.4.0/epubcheck.jar dist/studio/exports/series-02-memory-debt.epub

      - name: Generate Studio export provenance
        run: npm run studio:provenance

      - name: Upload verified Studio export package
        uses: actions/upload-artifact@v6
        with:
          name: studio-exports-verified-${{ github.sha }}
          path: |
            dist/studio/exports/series-02-memory-debt.epub
            dist/studio/exports/series-02-memory-debt-print.pdf
            dist/studio/exports/export-provenance-v1.json
          if-no-files-found: error
          retention-days: 30
