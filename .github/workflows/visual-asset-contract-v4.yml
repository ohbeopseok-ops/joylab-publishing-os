name: Visual Asset Contract V4

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/articles/**'
      - 'src/data/articles/**'
      - 'src/data/research-image-manifest.json'
      - 'src/data/article-image-overrides.json'
      - 'src/data/curated-research-images.json'
      - 'src/data/curated-generated-heroes.json'
      - 'src/data/visual-asset-contract-v4.json'
      - 'public/images/**'
      - 'scripts/check-visual-asset-contract-v4.mjs'
      - 'scripts/apply-curated-research-images.mjs'
      - '.github/workflows/visual-asset-contract-v4.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/articles/**'
      - 'src/data/articles/**'
      - 'src/data/research-image-manifest.json'
      - 'src/data/article-image-overrides.json'
      - 'src/data/curated-research-images.json'
      - 'src/data/curated-generated-heroes.json'
      - 'src/data/visual-asset-contract-v4.json'
      - 'public/images/**'
      - 'scripts/check-visual-asset-contract-v4.mjs'
      - 'scripts/apply-curated-research-images.mjs'
      - '.github/workflows/visual-asset-contract-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-asset-contract-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build site with materialized research assets
        run: npm run build

      - name: Validate Hero + Supporting + OG contract
        run: node scripts/check-visual-asset-contract-v4.mjs

      - name: Upload V4 report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-asset-contract-v4
          path: qa-artifacts/visual-asset-contract-v4/report.json
          if-no-files-found: error
          retention-days: 30
