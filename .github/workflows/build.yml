name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Korean font for book artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install locked dependencies
        run: npm ci

      - name: Materialize EP03 Demian v5
        run: node scripts/materialize-ep03-demian-v5.mjs

      - name: Gold baseline guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-gold-baseline.mjs

      - name: Research Image Gate
        run: node scripts/check-research-images.mjs

      - name: Hero Quality Gate V2
        run: npm run check:heroes

      - name: Visual Audit Runtime
        run: node scripts/audit-visual-system.mjs

      - name: Check runtime syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-ep03-demian-v5.mjs
          node --check scripts/audit-visual-system.mjs
          node --check scripts/sync-cloudflare-visual-metrics.mjs
          node --check scripts/sync-gsc-visual-metrics.mjs
          node --check scripts/visual-upgrade-runtime.mjs
          node --check scripts/report-homepage-funnel.mjs
          node --check scripts/qa-homepage-viewports.mjs
          node --check scripts/qa-article-archive-gold.mjs
          node --check scripts/qa-article-pc-gold.mjs
          node --check scripts/qa-about-activation.mjs
          node --check scripts/qa-mobile-ui-v1.mjs
          node --check scripts/submit-indexnow.mjs
          node --check scripts/report-gsc-7d.mjs
          node --check scripts/build-distribution-pack.mjs
          node --check scripts/check-asset-contract-v3.mjs
          node --check scripts/check-legacy-asset-cleanup.mjs
          node --check scripts/write-release-gate-v1.mjs
          node --check scripts/check-indexability.mjs
          node --check scripts/check-legacy-public-email.mjs
          node --check scripts/check-official-channel-contract.mjs
          node scripts/report-homepage-funnel.mjs --self-test
          node scripts/submit-indexnow.mjs --self-test
          node scripts/report-gsc-7d.mjs --self-test
          node scripts/build-distribution-pack.mjs --self-test

      - name: Distribution OS real-article smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-distribution-pack.mjs --slug anthropic-ipo-ai-safety-2026
          test -f distribution/generated/anthropic-ipo-ai-safety-2026/manifest.json
          test -f distribution/generated/anthropic-ipo-ai-safety-2026/threads.md
          test -f distribution/generated/anthropic-ipo-ai-safety-2026/x.md
          test -f distribution/generated/anthropic-ipo-ai-safety-2026/linkedin.md
          test -f distribution/generated/anthropic-ipo-ai-safety-2026/naver.md
          grep -Fq '"campaign": "research_anthropic-ipo-ai-safety-2026"' distribution/generated/anthropic-ipo-ai-safety-2026/manifest.json
          grep -Fq 'utm_source=threads' distribution/generated/anthropic-ipo-ai-safety-2026/manifest.json
          grep -Fq 'utm_source=x' distribution/generated/anthropic-ipo-ai-safety-2026/manifest.json
          grep -Fq 'utm_source=linkedin' distribution/generated/anthropic-ipo-ai-safety-2026/manifest.json
          grep -Fq 'utm_source=naver' distribution/generated/anthropic-ipo-ai-safety-2026/manifest.json

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Full dependency audit snapshot
        run: npm audit || true

      - name: Test Click Analytics V3 Worker contract
        run: node scripts/test-click-analytics.mjs

      - name: Check Production Health script syntax
        run: node --check scripts/check-production-health.mjs

      - name: Check Configuration Drift script syntax
        run: node --check scripts/check-configuration-drift.mjs

      - name: Validate production configuration baseline JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('config/production-baseline.json','utf8'))"

      - name: Build Astro site
        run: npm run build

      - name: Investment Primary Source Gate V1
        env:
          PRIMARY_SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-investment-primary-sources-v1.mjs

      - name: AdSense Policy Audit V1
        run: node scripts/audit-adsense-policy-v1.mjs

      - name: AdSense Identity Contract Gate
        run: node scripts/check-adsense-contract.mjs

      - name: Legacy Public Email Gate
        run: node scripts/check-legacy-public-email.mjs

      - name: Official Channel Contract Gate
        run: node scripts/check-official-channel-contract.mjs

      - name: Asset Integrity Gate
        run: node scripts/check-asset-integrity.mjs

      - name: Asset Contract V3
        run: node scripts/check-asset-contract-v3.mjs

      - name: Reader Binary Immutable Asset Gate
        run: node scripts/check-reader-binary-immutability.mjs

      - name: Legacy Asset Cleanup Gate
        run: node scripts/check-legacy-asset-cleanup.mjs

      - name: Indexability Gate
        run: node scripts/check-indexability.mjs

      - name: Verify JoyLab identity schema
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'id="joylab-identity-schema"' dist/index.html
          grep -Fq '"@id":"https://aijoylab.kr/#organization"' dist/index.html
          grep -Fq '"@id":"https://aijoylab.kr/#website"' dist/index.html
          grep -Fq '"@id":"https://aijoylab.kr/#founder"' dist/index.html
          grep -Fq 'https://x.com/ohbeopseok' dist/index.html
          grep -Fq 'https://www.youtube.com/@JoyLabResearch' dist/index.html
          grep -Fq 'https://www.threads.com/@ohbeopseok' dist/index.html
          grep -Fq 'https://www.linkedin.com/in/%EB%B2%95%EC%84%9D-%EC%98%A4-b3273633b/' dist/index.html
          grep -Fq 'OFFICIAL CHANNELS' dist/about/index.html
          grep -Fq 'data-analytics-target="x"' dist/about/index.html
          grep -Fq 'data-analytics-target="youtube"' dist/about/index.html
          grep -Fq 'https://www.youtube.com/@JoyLabResearch' dist/about/index.html
          grep -Fq 'https://www.youtube.com/@JoyLabResearch' dist/contact/index.html
          grep -Fq '오법석 · AIJoyLab' dist/about/index.html
          test "$(tr -d '\r\n' < dist/1793952a193325da594f7015ca133737.txt)" = '1793952a193325da594f7015ca133737'

      - name: Verify Research SEO contract
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/articles/index.html
          grep -Fq '<link rel="canonical" href="https://aijoylab.kr/articles"' dist/articles/index.html
          grep -Fq 'CollectionPage' dist/articles/index.html
          grep -Fq '/articles/what-is-hbm' dist/articles/index.html
          grep -Fq '"dateModified":' dist/articles/what-is-hbm/index.html
          grep -Fq '"mainEntityOfPage":' dist/articles/what-is-hbm/index.html
          grep -Fq '"@id":"https://aijoylab.kr/#website"' dist/articles/what-is-hbm/index.html

      - name: Verify Click Analytics V3 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"binding": "JOYLAB_ANALYTICS"' wrangler.jsonc
          grep -Fq '"dataset": "joylab_events_v1"' wrangler.jsonc
          grep -Fq "url.pathname === '/__analytics/event'" worker/index.js
          grep -Fq "contact_mail_click" worker/index.js
          grep -Fq "social_click" worker/index.js
          grep -Fq "article_view" worker/index.js
          grep -Fq "article_dwell_60" worker/index.js
          grep -Fq "article_internal_link_click" worker/index.js
          grep -Fq "home_section_impression" worker/index.js
          grep -Fq "home_section_click" worker/index.js
          grep -Fq "smoke_test" worker/index.js
          grep -Fq "/__analytics/event" dist/index.html
          grep -Fq "home_section_impression" dist/index.html
          grep -Fq "home_section_click" dist/index.html
          grep -Fq 'data-analytics-event="social_click"' dist/index.html
          grep -Fq 'data-analytics-placement="about"' dist/about/index.html
          grep -R -Fq 'data-analytics-event="article_contact_click"' dist/articles
          grep -R -Fq "article_dwell_60" dist/articles
          grep -R -Fq 'Cloudflare Workers Analytics Engine' dist/privacy
          grep -R -Fq '60초 이상 활성 체류' dist/privacy
          grep -R -Fq '에디터 추천·주요 리서치·최신 업데이트·Research Guide' dist/privacy

      - name: Install Playwright QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Astro preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/joylab-preview.log 2>&1 &
          echo $! > /tmp/joylab-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/joylab-preview.log
          exit 1

      - name: Homepage viewport QA
        run: node scripts/qa-homepage-viewports.mjs

      - name: Article Detail and Archive GOLD QA
        run: node scripts/qa-article-archive-gold.mjs

      - name: Article Detail PC GOLD QA
        run: node scripts/qa-article-pc-gold.mjs

      - name: About Activation PC/Mobile GOLD QA
        run: node scripts/qa-about-activation.mjs

      - name: Mobile UI V1 GOLD QA
        run: node scripts/qa-mobile-ui-v1.mjs

      - name: Growth Literature PC/Mobile GOLD QA
        run: node scripts/qa-growth-literature-gold.mjs

      - name: Stop Astro preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/joylab-preview.pid ]; then kill "$(cat /tmp/joylab-preview.pid)" || true; fi

      - name: Upload Homepage GOLD QA screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: homepage-gold-qa
          path: qa-artifacts/homepage
          if-no-files-found: warn

      - name: Upload Article Archive GOLD QA screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: article-archive-gold-qa
          path: qa-artifacts/article-archive
          if-no-files-found: warn

      - name: Upload Article PC GOLD QA screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: article-pc-gold-qa
          path: qa-artifacts/article-pc
          if-no-files-found: warn

      - name: Upload About Activation GOLD QA screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: about-activation-gold-qa
          path: qa-artifacts/about-activation
          if-no-files-found: warn

      - name: Upload Mobile UI V1 GOLD QA screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-ui-v1-gold-qa
          path: qa-artifacts/mobile-ui-v1

      - name: Upload Growth Literature GOLD QA screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: growth-literature-gold-qa
          path: qa-artifacts/growth-literature-gold
          if-no-files-found: warn

      - name: Upload AdSense Policy Audit V1
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: adsense-policy-audit-v1
          path: qa-artifacts/adsense-policy-audit-v1
          if-no-files-found: error

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: joylab-dist
          path: dist
