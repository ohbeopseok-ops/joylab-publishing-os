name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Gold baseline guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-gold-baseline.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Full dependency audit snapshot
        run: npm audit || true

      - name: Build Astro site
        run: npm run build

      - name: Verify JoyLab identity schema
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'id="joylab-identity-schema"' dist/index.html
          grep -Fq '"@id":"https://aijoylab.kr/#organization"' dist/index.html
          grep -Fq '"@id":"https://aijoylab.kr/#founder"' dist/index.html
          grep -Fq '"sameAs":["https://blog.naver.com/joy014","https://www.instagram.com/aijoylab/"]' dist/index.html
          grep -Fq '"sameAs":["https://www.threads.com/@ohbeopseok","https://www.linkedin.com/in/%EB%B2%95%EC%84%9D-%EC%98%A4-b3273633b/"]' dist/index.html

      - name: Verify Click Analytics V1 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"binding": "JOYLAB_ANALYTICS"' wrangler.jsonc
          grep -Fq '"dataset": "joylab_events_v1"' wrangler.jsonc
          grep -Fq "url.pathname === '/__analytics/event'" worker/index.js
          grep -Fq "contact_mail_click" worker/index.js
          grep -Fq "social_click" worker/index.js
          grep -Fq "smoke_test" worker/index.js
          grep -Fq "/__analytics/event" dist/index.html
          grep -Fq 'data-analytics-event="social_click"' dist/index.html
          grep -R -Fq 'data-analytics-event="article_contact_click"' dist/articles
          grep -R -Fq 'Cloudflare Workers Analytics Engine' dist/privacy

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: joylab-dist
          path: dist
