name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Gold baseline guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-gold-baseline.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Full dependency audit snapshot
        run: npm audit || true

      - name: Build Astro site
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: joylab-dist
          path: dist
