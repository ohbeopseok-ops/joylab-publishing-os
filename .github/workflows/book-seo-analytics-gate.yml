name: Book SEO Analytics Gate

on:
  pull_request:
    paths:
      - 'src/components/BookSchema.astro'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/books/**'
      - 'src/components/AnalyticsEvents.astro'
      - 'scripts/check-book-seo-analytics.mjs'
      - '.github/workflows/book-seo-analytics-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Astro build
        run: npm run build

      - name: Book SEO and analytics contract
        run: node scripts/check-book-seo-analytics.mjs
