name: Mobile Article Monetization Order V1

on:
  workflow_dispatch:

jobs:
  mobile-order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/joylab-preview.log 2>&1 &
          echo $! > /tmp/joylab-preview.pid
      - name: Wait for preview
        run: |
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4321/articles/samsung-vs-sk-hynix-ai-memory > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/joylab-preview.log
          exit 1
      - run: npm run mobile-article:monetization-order
