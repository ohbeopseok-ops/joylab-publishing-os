name: Video Engine GOLD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-engine-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check Video Engine runtime syntax
        run: node --check scripts/check-video-engine.mjs
      - name: Video Engine GOLD V0.1
        run: node scripts/check-video-engine.mjs
