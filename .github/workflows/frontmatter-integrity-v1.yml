name: Frontmatter Integrity Gate V1

# Gate contract: scan all article frontmatter before Astro build.

on:
  pull_request:
    paths:
      - "src/data/articles/**/*.md"
      - "scripts/check-frontmatter-integrity-v1.mjs"
      - ".github/workflows/frontmatter-integrity-v1.yml"
  push:
    branches:
      - main
    paths:
      - "src/data/articles/**/*.md"
      - "scripts/check-frontmatter-integrity-v1.mjs"
      - ".github/workflows/frontmatter-integrity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontmatter-integrity:
    name: frontmatter-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scan all article frontmatter
        run: node scripts/check-frontmatter-integrity-v1.mjs
