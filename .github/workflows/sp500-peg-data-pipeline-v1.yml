name: S&P500 PEG Data Pipeline V1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-sp500-peg-series-v1.mjs'
      - 'config/sp500-peg-data-contract-v1.json'
      - 'docs/SP500_PEG_DATA_PIPELINE_V1.md'
      - '.github/workflows/sp500-peg-data-pipeline-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: PEG pipeline self-test
        run: node scripts/build-sp500-peg-series-v1.mjs --self-test
      - name: Validate data contract JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('config/sp500-peg-data-contract-v1.json','utf8'))"
