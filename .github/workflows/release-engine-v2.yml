name: Release Engine V2

on:
  workflow_dispatch:
    inputs:
      release_config:
        description: 'Release spec path, e.g. config/releases/series-02-v1.1.0.json'
        required: true
        type: string
      gold_run_id:
        description: 'Deploy workflow run id containing joylab-release-gate-v1'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate release candidate
        run: node scripts/release-engine-v2.mjs validate --config="${{ inputs.release_config }}"

      - name: Download GOLD release gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.gold_run_id }}
        run: |
          mkdir -p qa-artifacts/release-gate
          gh run download "$RUN_ID" -n joylab-release-gate-v1 -D qa-artifacts/release-gate
          test -f qa-artifacts/release-gate/release-gate.json

      - name: Promote RC to immutable Published manifest
        run: node scripts/release-engine-v2.mjs promote --config="${{ inputs.release_config }}" --gate=qa-artifacts/release-gate/release-gate.json

      - name: Create release branch
        id: branch
        env:
          CONFIG: ${{ inputs.release_config }}
        run: |
          set -euo pipefail
          VERSION=$(node -e "const s=require('./'\"$CONFIG\"');process.stdout.write(s.version)")
          PROJECT=$(node -e "const s=require('./'\"$CONFIG\"');process.stdout.write(s.projectId)")
          BRANCH="release/$PROJECT-v$VERSION-publish"
          git switch -c "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Commit Published manifest
        env:
          CONFIG: ${{ inputs.release_config }}
        run: |
          set -euo pipefail
          MANIFEST=$(node -e "const s=require('./'\"$CONFIG\"');process.stdout.write(s.manifestPath)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "release: publish $(node -e "const s=require('./'\"$CONFIG\"');process.stdout.write(s.releaseId)")"
          git push origin HEAD

      - name: Open Published release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          CONFIG: ${{ inputs.release_config }}
        run: |
          RELEASE_ID=$(node -e "const s=require('./'\"$CONFIG\"');process.stdout.write(s.releaseId)")
          gh pr create --base main --head "$BRANCH" --title "release: publish $RELEASE_ID" --body "Generated by JoyLab Release Engine V2 after GOLD release gate. Merge preserves protected-main review before Published manifest enters main."
